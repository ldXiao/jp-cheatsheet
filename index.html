const AGEN=[["a.tokoro-wo", "N1", "(although) at / while / in the middle of (polite apology)", "V plain / adj + ところを", "〜ところを is a polite / formal construction used when interrupting or apologizing for taking someone's time — 'while X (I apologize for disturbing)'. Common in business and formal speech, especially in the phrase お忙しいところを ('while you're busy'). Formal register.", ["Polite apology for interrupting — formal business register.", "Common fixed phrase: お忙しいところを (apologizing for taking busy time)."], "お忙しいところを、ありがとうございます。", "Thank you for your time despite being busy.", ["plain", "ところを", "ところを"], ["な", "ところを", "ところを"]], ["a.mo-nan-tomo-nai", "N1", "not even slightly / not at all", "i-adj 〜くもなんともない / na-adj + でもなんでもない", "〜くもなんともない / 〜でもなんでもない is an emphatic negation — 'not even slightly X' / 'not at all X'. Used to strongly deny that something has a quality. Conversational register, often in dismissive or surprised contexts.", ["Strong emphatic denial — 'not at all X, not even a bit'.", "Common for dismissing claims: 寒くもなんともない ('not cold at all'), 大したことでもなんでもない ('nothing important at all')."], "寒くもなんともない。", "I'm not cold at all.", ["stem", "くもなんともない", "くもなんともない"], null], ["a.ni-soui-nai", "N1", "no doubt / certainly / I'm sure", "Plain form + に相違ない", "〜に相違ない is a formal / literary equivalent of 〜に違いない ('must be'), expressing strong conviction — 'there is no doubt that X'. The noun 相違 literally means 'difference / discrepancy'. Very formal, common in written reports and formal analyses.", ["Formal / literary equivalent of 〜に違いない.", "Very common in formal writing: news, reports, essays."], "彼が犯人に相違ない。", "There's no doubt he's the culprit.", ["plain", "に相違ない", "にそういない"], null], ["a.mono-wo-if-only", "N1", "if only / you should have (regret)", "Plain form + ものを", "〜ものを expresses the speaker's regret or frustration that someone didn't do what would have been sensible — 'if only you had X' / 'you should have X, but didn't'. Literary register, often with an emotional / scolding nuance. Common paired with 〜たら / 〜ば.", ["Regret / frustration over someone's inaction or wrong action.", "Often paired with conditional: 言ってくれたらよかったものを ('if only you had told me')."], "早く言ってくれればよかったものを。", "If only you had told me sooner.", ["plain", "ものを", "ものを"], ["な", "ものを", "ものを"]], ["a.mai-ka-wonder", "N1", "I wonder if / isn't it possibly", "Plain form + のではあるまいか / Noun + ではあるまいか", "〜ではあるまいか is a literary way to express tentative speculation — 'I wonder if it might be X'. Uses the classical negative まい with か to form a doubtful question. Very formal / literary register, common in essays and reflective prose. Modern equivalent: 〜のではないだろうか.", ["Literary tentative doubt — 'I wonder if it isn't X'.", "Very formal / literary — modern equivalent is 〜のではないだろうか."], "これは間違いではあるまいか。", "I wonder if this isn't a mistake.", null, ["で", "はあるまいか", "はあるまいか"]], ["a.de-atta-to-shitemo", "N1", "even if it were / even assuming that (past hypothetical)", "Plain form + であったとしても", "〜であったとしても is a hypothetical concessive in the past — 'even if it had been X'. Similar in function to 〜としても but for past counterfactuals. Formal / literary register, common in reflective analysis.", ["Past hypothetical / counterfactual concession.", "Formal / reflective register."], "それが本当であったとしても、驚かない。", "Even if that were true, I wouldn't be surprised.", null, ["で", "あったとしても", "あったとしても"]], ["a.naku-te-nan-de-arou", "N1", "if not X, what else / what else could it be but X", "Noun + でなくてなんであろう", "〜なくてなんであろう is a rhetorical literary expression meaning 'if this isn't X, what else is it?' — emphatically affirming X by suggesting no other interpretation is possible. Very literary / rhetorical register, common in emotional assertions.", ["Rhetorical affirmation — 'what else could it be?'", "Very literary / formal register."], "これが愛でなくてなんであろう。", "If this isn't love, what else could it be?", null, ["で", "なくてなんであろう", "なくてなんであろう"]], ["a.nagara-mo", "N1", "although / even while / despite", "V ます-stem / i-adj / noun + ながらも", "〜ながらも is a literary concessive meaning 'although / even while X, Y'. Similar to 〜ながら (simultaneous) but with concessive nuance — the main clause is unexpected or contrasting. Formal / literary register.", ["Concessive — 'although X, Y'.", "Distinct from 〜ながら (neutral simultaneity)."], "小さいながらも、立派な家だ。", "Small though it is, it's a splendid house.", ["plain", "ながらも", "ながらも"], ["で", "ありながらも", "ありながらも"]], ["a.yue-ni-because", "N2", "because / therefore (literary)", "Plain form + (が)ゆえに / 故に", "〜ゆえに is a literary / archaic causal marker meaning 'because X, therefore Y'. It is used in essays, formal writing, legal / philosophical texts, and classical styles. Modern speech rarely uses it, preferring から or ので. The standalone sentence-initial ゆえに can mean 'therefore'.", ["Literary / archaic register — rarely used in modern speech.", "Common in legal, philosophical, and academic writing."], "我思う、ゆえに我あり。", "I think, therefore I am.", ["plain", "(が)ゆえに", "(が)ゆえに"], ["", "(な", "(な"]], ["a.koto-kara-from-fact", "N2", "from the fact that / based on the fact", "Plain form + ことから", "〜ことから presents a fact or evidence as the basis for a conclusion, explanation, or designation — 'from the fact that X, (Y follows)'. Often used to explain the origin of a name, reputation, or conclusion drawn from observed evidence. Formal / written register.", ["Evidence-based conclusion — X is the factual basis for Y.", "Common in etymological / naming explanations: 桜の木が多いことから、この場所は'桜町'と呼ばれている."], "桜の木が多いことから、この町は「桜町」と呼ばれている。", "Because it has so many cherry trees, this town is called “Sakura Town”.", ["plain", "ことから", "ことから"], null], ["a.amari-too-much", "N2", "out of excess / from too much", "V plain / i-adj / na-adj な / noun の + あまり", "〜あまり expresses an excessive degree of emotion, sensation, or state that led to the main-clause consequence — 'out of too much X, Y happened'. Often with emotional nouns (驚き, 嬉しさ, 悲しみ) or strong verbs. Formal / written register. The main clause is typically an intense or unusual reaction.", ["Expresses an excess of emotion / sensation leading to an unusual result.", "Common with nominalized emotions: 驚きのあまり, 嬉しさのあまり, 悲しみのあまり."], "驚きのあまり、言葉を失った。", "Out of sheer surprise, I was lost for words.", ["plain", "さ", "さ"], ["な", "あまり", "あまり"]], ["a.kara-koso-precisely-because", "N2", "precisely because / it is exactly because", "Plain form + からこそ", "〜からこそ emphasizes that the X clause is the essential and exclusive reason for Y — 'precisely because X, Y (and no other reason)'. More common than 〜ばこそ in modern speech, and slightly less literary. Often used in heartfelt reasoning, explanations, and endorsements.", ["Common variant of 〜ばこそ — より neutral register.", "Emphasizes that X is the essential reason, ruling out other potential causes."], "大切な友達だからこそ、厳しいことも言う。", "It's precisely because you're a dear friend that I say harsh things too.", ["plain", "からこそ", "からこそ"], null], ["a.ni-mo-kakawarazu-despite", "N2", "despite / in spite of / even though", "Plain form + にもかかわらず", "〜にもかかわらず is a formal concessive marker meaning 'despite X, Y'. More formal than のに or が, with no emotional connotation — purely contrastive. Common in written Japanese, news, and formal speech. The main clause presents an unexpected or counter-intuitive continuation.", ["Formal concessive — neutral tone, no emotional weight.", "More formal than のに (which can carry frustration) and が (neutral but less emphatic)."], "悪天候にもかかわらず、試合は行われた。", "Despite the bad weather, the match was held.", ["plain", "にもかかわらず", "にもかかわらず"], ["である", "にもかかわらず", "にもかかわらず"]], ["a.dake-no-koto-wa-aru", "N2", "(it's) as expected from / lives up to", "Plain form + だけのことはある", "〜だけのことはある expresses that the main-clause praise or quality is fitting given a stated premise — 'being X, it's no surprise that Y' / 'Y lives up to the expectations of X'. Positive evaluative, very similar to 〜だけあって (N3) but in a slightly more emphatic, reflective tone.", ["Positive evaluative — praise that 'fits' the premise.", "Very close in meaning to 〜だけあって (N3); this form is more reflective / conclusive."], "長年練習しただけのことはある。演奏が素晴らしい。", "The years of practice have paid off. The performance is wonderful.", ["plain", "だけのことはある", "だけのことはある"], ["な", "だけのことはある", "だけのことはある"]], ["a.mono-dakara", "N2", "because / it's because (excusing / justifying)", "Plain form + ものだから / もので", "〜ものだから gives a reason with an excuse-making or justifying flavor — 'it's because X (so please understand)'. Often used when the speaker is explaining why they did something unexpected or failed to meet an expectation. The shorter form 〜もので is slightly softer. Distinct from 〜んだから (more emphatic) and 〜から (neutral).", ["Excuse-making — often used to explain tardiness or failures.", "The short form 〜もので is softer / more polite."], "急いでいたものだから、挨拶もせずに帰ってしまった。", "Because I was in a hurry, I left without even saying goodbye.", ["plain", "ものだから", "ものだから"], ["な", "ものだから", "ものだから"]], ["a.yara-yara", "N2", "things like X and Y (disordered / overwhelming)", "Noun + やら + noun + やら", "〜やら〜やら is a non-exhaustive list construction similar to 〜とか〜とか, but with a flavor of disarray, overwhelm, or mess. Often used when describing a situation as chaotic or a mix of unpleasant items — 'what with X and Y'. Can also combine adjectives or verb plain forms. Formal / literary register compared to とか.", ["Disordered / overwhelmed list — often describing a messy situation.", "More formal / literary than とか."], "宿題やら掃除やらで忙しい。", "I'm busy with homework and cleaning and whatnot.", ["plain", "やら", "やら"], null], ["a.kara-ni-wa", "N2", "now that / since (with strong obligation)", "Plain form + からには", "〜からには expresses a strong commitment based on a premise — 'now that X, one must Y'. The main clause typically expresses obligation, determination, or strong consequence arising from the X premise. Similar in function to 〜以上は but with slightly more emotional weight. Formal register.", ["Strong obligation from a premise — 'since this is the case, you must'.", "Similar to 〜以上(は) but emotionally stronger."], "約束したからには、必ず守ります。", "Now that I've promised, I will definitely keep it.", ["plain", "からには", "からには"], null], ["a.no-minarazu", "N2", "not only X but also Y (literary)", "Plain form + のみならず", "〜のみならず is a literary 'not only' construction — the most formal variant of the 'not only' family (〜だけでなく, 〜ばかりでなく, 〜のみならず). Common in essays, formal speeches, and written Japanese. Often paired with も in the main clause.", ["Most formal / literary of the 'not only' family.", "Rare in casual speech — common in essays, news, and formal writing."], "彼は頭がいいのみならず、性格もいい。", "Not only is he smart, but he also has a good personality.", ["plain", "のみならず", "のみならず"], ["である", "のみならず", "のみならず"]], ["a.to-wa-ie", "N2", "although / that said / even so", "Plain form + とはいえ", "〜とはいえ is a formal concessive meaning 'although X' or 'that said, X'. It hedges a statement by noting that while X is true, the main clause presents a contrasting or tempering observation. Literary / formal register, common in essays and written Japanese.", ["Literary / formal concessive — 'that said'.", "Common in essays, news, and balanced discussions."], "もう春とはいえ、まだ寒い。", "Although it's already spring, it's still cold.", ["plain", "とはいえ", "とはいえ"], null], ["a.to-wa-iu-mono-no", "N2", "that said / although one says", "Plain form + とはいうものの", "〜とはいうものの is a literary concessive similar to 〜とはいえ — 'although one says X, (the reality is Y)'. Often used to qualify a general statement by pointing out exceptions or nuances. More drawn-out and reflective than 〜とはいえ. Common in written Japanese.", ["Reflective / nuance-adding concessive.", "More drawn-out than とはいえ — emphasizes the speaker's consideration."], "春だとはいうものの、今朝は雪が降った。", "Although we say it's spring, snow fell this morning.", ["plain", "とはいうものの", "とはいうものの"], null], ["a.dake-mashi-da", "N2", "at least X (is better than nothing) / could be worse", "Plain form + だけましだ", "〜だけましだ expresses a minor consolation — 'at least X is the case, and that's better than worse alternatives'. Used when finding a silver lining in a negative situation: it's not great, but at least it's not as bad as it could be. The main clause often implicitly or explicitly compares to a worse hypothetical.", ["Minor consolation — silver lining in a negative situation.", "Often with implicit comparison to something worse."], "雨だけど、雪じゃないだけましだ。", "It's raining, but at least it's not snowing.", ["plain", "だけましだ", "だけましだ"], ["な", "だけましだ", "だけましだ"]], ["a.hanmen-on-other-hand", "N2", "on the other hand / while (one side)", "Plain form + 反面", "〜反面 presents two contrasting aspects of the same subject — 'on the one hand X, on the other Y'. Functionally similar to 〜一方で (N3) but with a stronger 'two sides of a coin' feel. Formal / neutral register, common in balanced descriptions of pros and cons.", ["'Two sides of the same thing' — often used for pros/cons or complementary aspects.", "Similar to 〜一方で — choice is stylistic."], "この仕事は給料がいい反面、責任が重い。", "This job has good pay, but on the other hand, heavy responsibility.", ["plain", "反面", "はんめん"], null], ["a.tatte-even-casual", "N2", "even if (casual)", "Plain form + (っ)たって", "〜たって / 〜っ たって is a casual contraction of 〜ても ('even if'). Common in casual speech, especially when dismissing a hypothetical or insisting on something despite opposition. Can attach to verbs, adjectives, and nouns. The っ adds emphasis.", ["Casual contraction of ても — conversational register.", "Often in complaints or dismissive reactions: 言ったって分からない ('even if I told you, you wouldn't get it')."], "言ったって、聞いてくれないよ。", "Even if I told him, he wouldn't listen.", ["stem", "くたって", "くたって"], null], ["a.koto-tote", "N2", "since / because (formal, explanatory)", "Plain form / noun + の + こととて", "〜こととて is a formal / literary reason marker — 'since X is the case, Y (please excuse)'. Often used in apologies or explanations to acknowledge that circumstances caused an imperfection: 'since I'm new, please forgive any mistakes'. Very formal, rarely used in casual speech.", ["Formal / literary causal — apologetic register.", "Very common in polite apologies: 初めてのこととて, 急なこととて."], "初めてのこととて、不手際をお許しください。", "Since it's my first time, please forgive any mishandling.", ["plain", "こととて", "こととて"], ["な", "こととて", "こととて"]], ["a.kagiri-da-emotional", "N2", "feel extremely / the limit of (an emotion)", "i-adj / na-adj + 限りだ", "〜限りだ expresses that the speaker feels something to an extreme degree — 'I'm extremely X'. Attached to an emotional adjective, it conveys the speaker's heightened emotional state. Formal / literary register, often in sentiment-heavy expressions: 嬉しい限りだ ('I'm extremely happy').", ["Emotional intensifier — 'extremely X'.", "Common adjectives: 嬉しい, 寂しい, 悲しい, 情けない, 残念な."], "あなたにお会いできて、嬉しい限りです。", "I'm extremely happy to meet you.", ["plain", "限りだ", "かぎりだ"], ["な", "限りだ", "かぎりだ"]], ["a.you-de-seemingly", "N2", "seemingly X, but actually / looks X but", "Plain form + ようで / ようでいて", "〜ようで expresses apparent contradiction — 'seemingly X, but actually Y'. The surface appearance X contrasts with the deeper reality Y. Often used for surprising insights or revelations: 'he seems quiet, but he's actually funny'. Formal / literary register.", ["Apparent contradiction — surface vs. reality.", "Common in character descriptions and surprising revelations."], "分かっているようで、実は分かっていない。", "It seems as if he understands, but he actually doesn't.", ["plain", "ようで", "ようで"], null], ["a.you-nara-if-looks", "N2", "if it looks like / if it appears", "Plain form + ようなら(ば)", "〜ようなら is a conditional variant that attaches to hypothetical situations the speaker infers from appearance — 'if it looks like X, (then do Y)'. Often used when making contingency plans based on how things are going. Distinct from 〜なら (neutral 'if it's X').", ["Appearance-based conditional — 'if it looks like X'.", "Distinct from 〜なら (topic conditional) and 〜たら / ば (general conditional)."], "雨が降るようなら、中止しましょう。", "If it looks like it'll rain, let's cancel.", ["plain", "ようなら", "ようなら"], ["な", "ようなら", "ようなら"]], ["a.you-dewa-if-its", "N2", "if it's like that / at this rate", "Plain form + ようでは", "〜ようでは expresses a hypothetical condition with a negative, critical, or warning tone — 'if X is like that, (then something bad will follow)'. The main clause often presents an unfavorable prediction or judgment. Distinct from 〜ようなら (more neutral).", ["Critical / warning conditional — implies an unfavorable outcome.", "Main clause often: だめだ, 合格できない, 成功しない."], "そんなに怠けるようでは、合格できないよ。", "If you're lazy like that, you won't pass.", ["plain", "ようでは", "ようでは"], ["な", "ようでは", "ようでは"]], ["a.mono-ga-aru", "N2", "there is something (about it) / is impressively", "Plain form + ものがある", "〜ものがある expresses that there is a certain quality or feature worth noting about something — 'there's something X about it'. Often used evaluatively with impressive, moving, or remarkable qualities. Formal / literary register. Different from 〜ものだ (general truth) and 〜ものの (although).", ["Evaluative — 'there's something X about it'.", "Common with impressive / emotional qualities: 感動的なものがある, 素晴らしいものがある."], "彼の演奏には感動的なものがある。", "There's something moving about his performance.", ["plain", "ものがある", "ものがある"], ["な", "ものがある", "ものがある"]], ["a.naku-mo-nai", "N2", "not that I don't / it's not that X isn't", "V ない-form + くもない / もない", "〜なくもない is a double negative that hedges a positive statement — 'it's not that I don't X' / 'it's not impossible that X'. Similar to 〜ないことはない (N3) but slightly more idiomatic. Often expresses reluctant agreement or a mild admission.", ["Double negative — softens a positive claim.", "Similar to 〜ないことはない (N3); 〜なくもない is slightly more conversational."], "君の気持ちも分からなくもない。", "It's not that I don't understand how you feel.", null, ["で", "なくもない", "なくもない"]], ["a.mono-no-although", "N2", "although / even though (formal)", "Plain form + ものの", "〜ものの is a formal concessive marker meaning 'although X, Y', where the main clause often expresses a limitation, unexpected outcome, or reversal relative to what the ものの clause suggests. More formal and literary than けれど / が. Typical in written Japanese, reports, and formal speech. Distinct from 〜ものだ (general truth) and ものなら (if it were possible).", ["Formal / literary register — alternatives in casual speech are けど / が.", "Main clause typically expresses an unexpected continuation or limitation."], "宿題を始めたものの、なかなか進まない。", "Although I started my homework, it's not progressing much.", ["plain", "ものの", "ものの"], ["な", "ものの", "ものの"]], ["a.ka-no-you-ni", "N2", "as if / as though", "Plain form + かのように", "〜かのように compares something to a hypothetical or imagined scenario — 'as if X were the case'. It is more literary and more counterfactual than a simple simile with ように. The の can sometimes be omitted in casual speech (かように) but the full form is the standard. Often appears with verbs of behavior to describe an appearance that doesn't match reality.", ["Counterfactual: the comparison is to something that isn't actually the case.", "More literary than ように alone — the か adds a hypothetical / counterfactual flavor."], "彼はまるで何も知らないかのように話した。", "He talked as if he knew nothing at all.", ["plain", "かのように", "かのように"], ["", "(な", "(な"]], ["a.ue-ni-in-addition", "N2", "in addition to / on top of (that)", "Plain form + 上に", "〜上に is an additive connector meaning 'in addition to X, (also) Y'. The Y clause builds on or extends the X clause in the same direction — usually both positive or both negative. More formal than 〜し. Distinct from the locative 上 (above). Common in lists of reasons or attributes.", ["Additive — Y clause extends X in the same direction (both positive or both negative).", "Formal variant of 〜し (listing reasons/facts)."], "この部屋は広い上に、明るい。", "This room is spacious and also bright.", ["plain", "上に", "うえに"], null], ["a.ijou-since", "N2", "since / now that / as long as", "Plain form + 以上(は)", "〜以上(は) expresses that given the premise of the 以上 clause, a certain conclusion or obligation follows — 'since X is the case, Y'. Often used for commitments, obligations, or expectations that arise because of a stated fact. The optional は adds topic emphasis. Formal / neutral register.", ["The premise justifies an obligation or expectation in the main clause.", "Common in commitment contexts: 約束した以上、守らなければならない ('since I promised, I must keep it')."], "約束した以上、守らなければならない。", "Since I promised, I have to keep it.", ["plain", "以上", "いじょう"], ["である", "以上", "いじょう"]], ["a.hodo-dewa-nai", "N2", "not to the extent of / not as much as", "Plain form + ほどではない", "〜ほどではない is a negation of 〜ほど, expressing that something is 'not to the extent' of X — downplaying a comparison. Often used to moderate a previous statement: 'yes, but not that much'. Neutral / formal register.", ["Moderating negation — 'not quite as much as X'.", "Common to hedge: 痛いけど、救急車を呼ぶほどではない."], "痛いけど、病院に行くほどではない。", "It hurts, but not to the extent of going to the hospital.", ["plain", "ほどではない", "ほどではない"], ["な", "ほどではない", "ほどではない"]], ["a.uchi-ni", "N3", "while (the state holds) / before (it changes)", "V plain non-past / V ない-form / い-adj / noun-の / な-adj + な + うちに", "〜うちに expresses 'do X while the window is still open / before the state changes.' It implies that the state or condition in the うちに clause is limited and that the speaker is acting to take advantage of it before it ends. The negative form 〜ないうちに is very common for 'before (something bad) happens'.", ["Crucially implies the state will end — contrast with 〜間に, which is neutral about duration.", "〜ないうちに ('before it happens') is one of the most common uses: 雨が降らないうちに ('before it rains')."], "若いうちに色々なことを経験しなさい。", "Experience many things while you're young.", null, ["な", "うちに", "うちに"]], ["a.aida-ni", "N3", "during / while (a period within which something happens)", "V 〜ている / noun-の / adj + 間 or 間に", "〜間 and 〜間に both express temporal 'during / while', but differ in scope: 〜間 (without に) covers the whole duration and is used with continuous main-clause actions that also span the whole period. 〜間に (with に) marks a point or sub-interval within the period, and is used for one-off events that happen during it. Subjects in the main clause and the 間 clause can differ.", ["〜間 (whole period): 私が日本にいる間、ずっと雨が降っていた.", "〜間に (sub-interval): 私が寝ている間に、彼が来た."], "私が留守の間に誰か来ましたか。", "Did someone come while I was out?", ["plain", "間", "あいだ"], ["な", "間", "あいだ"]], ["a.okage-sei-de", "N3", "thanks to / because of (with explicit positive or negative attribution)", "V plain / noun-の + おかげで (positive) or せいで (negative)", "おかげで and せいで both attribute a result to a cause, but with opposite polarity: おかげで ('thanks to') is used for positive outcomes, while せいで ('because of / at the fault of') is used for negative outcomes. They are structural twins — same connection patterns, opposite valence — and are typically taught as a pair.", ["おかげで: positive outcomes only — thanks to (someone's help / a fortunate circumstance).", "せいで: negative outcomes only — because of (someone's fault / an unfortunate circumstance)."], "あなたのおかげで合格できました。", "Thanks to you, I was able to pass.", ["plain", "おかげで", "おかげで"], null], ["a.koto-nominalizer", "N3", "nominalizer: 'the act / fact of doing'", "Verb plain form / na-adj + な + こと", "こと turns a verb or adjective phrase into a noun, expressing 'the act of doing' or 'the fact that'. It is used for abstract, general, or factual statements — in contrast to の-nominalization, which is used for more concrete / perceptual situations. Several fixed grammar patterns require こと specifically (〜ことができる, 〜ことにする, 〜ことになる, 〜ことがある).", ["こと vs の: こと is more abstract / factual / formal; の is more concrete / perceptual / immediate.", "Several idiomatic patterns require こと: 〜ことができる (can), 〜ことにする (decide), 〜ことになる (be decided), 〜ことがある (experience)."], "日本語を勉強することは楽しいです。", "Studying Japanese is fun.", ["plain", "こと", "こと"], ["な", "こと", "こと"]], ["a.no-nominalizer", "N3", "nominalizer: 'the act / fact of doing' (perceptual/concrete)", "Verb plain form / na-adj + な + の", "の turns a verb or adjective phrase into a noun, used for concrete, perceptual, or immediate situations — 'I saw him running' (走るのを見た). With perception verbs (見る, 聞く, 感じる), の is strongly preferred over こと. In more abstract or factual contexts, こと is preferred. Both are nominalizers, but their register and context of use differ.", ["Required after perception verbs: 見る, 聞く, 感じる, 気づく usually take の, not こと.", "の vs こと: の is concrete / perceptual / immediate; こと is abstract / factual / formal."], "彼が走るのを見た。", "I saw him running.", ["plain", "の", "の"], ["な", "の", "の"]], ["a.kagiri-as-long-as", "N3", "as long as / to the extent that / as far as", "V plain / i-adj / noun + である + 限り", "〜限り has several related senses: (1) 'as long as' (as a condition continues) — V plain non-past + 限り; (2) 'to the extent that / as far as' (limit of knowledge or ability) — 知っている限り ('as far as I know'); (3) 'as long as X is the case' (condition on a state). A versatile marker for expressing scope or limit.", ["V ない + 限り = 'unless' — 勉強しない限り、合格できない ('unless you study, you can't pass').", "The negative variant 〜ない限り is very common for 'unless' constructions."], "生きている限り、希望はある。", "As long as you're alive, there's hope.", ["plain", "限り", "かぎり"], null], ["a.furi-wo-suru-pretend", "N3", "to pretend to / act as if", "Plain form + ふりをする", "〜ふりをする expresses that the subject pretends to be or do something they actually are not or did not. ふり literally means 'appearance / pretense'. Commonly used in social situations where someone puts on a facade. The construction works with all predicate types: verbs, adjectives, and nouns (with の).", ["ふり means 'pretense / appearance' and is often left in kana.", "For na-adj and nouns, use the attributive form (な / の) before ふり."], "寝たふりをした。", "I pretended to be asleep.", ["plain", "ふりをする", "ふりをする"], ["な", "ふりをする", "ふりをする"]], ["a.kuse-ni-despite", "N3", "despite / although (critical / reproachful contrast)", "Plain form + くせに", "〜くせに is a contrastive marker with a strongly negative or critical nuance — 'despite X, Y', with the implication that Y is inappropriate, hypocritical, or inconsistent with X. More emotionally charged than のに, typically carrying reproach, complaint, or disdain. Used to criticize someone (rarely oneself) for contradictory behavior.", ["Strongly critical / reproachful — do not use where a neutral contrast is intended (use が/けど/のに).", "Subject of the くせに clause must usually be the same across both clauses; often a third party."], "子供のくせに、大人のような口をきく。", "Despite being a child, he talks like an adult.", ["plain", "くせに", "くせに"], ["な", "くせに", "くせに"]], ["a.wake-da-meaning", "N3", "it means that / no wonder / that's why", "Plain form + わけだ", "〜わけだ expresses a logical conclusion or an 'aha' realization — 'that means X' or 'no wonder X'. It often signals that the speaker has just understood why something is the case. Distinct from わけではない ('it's not that / not necessarily'), which is treated as a separate entry. Can also express a deducible consequence: 5時に出れば、6時に着くわけだ.", ["Logical conclusion: 'it follows that / that's why / no wonder'.", "Often marks a realization: 'ああ、そういうわけだ' ('ah, that's why')."], "雪が降っているから、寒いわけだ。", "No wonder it's cold — it's snowing.", ["plain", "わけだ", "わけだ"], ["な", "わけだ", "わけだ"]], ["a.wake-dewa-nai", "N3", "it's not (necessarily) that / it doesn't mean that", "Plain form + わけではない", "〜わけではない softens a negative — 'it's not that I don't X' or 'that doesn't mean X'. It hedges an implication that the speaker wants to deny without outright rejecting the broader topic. Common in explanations when correcting a listener's assumption: 'it's not like I hate it, it's just that...'. The casual contracted form is わけじゃない.", ["Hedges a negation — 'not necessarily' rather than an outright 'no'.", "Casual contraction: わけじゃない."], "嫌いなわけじゃないけど、今日は食べたくない。", "It's not that I dislike it, I just don't feel like eating it today.", ["plain", "わけではない", "わけではない"], ["な", "わけではない", "わけではない"]], ["a.nai-koto-wa-nai", "N3", "it's not that one doesn't / it's not impossible to", "V ない / i-adj くない + ことはない", "〜ないことはない is a double negative that softens a positive statement — 'it's not that I don't X' or 'I suppose I can X'. Commonly used when the speaker is reluctantly agreeing or partially conceding. More tentative than an outright affirmative, often conveying hesitation or conditional willingness.", ["Double negative — grammatically positive but softened.", "Often conveys reluctance, hesitation, or conditional agreement."], "行けないことはないけど、あまり行きたくない。", "It's not that I can't go, but I don't really want to.", ["ku", "ない", "ない"], null], ["a.dake-ni-precisely", "N3", "precisely because / being X, all the more", "Plain form + だけに", "〜だけに expresses a causal emphasis — 'precisely because X' or 'being X, (the consequence is) all the more (strong)'. It builds on だけ ('only / extent') but in a causal direction, implying that the degree of X corresponds to or amplifies the main clause's outcome. Often used to emphasize natural correspondence or heightened reactions.", ["Causal and proportional — 'X being the case, Y is correspondingly so'.", "Often with expected outcomes that are amplified by the cause: プロだけに上手だ ('being a pro, he's all the more skilled')."], "期待していただけに、がっかりした。", "Precisely because I'd had high hopes, I was all the more disappointed.", ["plain", "だけに", "だけに"], ["な", "だけに", "だけに"]], ["a.dake-atte-as-expected", "N3", "as one would expect from / fittingly", "Plain form + だけあって", "〜だけあって expresses that the main-clause quality is 'fittingly' or 'as you would expect from' the characteristic described in the だけあって clause — 'being X, of course Y'. Positive evaluative nuance: the speaker endorses the main-clause claim as natural given the premise. Often used to compliment skills, qualities, or training.", ["Positive evaluative — the consequence is praiseworthy / expected given the premise.", "Contrast with だけに (neutral proportionality) — だけあって is endorsing."], "10年練習しただけあって、演奏が見事だ。", "Having practiced for 10 years, his performance is splendid.", ["plain", "だけあって", "だけあって"], ["な", "だけあって", "だけあって"]], ["a.bakari-ni-merely", "N3", "merely because / just because (often with negative outcome)", "Plain form + ばかりに", "〜ばかりに expresses that a minor or specific cause led to an (usually undesirable) consequence — 'merely because X, Y (unfortunately)'. Often used in regret or complaint contexts, emphasizing that the outcome stems from a single triggering cause. Distinct from 〜ばかり (only / nothing but).", ["Typically negative outcomes — regret about a trigger that led to an unwanted result.", "Distinct from 〜ばかり (exclusivity) and 〜たばかり (recent action)."], "急いでいたばかりに、大切なものを忘れた。", "Merely because I was in a hurry, I forgot something important.", ["plain", "ばかりに", "ばかりに"], null], ["a.bakari-ka-not-only", "N3", "not only X but also Y", "Plain form + ばかりか", "〜ばかりか is an additive construction meaning 'not only X, but also Y'. The Y clause usually extends the X claim, often to a more surprising or emphatic level. More formal than the casual 〜だけでなく. Common in emphatic or praiseworthy / critical descriptions. The shorter variant 〜どころか has a related but distinct use (far from X, actually Y).", ["Additive: the Y clause adds to or intensifies the X clause.", "More formal than 〜だけでなく (everyday 'not only')."], "彼は英語ばかりか、フランス語も話せる。", "He can speak not only English but also French.", ["plain", "ばかりか", "ばかりか"], ["な", "ばかりか", "ばかりか"]], ["a.dokoro-ka-far-from", "N3", "far from / let alone / on the contrary", "Plain form + どころか", "〜どころか is a strong contrastive construction meaning 'far from X, Y' — it rejects an expected or modest claim and presents a contrasting, often more intense, reality. 'Far from being X, it's actually Y'. The main clause typically presents something more extreme or opposite to what the X clause implied.", ["Strong contrast — the main clause reverses or exceeds the X clause's implication.", "Often paired with negative expectations and surprising reality: 歩けないどころか、立てない ('far from being unable to walk, I can't even stand')."], "彼は日本語どころか、英語も話せない。", "He can't even speak English, let alone Japanese.", ["plain", "どころか", "どころか"], ["", "(な", "(な"]], ["a.ippou-de-one-hand", "N3", "on the other hand / while at the same time", "Plain form + 一方で", "〜一方で presents a contrast or parallel between two aspects, situations, or groups — 'on the one hand X, on the other Y'. The two clauses often describe complementary or contrasting facets of the same broader topic. Formal / neutral register, common in essays and balanced discussions.", ["Presents two sides, facets, or situations — not always strict opposition.", "Formal / balanced register — typical of essays and news articles."], "彼は優しい一方で、厳しいところもある。", "He's kind, but on the other hand, he has a strict side.", ["plain", "一方で", "いっぽうで"], null], ["a.warini-considering", "N3", "considering / for (an X), (relatively) Y", "Plain form + わりに(は)", "〜わりに(は) expresses that something is unexpected or disproportionate to a given standard — 'considering X, Y is unexpected / more (or less) than you'd think'. The comparison is relative to the X premise, and the main clause often describes something surprising in either direction. More neutral in tone than のに (contrast with frustration).", ["Expresses disproportion relative to the premise — 'considering X, I didn't expect Y'.", "More neutral than のに — わりに is observational, のに often has emotional weight."], "このレストランは値段のわりにおいしい。", "For the price, this restaurant is (surprisingly) delicious.", ["plain", "わりに", "わりに"], ["な", "わりに", "わりに"]], ["a.te-tamaranai-unbearably", "N3", "unbearably / can't stand how", "V-て form / i-adj 〜くて / na-adj で + たまらない", "〜てたまらない expresses that a feeling, sensation, or desire is overwhelming — 'unbearably X'. Common with physical sensations (hungry, cold, hot), emotional states (happy, sad, worried), and strong desires. Similar in function to 〜てしょうがない and 〜てならない (see separate entry), which are near-synonyms with slightly different nuances.", ["Used for overwhelming subjective states — emphasis on how strong the feeling is.", "Common with sensory and emotional adjectives: 暑くてたまらない, 悲しくてたまらない."], "お腹がすいてたまらない。", "I'm unbearably hungry.", ["kute", "たまらない", "たまらない"], ["で", "たまらない", "たまらない"]], ["a.te-naranai-cant-help", "N3", "can't help feeling / uncontrollably", "V-て form / i-adj 〜くて / na-adj で + ならない", "〜てならない expresses that the speaker can't help feeling a certain way — a feeling or sensation that arises uncontrollably and can't be suppressed. Close in meaning to 〜てたまらない but typically used for emotional states and impressions rather than physical sensations. Formal / slightly literary.", ["Uncontrollable emotional / cognitive state — the speaker can't suppress the feeling.", "Compare with 〜てたまらない (more physical sensations) and 〜てしょうがない (more casual)."], "彼のことが気になってならない。", "I can't stop thinking about him.", ["kute", "ならない", "ならない"], ["で", "ならない", "ならない"]], ["a.kke-casual-wondering", "N3", "was it the case that / I can't quite remember (casual)", "Plain form + っけ", "〜っけ is a sentence-ending particle used when the speaker is trying to recall or confirm something they already knew or were told — 'was it the case that...?' / 'I can't quite remember, was it...?'. Strongly casual; typically used to oneself or to a close listener. Often attached to past-tense plain forms or to だ / だった (for nouns / na-adj).", ["Strictly casual — do not use in polite / formal speech.", "For recall or confirmation of things the speaker once knew."], "明日、何時からだっけ？", "What time does it start tomorrow again?", null, ["", "(だ)", "(だ)"]], ["a.mon-casual-because", "N3", "(it's) because / that's why (casual whining)", "Plain form + んだもん", "〜んだもん is the casual contracted form of 〜ものだから, used to give an emotionally-charged reason or excuse — 'because, I'm telling you' / 'that's why (don't blame me)'. Very common in casual speech, sometimes with a whining or defensive nuance, especially among younger speakers and in emotional contexts.", ["Casual and often whining or defensive in tone.", "Contraction of 〜のだもの (formal) → 〜んだもの → 〜んだもん."], "だって、疲れたんだもん。", "But I'm tired, that's why!", ["plain", "んだもん", "んだもん"], ["な", "んだもん", "んだもん"]], ["a.ni-chigainai-must", "N3", "must be / certainly / no doubt", "Plain form + にちがいない", "〜にちがいない expresses the speaker's strong conviction — 'it must be X', 'there's no doubt that X'. Stronger than 〜はず (expectation) and 〜だろう (conjecture). The speaker is making a confident judgment, usually based on available evidence. More formal than 〜にきまっている (which is slightly more casual and emphatic).", ["Strong conviction — 'I'm sure', not 'I think'.", "Stronger than だろう / でしょう (likely guess) and はず (expected)."], "彼が犯人にちがいない。", "He must be the culprit.", ["plain", "にちがいない", "にちがいない"], null], ["a.koto-ni-surprise", "N3", "to X's surprise / delight / disappointment", "i-adj / na-adj (+ な) / V-た + ことに(は)", "〜ことに(は) expresses the speaker's emotional reaction to a fact, placed at the start of the sentence — 'to my surprise', 'to my delight', 'unfortunately'. Common adjectives: 驚いた (surprised), 嬉しい (happy), 残念な (unfortunate), 面白い (interesting). Formal / literary register, common in essays and written narratives.", ["Fronted emotional reaction marker — structures the sentence around the speaker's feeling.", "Common adjectives: 驚くべき / 驚いた (surprised), 嬉しい (happy), 悲しい (sad), 残念な (unfortunate), 面白い (interesting)."], "驚いたことに、彼は試験に合格した。", "To my surprise, he passed the exam.", ["plain", "ことに", "ことに"], ["な", "ことに", "ことに"]], ["a.n-da-kara-emphatic", "N3", "since / because (emphatic)", "Plain form + んだから", "〜んだから is a more emphatic form of から, combining the explanatory ん (のだ) with から. It is used to give a strong or somewhat insistent reason, often with emotional emphasis — 'since X (and you should know it)'. Common in arguments, pleas, and firm advice. The ですから form is the polite equivalent.", ["More emphatic than から alone — adds explanatory / insistent tone.", "Origin: contraction of のだから → んだから."], "疲れているんだから、早く寝なさい。", "You're tired, so go to bed early.", ["plain", "んだから", "んだから"], ["な", "んだから", "んだから"]], ["a.wake-ga-nai", "N3", "there's no way / it's impossible that", "Plain form + わけがない", "〜わけがない is an emphatic negation — 'there's no way that X' / 'it's impossible for X to be the case'. Stronger than はずがない (which is expectation-based). The speaker flatly denies the possibility. The casual contracted form is わけない.", ["Flat denial — 'no way'.", "Stronger than はずがない (which has an expectation flavor)."], "彼がそんなことを言うわけがない。", "There's no way he would say such a thing.", ["plain", "わけがない", "わけがない"], ["な", "わけがない", "わけがない"]], ["a.te-shou-ga-nai", "N3", "can't help feeling / unbearably", "V-て / i-adj 〜くて / na-adj で + しょうがない", "〜てしょうがない expresses an uncontrollable or unbearable feeling, very close in meaning to 〜てたまらない and 〜てしかたがない. Casual register, very common in speech. The three are near-synonyms with small register differences: しょうがない is the most casual, たまらない is neutral, しかたがない is more formal.", ["Uncontrollable feeling — 'can't help it'.", "Near-synonym of 〜てたまらない and 〜てしかたがない."], "眠くてしょうがない。", "I'm unbearably sleepy.", ["kute", "しょうがない", "しょうがない"], ["で", "しょうがない", "しょうがない"]], ["a.te-shikata-ga-nai", "N3", "can't help feeling / unbearably (more formal)", "V-て / i-adj 〜くて / na-adj で + しかたがない", "〜てしかたがない is a more formal variant of 〜てしょうがない, expressing an uncontrollable or unbearable feeling. しかたがない literally means 'there is no way / method', mirroring しょうがない's structure. Appropriate in writing and formal speech where しょうがない would be too casual.", ["Formal variant of 〜てしょうがない — same meaning, more formal register.", "Also often 仕方がない in kanji — especially in writing."], "子供のことが心配でしかたがない。", "I'm unbearably worried about my child.", ["kute", "しかたがない", "しかたがない"], ["で", "しかたがない", "しかたがない"]], ["a.bakari-de-naku", "N3", "not only X but also Y (formal)", "Plain form + ばかりでなく", "〜ばかりでなく is a formal additive construction meaning 'not only X but also Y'. The Y clause extends the X claim in the same direction. More formal than 〜だけでなく, common in written and formal speech. Closely related to 〜ばかりか (also additive).", ["Formal additive — 'not only X but also Y'.", "More formal than 〜だけでなく (everyday variant)."], "彼は勉強ができるばかりでなく、スポーツも得意だ。", "Not only is he good at studying, but he's also good at sports.", ["plain", "ばかりでなく", "ばかりでなく"], ["な", "ばかりでなく", "ばかりでなく"]], ["a.dake-de-naku", "N3", "not only X but also Y (neutral)", "Plain form + だけでなく", "〜だけでなく is the neutral, everyday additive construction meaning 'not only X but also Y'. It is the most commonly used of the 'not only' family, appropriate for both written and spoken Japanese. Often paired with も in the main clause for emphasis: 〜だけでなく、〜も.", ["Most common 'not only' construction — suitable for everyday use.", "Often paired with も in the main clause: 日本人だけでなく、外国人も楽しめる ('not only Japanese but foreigners too can enjoy')."], "この本は面白いだけでなく、勉強にもなる。", "This book is not only interesting but also educational.", ["plain", "だけでなく", "だけでなく"], ["な", "だけでなく", "だけでなく"]], ["a.ni-kimatte-iru", "N3", "it's definitely / of course / for sure", "Plain form + に決まっている", "〜に決まっている expresses the speaker's strong conviction that something is obviously true — 'it's definitely X' / 'of course X' / 'X is a sure thing'. Somewhat casual and emphatic, often used in responses to obvious questions or to emphasize an inevitable conclusion. Stronger conviction than はず or でしょう.", ["Strong conviction — 'it's obvious / certain'.", "More casual / emphatic than にちがいない (formal certainty)."], "そんなの、嘘に決まっている。", "That's obviously a lie.", ["plain", "に決まっている", "にきまっている"], null], ["a.mono-da-general", "N3", "it's natural / should be / generally (general truth or tendency)", "Plain form + ものだ", "〜ものだ expresses a general truth, an expected state of affairs, or a common tendency — 'that's just how things are'. It is used to state something that the speaker considers universally or normatively true. Distinct from ものだ expressing nostalgia about the past ('used to do X') and from ものではない ('shouldn't / isn't done'). The past-tense form ものだった can express nostalgia: 'used to ___'.", ["Expresses general tendencies, common truths, or normative expectations.", "Negative: 〜ものではない ('it's not done / shouldn't be done') — more strongly normative."], "子供は元気なものだ。", "Children are naturally energetic.", ["plain", "ものだ", "ものだ"], ["な", "ものだ", "ものだ"]], ["a.shi-reason-listing", "N4", "and / besides (non-exhaustive listing of reasons or facts)", "Plain form + し (+ plain form + し + ...)", "〜し lists reasons or facts non-exhaustively — 'and moreover', 'for one thing'. The listed items are not the complete set; し implies there may be more. Often paired with a concluding clause that follows from the listed reasons. It is different from the sequential て-form in that it is for reasons/facts rather than actions in sequence.", ["Non-exhaustive: implies there are more reasons than just those listed.", "Often followed by から, a conclusion, or an implied consequence."], "この部屋は広いし、静かだ。", "This room is spacious, and (also) quiet.", null, ["だ", "し", "し"]], ["a.ba-ai-in-case", "N4", "in the case of / in the event that / if", "V plain / i-adj / na-adj な / noun の + 場合(は)", "〜場合 introduces a hypothetical scenario or specific case — 'in the event that X'. More formal than the basic たら/ば/と/なら conditionals and typical of instructions, warnings, rules, and documentation. The optional は after 場合 sets up the case as the topic. Very common in official signage and emergency instructions.", ["More formal than たら/ば/と/なら — typical of official instructions and rules.", "Often appears in warnings and emergency signage: 火事の場合, 遅れる場合."], "火事の場合、このボタンを押してください。", "In case of fire, press this button.", ["plain", "場合", "ばあい"], ["な", "場合", "ばあい"]], ["a.hazu-datta-was-supposed", "N4", "was supposed to / should have been", "V plain / i-adj / noun の / na-adj な + はずだった", "〜はずだった is the past form of はず (expectation), express addEventListener("hashchange",()=>setPage(location.hash==="#adjectives"?"adj":"verb",true));
document.querySelectorAll("#lvbar button").forEach(b=>b.onclick=()=>{
  const l=b.dataset.l; if(levels.has(l)&&levels.size>1)levels.delete(l); else levels.add(l);
  try{localStorage.setItem("vc2-levels",JSON.stringify([...levels]))}catch(e){}
  applyFilter();});
$("#modeBtn").onclick=()=>{mode=mode==="verb"?"pattern":"verb";$("#modeBtn").classList.toggle("on",mode==="pattern");rebuild();};
$("#roBtn").onclick=()=>{showRo=!showRo;$("#roBtn").classList.toggle("on",showRo);rebuild();};
$("#customBtn").onclick=()=>{$("#custom").classList.toggle("show");$("#vp").style.top=$("#bar").offsetHeight+"px";};
$("#cGo").onclick=()=>{
  const w=$("#cW").value.trim(),r=$("#cR").value.trim()||w,en=$("#cE").value.trim(),c=$("#cC").value;$("#err").textContent="";
  if(!w)return $("#err").textContent="Enter a word.";
  if(PAGE==="adj"){ if(/[\u4e00-\u9faf]/.test(r))return $("#err").textContent="Add the reading in kana.";
    curA=makeAdj(w,r,en,(c==="i"||c==="na")?c:"auto");buildAdj();sizeActive();return; }
  if(/[一-龯]/.test(r))return $("#err").textContent="Add the reading in kana.";
  if(!/[うくぐすつぬぶむる]$/.test(r))return $("#err").textContent="Must end in an う-row kana.";
  if(w.slice(-1)!==r.slice(-1))return $("#err").textContent="Verb and reading should end in the same kana.";
  cur=makeVerb(w,r,en,c);rebuild();
};
let start=-1;try{const s=localStorage.getItem("vc2-verb");if(s&&flat[s])start=+s;}catch(e){}
if(start<0)start=flat.findIndex(v=>v[0]==="書く");
sel.value=start; pick(start);
let astart=0;try{const s=localStorage.getItem("vc2-adj");if(s&&aflat[s])astart=+s;}catch(e){}
asel.value=astart; curA=makeAdj(...aflat[astart]); buildAdj();
if(location.hash==="#adjectives") setPage("adj",true);
document.fonts&&document.fonts.ready.then(()=>{fitBoxes();sizeSheet();});
setTimeout(sizeSheet,800);
$("#vp").style.top=$("#bar").offsetHeight+"px";
requestAnimationFrame(fitWidth);
</script>
</body>
</html>

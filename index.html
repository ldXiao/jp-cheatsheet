<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese Verb Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ui:#f2f2f2;--uiInk:#222;--uiLine:#ccc}
@media (prefers-color-scheme:dark){:root{--ui:#1e1e21;--uiInk:#eee;--uiLine:#3a3a40}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#7c7c80;font-family:Arial,"Helvetica Neue","Noto Sans JP",sans-serif;color:var(--uiInk)}
#bar{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--ui);border-bottom:1px solid var(--uiLine);padding:6px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
#bar select,#bar input,#bar button{font:inherit;color:var(--uiInk);background:transparent;border:1px solid var(--uiLine);border-radius:6px;padding:4px 7px}
#bar button.on{background:var(--uiInk);color:var(--ui)}
#bar .sp{flex:1}
#custom{display:none;gap:6px;flex-wrap:wrap;width:100%}
#custom.show{display:flex}
#err{color:#d33;font-size:12px}
#vp{position:fixed;top:44px;left:0;right:0;bottom:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#sizer{position:relative;margin:12px auto}
.sheet{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 4px 30px rgba(0,0,0,.35);font-size:10.4px;line-height:1.22;color:#111;overflow:hidden}
.sheet *{font-family:Arial,"Helvetica Neue","Noto Sans JP",sans-serif}
#arrows{position:absolute;left:0;top:0;pointer-events:none}
.b{position:absolute;border-radius:9px;border:1.4px solid #555;overflow:hidden;padding:4px 6px}
.b.inner{border-style:dashed;border-radius:7px;position:relative;margin:3px 0;padding:2px 5px}
.ttl{text-align:center;margin-bottom:2px}
.ttl rt{font-size:.62em;letter-spacing:.06em}
.ttl .kj{font-size:2.05em;line-height:1.05;font-weight:400}
.ttl .en{font-weight:700;font-size:1.06em}
.ttl .sub{font-size:.95em}
.r{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px;padding:.5px 2px;border-radius:3px;cursor:pointer}
.r:hover{background:rgba(255,255,255,.55)}
.r.sel{background:#fff;outline:1.5px solid #c00}
.r .f{font-size:1.18em;white-space:nowrap}
.r .f .st{color:#777}
.r .f .sf{color:#000}
.r .f .alt{color:#7a2a9a}
.r .g{margin-left:auto;font-size:.9em;color:#222;text-align:right}
.r.na{opacity:.4}
.sh{font-weight:700;text-align:center;font-size:1.05em;margin:2px 0 1px}
.tiny{font-size:.72em;color:#444}
.note{font-size:.72em;text-align:center;color:#333}
.circ{position:absolute;border-radius:50%;border:4px solid #1d4a1c;background:#a3c46d;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111}
.circ.top{border-color:#0c2f8c;background:#2b4fc8;color:#fff;border-width:3px}
.circ.top.hit{background:#e8402f;border-color:#7a0f05}
.pill{position:absolute;border-radius:20px;border:1.6px solid #333;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:1.35em}
.endbox{position:absolute;background:#2ab6dc;border:1.5px solid #333;padding:5px 6px 2px}
.endbox .w{background:#fff;border:1px solid #333;text-align:center;font-size:1.18em;line-height:1.12;padding:1.25em 2px 2px;height:72%}
.endbox .ex{font-size:.7em;text-align:center;line-height:1.15;margin-top:2px;color:#0b2433}
.tok.hit{background:#e8402f;color:#fff;border-radius:3px;padding:0 2px}
.ichi{position:absolute;background:#b7c682;border:1.5px solid #333;padding:5px 7px}
.ichi .t{text-align:center;font-size:1.3em;margin:3px 0 6px}
.ichi .w{background:#fff;border:1px solid #333;text-align:center;font-size:1.35em;padding:8px 2px}
.ichi.hit .w{outline:3px solid #e8402f}
.vert{position:absolute;transform:rotate(-90deg);transform-origin:0 0;font-size:.85em;color:#333;white-space:nowrap}
table.vt{width:100%;border-collapse:collapse;font-size:1em;background:#fff}
table.vt td,table.vt th{border:1px solid #333;padding:1px 4px}
table.vt th{color:#1f6a7a;font-size:1.05em}
table.vt th.i{color:#4a6a2a}
table.vt .mid{text-align:center;font-size:.92em;color:#333}
table.vt .cf{text-align:center}
.godanc{color:#1f6a7a}.ichic{color:#4a6a2a}
.dim{opacity:.35}
#title{position:absolute;text-align:left}
#title .a{font-weight:900;font-size:1.75em;color:#0b1f8c;letter-spacing:.5px;line-height:1}
#title .j{font-weight:900;font-size:1.9em;color:#0b1f8c;line-height:1.1}
#title .c{font-size:.75em;color:#6a6aaa}
#vb{position:absolute;text-align:right}
#vb .k{font-size:2.6em;font-weight:700;color:#0b1f8c;line-height:1}
#vb .m{font-size:1.05em;color:#334}
.lv{font-size:.62em;font-weight:700;color:#fff;border-radius:3px;padding:0 3px;line-height:1.35;align-self:center;font-family:Arial,sans-serif;letter-spacing:.02em}
.lN5{background:#3a9a4a}.lN4{background:#178a9a}.lN3{background:#2b5bd0}.lN2{background:#d07a12}.lN1{background:#c0261a}
.sheet .r.off{opacity:.13}
.sheet .ext .r.off{display:none}
.ext{position:absolute;border-radius:9px;border:1.4px solid #555;padding:4px 6px 6px}
.ext h3{margin:0 0 3px;text-align:center;font-size:1.25em;font-weight:700}
.exthead{position:absolute;display:flex;align-items:center;gap:10px;font-weight:700;color:#0b1f8c}
.exthead .ln{flex:1;height:2px;background:#0b1f8c;opacity:.35}
#lvbar{display:flex;gap:3px;align-items:center}
#bar #lvbar button{padding:3px 7px;font-weight:700;font-size:12px;color:#fff;border-color:transparent}
#bar #lvbar button.lN5{background:#3a9a4a}#bar #lvbar button.lN4{background:#178a9a}#bar #lvbar button.lN3{background:#2b5bd0}#bar #lvbar button.lN2{background:#d07a12}#bar #lvbar button.lN1{background:#c0261a}
#bar #lvbar button.off{opacity:.3;text-decoration:line-through}
#lvbar .lbl{font-size:12px;opacity:.7;margin-right:2px}
/* detail panel */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ui);color:var(--uiInk);border-top:1px solid var(--uiLine);box-shadow:0 -6px 24px rgba(0,0,0,.25);max-height:52vh;overflow:auto;padding:10px 14px 16px;transform:translateY(105%);transition:transform .18s;font-size:14px;line-height:1.45}
#panel.show{transform:none}
#panel .x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:22px;color:var(--uiInk);cursor:pointer}
#panel .pf{font-size:24px;font-family:"Noto Sans JP",sans-serif}
#panel .pr{color:#888;font-size:13px}
#panel .pat{display:inline-block;font-size:12px;border:1px solid var(--uiLine);border-radius:10px;padding:1px 8px;margin:4px 6px 4px 0}
#panel .exj{font-family:"Noto Sans JP",sans-serif;font-size:16px;margin-top:6px;border-left:3px solid #e8402f;padding-left:8px}
#panel .exe{color:#888;font-size:13px;padding-left:11px}
#zoom{position:fixed;right:10px;bottom:12px;z-index:25;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:50%;border:1px solid var(--uiLine);background:var(--ui);color:var(--uiInk);font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.banner{position:absolute;background:linear-gradient(90deg,#2a12c8,#3d2ee0);border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.banner .bj{font-size:2.3em;font-weight:900;margin-right:14px}.banner .be{font-size:1.6em;font-weight:900;letter-spacing:.5px}
.banner .bv{font-size:1.05em;text-align:right}.banner .bv b{font-size:1.9em;color:#ffd84a}
table.at{width:100%;border-collapse:collapse;background:#fff;border:2px solid #222;font-size:1.02em}
table.at th{background:#f04e23;color:#fff;padding:2px 4px;text-align:left;font-size:.95em}
.sheet .b[style*="#ffd84a"] table.at th{background:#c99a00}
table.at td{padding:1.5px 4px;border-bottom:1px solid #f1c39c;vertical-align:top}
table.at tr:nth-child(odd) td{background:#fde3cf}
table.at td.lb{font-weight:600;white-space:nowrap;font-size:.92em}
table.at td .f, table.at td{font-size:1em}
table.at tr.ar{cursor:pointer}
table.at tr.ar td:nth-child(2),table.at tr.ar td:nth-child(3){font-size:1.12em}
table.at tr.sel td{background:#fff !important;outline:1.5px solid #c00}
table.at tr.dimrow td:nth-child(2),table.at tr.dimrow td:nth-child(3){opacity:.45}
table.at.cop td:nth-child(2),table.at.cop td:nth-child(3){font-size:1.12em}
.sheet tr.off{opacity:.13}
ul.nt{margin:2px 0 0;padding-left:1.1em;font-size:.95em;line-height:1.3}ul.nt li{margin-bottom:2px}
#pages{display:flex;gap:0}#pages button{border-radius:0}#pages button:first-child{border-radius:6px 0 0 6px}#pages button:last-child{border-radius:0 6px 6px 0}
</style>
</head>
<body>
<div id="bar">
  <div id="pages"><button id="pgV" class="on">動詞 Verbs</button><button id="pgA">形容詞 Adjectives</button></div>
  <select id="verbSel" aria-label="Verb"></select><select id="adjSel" aria-label="Adjective" style="display:none"></select>
  <button id="customBtn">＋ Any word</button>
  <button id="modeBtn" title="Show the selected verb's forms, or the bare patterns like the original sheet">Patterns</button>
  <button id="roBtn">Romaji</button>
  <div id="lvbar"><span class="lbl">JLPT</span><button data-l="N5" class="lN5" style="color:#fff">N5</button><button data-l="N4" class="lN4" style="color:#fff">N4</button><button data-l="N3" class="lN3" style="color:#fff">N3</button><button data-l="N2" class="lN2" style="color:#fff">N2</button><button data-l="N1" class="lN1" style="color:#fff">N1</button></div>
  <span class="sp"></span>
  <div id="custom">
    <input id="cW" placeholder="Verb: 走る / はしる" style="width:130px">
    <input id="cR" placeholder="Reading if kanji" style="width:120px">
    <input id="cE" placeholder="English" style="width:90px">
    <select id="cC"><option value="auto">Auto class</option><option value="godan">Godan</option><option value="ichidan">Ichidan</option><option value="suru">する</option><option value="kuru">来る</option><option value="i">い-adj</option><option value="na">な-adj</option></select>
    <button id="cGo">Show</button><span id="err"></span>
  </div>
</div>
<div id="vp"><div id="sizer"><div id="sheet" class="sheet"></div><div id="sheetA" class="sheet" style="display:none"></div></div></div>
<div id="zoom"><button id="zIn" aria-label="Zoom in">＋</button><button id="zOut" aria-label="Zoom out">－</button><button id="zFit" aria-label="Fit" title="Fit to width" style="font-size:13px">fit</button></div>
<div id="panel"><button class="x" aria-label="Close">×</button><div id="pbody"></div></div>

<script>
/* ======================= Verb engine ======================= */
const VERBS = [
 ["Irregular",[["する","する","do","suru"],["来る","くる","come","kuru"],["勉強する","べんきょうする","study","suru"],["持って来る","もってくる","bring","kuru"]]],
 ["Ichidan (る-verbs)",[["食べる","たべる","eat"],["見る","みる","see"],["起きる","おきる","get up"],["寝る","ねる","sleep"],["教える","おしえる","teach"],["着る","きる","wear"],["出る","でる","leave"],["いる","いる","be (animate)"],["借りる","かりる","borrow"],["忘れる","わすれる","forget"],["開ける","あける","open"]]],
 ["Godan (う-verbs)",[["会う","あう","meet"],["買う","かう","buy"],["待つ","まつ","wait"],["持つ","もつ","hold"],["取る","とる","take"],["作る","つくる","make"],["分かる","わかる","understand"],["読む","よむ","read"],["飲む","のむ","drink"],["遊ぶ","あそぶ","play"],["飛ぶ","とぶ","fly"],["死ぬ","しぬ","die"],["書く","かく","write"],["聞く","きく","listen"],["泳ぐ","およぐ","swim"],["継ぐ","つぐ","inherit"],["話す","はなす","speak"],["貸す","かす","lend"]]],
 ["Godan that look ichidan",[["帰る","かえる","return","godan"],["入る","はいる","enter","godan"],["走る","はしる","run","godan"],["知る","しる","know","godan"],["切る","きる","cut","godan"],["要る","いる","need","godan"]]],
 ["Special cases",[["行く","いく","go"],["ある","ある","exist"],["いらっしゃる","いらっしゃる","be/come/go (hon.)"],["くださる","くださる","give me (hon.)"],["なさる","なさる","do (hon.)"],["おっしゃる","おっしゃる","say (hon.)"]]]
];
const GODAN_RU=new Set(["かえる","はいる","はしる","しる","きる","いる","へる","しゃべる","かぎる","にぎる","すべる","ける","まいる","しめる","ねる","てる","あせる","いじる","まじる","ちる","ひねる","よみがえる","かじる","つねる","ねじる","しげる","しくじる","ちぎる","ふける","みなぎる","よじる"]);
const ICHI_K={"着る":1,"寝る":1,"居る":1,"変える":1,"替える":1,"経る":1,"閉める":1,"見る":1,"出る":1,"似る":1,"煮る":1,"得る":1};
const HON_ARU=new Set(["いらっしゃる","くださる","なさる","おっしゃる","ござる"]);
const ROWS={"う":"わいうえお","く":"かきくけこ","ぐ":"がぎぐげご","す":"さしすせそ","つ":"たちつてと","ぬ":"なにぬねの","ぶ":"ばびぶべぼ","む":"まみむめも","る":"らりるれろ"};
const TE={"う":["って","った"],"つ":["って","った"],"る":["って","った"],"む":["んで","んだ"],"ぶ":["んで","んだ"],"ぬ":["んで","んだ"],"く":["いて","いた"],"ぐ":["いで","いだ"],"す":["して","した"]};
const I_ROW="いきぎしじちぢにひびぴみり",E_ROW="えけげせぜてでねへべぺめれ";
const row=(u,v)=>ROWS[u]["aiueo".indexOf(v)];
function guessClass(w,r){
  if(r.endsWith("する"))return"suru"; if(r==="くる"||w.endsWith("来る"))return"kuru";
  if(ICHI_K[w])return"ichidan"; if(!r.endsWith("る"))return"godan"; if(GODAN_RU.has(r))return"godan";
  const p=r.slice(-2,-1); return (I_ROW.includes(p)||E_ROW.includes(p))?"ichidan":"godan";
}
function makeVerb(w,r,en,cls){
  r=r||w; if(!cls||cls==="auto")cls=guessClass(w,r);
  const tl=(cls==="suru"||cls==="kuru")?2:1, kuruK=cls==="kuru"&&w.endsWith("来る");
  const kPre=w.slice(0,w.length-tl), rPre=r.slice(0,r.length-tl);
  const P=t=>({k:kPre+(kuruK?"来"+t.slice(1):t),r:rPre+t,n:kPre.length});
  const u=r.slice(-1), S={w,r,en,cls,u};
  if(cls==="ichidan"){
    Object.assign(S,{dict:P("る"),i:P(""),a:P(""),te:P("て"),ta:P("た"),ba:P("れば"),vol:P("よう"),imp:null,
      pot:P("られる"),pas:P("られる"),caus:P("させる"),cp:P("させられる"),causAlt:P("さす"),cpAlt:null});
  }else if(cls==="godan"){
    const g=(v,s="")=>P(row(u,v)+s); let te=TE[u][0],ta=TE[u][1];
    if(r.endsWith("いく")||r.endsWith("ゆく")){te="って";ta="った";}
    Object.assign(S,{dict:P(u),i:g("i"),a:g("a"),te:P(te),ta:P(ta),ba:g("e","ば"),vol:g("o","う"),imp:g("e"),
      pot:g("e","る"),pas:g("a","れる"),caus:g("a","せる"),cp:g("a","せられる"),
      causAlt:u==="す"?null:g("a","す"),cpAlt:u==="す"?null:g("a","される")});
    if(HON_ARU.has(r)){S.i=P("い");S.imp=P("い");}
    if(r==="ある"){S.pot=null;}
  }else if(cls==="suru"){
    Object.assign(S,{dict:P("する"),i:P("し"),a:P("し"),te:P("して"),ta:P("した"),ba:P("すれば"),vol:P("しよう"),imp:P("しろ"),impAlt:P("せよ"),
      pot:{k:kPre+"できる",r:rPre+"できる",n:kPre.length},pas:P("される"),caus:P("させる"),cp:P("させられる"),causAlt:P("さす"),zu:P("せず")});
  }else{
    Object.assign(S,{dict:P("くる"),i:P("き"),a:P("こ"),te:P("きて"),ta:P("きた"),ba:P("くれば"),vol:P("こよう"),imp:P("こい"),
      pot:P("こられる"),pas:P("こられる"),caus:P("こさせる"),cp:P("こさせられる")});
  }
  // ない-stem (handles ある → ない)
  S.n = r==="ある" ? {k:"",r:"",n:0} : S.a;
  return S;
}
const RD=[["必要","ひつよう"],["場合","ばあい"],["一方","いっぽう"],["違い","ちがい"],["気味","ぎみ"],["次第","しだい"],["最後","さいご"],["以来","いらい"],["上げ","あげ"],["上で","うえで"],["初め","はじめ"],["始め","はじめ"],["始ま","はじま"],["終わ","おわ"],["続け","つづけ"],["決め","きめ"],["思","おも"],["欲し","ほし"],["過ぎ","すぎ"],["出","だ"],["合","あ"],["切","き"],["込","こ"],["得","え"],["済","す"],["方","かた"],["物","もの"],["行","い"],["前","まえ"],["後","あと"],["末","すえ"],["否","いな"]];
const rd=s=>{for(const[k,v]of RD)s=s.split(k).join(v);return s;};
const cat=(p,s)=>p?{k:p.k+s,r:p.r+rd(s),n:p.n}:null;
const drop=(p,c=1)=>p?{k:p.k.slice(0,-c),r:p.r.slice(0,-c),n:p.n}:null;
const RJ={};"きゃkya きゅkyu きょkyo しゃsha しゅshu しょsho ちゃcha ちゅchu ちょcho にゃnya にゅnyu にょnyo ひゃhya ひゅhyu ひょhyo みゃmya みゅmyu みょmyo りゃrya りゅryu りょryo ぎゃgya ぎゅgyu ぎょgyo じゃja じゅju じょjo びゃbya びゅbyu びょbyo".split(" ").forEach(s=>RJ[s.slice(0,2)]=s.slice(2));
"あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo".split(" ").forEach(s=>RJ[s[0]]=s.slice(1));
function romaji(s){let o="",i=0;while(i<s.length){const c=s[i];
  if(c==="っ"){const n=romaji(s.substr(i+1,2));o+=n?(n.startsWith("ch")?"t":n[0]):"";i++;continue;}
  if(RJ[s.substr(i,2)]&&s[i+1]&&"ゃゅょ".includes(s[i+1])){o+=RJ[s.substr(i,2)];i+=2;continue;}
  if(c==="ん"){const n=RJ[s[i+1]]||"";o+=/^[aeiouy]/.test(n)?"n'":"n";i++;continue;}
  o+=RJ[c]!==undefined?RJ[c]:c;i++;}return o;}

/* ======================= Explanations =======================
   id: [explanation, example JP, example EN]                    */
const EX={
 "d.na":["Blunt prohibition: “Don't!”. Seen on signs and in rough or urgent speech.","触るな！","Don't touch!"],
 "d.no":["Turns the verb phrase into a noun (“-ing”). の is the informal, concrete choice — used with verbs of perception and with 好き, 上手 etc.","泳ぐのが好きです。","I like swimming."],
 "d.koto":["Nominalizer like の but more abstract/formal; it is required in the こと-idioms below.","趣味は写真を撮ることです。","My hobby is taking photos."],
 "d.dekiru":["“Can / be able to” — a slightly formal alternative to the potential form.","ここで切符を買うことができる。","You can buy tickets here."],
 "d.aru":["“There are times when …” — something that happens occasionally. (With the た-form it means past experience.)","たまに朝ご飯を食べないことがある。","Sometimes I skip breakfast."],
 "d.nisuru":["“Decide to …” — a decision made by the speaker.","毎日走ることにした。","I decided to run every day."],
 "d.ninaru":["“It has been decided / it turns out that …” — a decision made by others or by circumstances.","来月大阪に転勤することになった。","It's been decided that I'll transfer to Osaka next month."],
 "d.to":["Automatic consequence: “whenever / if X, then (inevitably) Y”. Not used for requests or the speaker's intentions.","春になると桜が咲く。","When spring comes, the cherry blossoms bloom."],
 "d.mae":["“Before doing …”. Always the dictionary form, even when the sentence is in the past.","寝る前に歯を磨く。","I brush my teeth before going to bed."],
 "d.hayaika":["Literary “no sooner had … than …”.","ベルが鳴るがはやいか、学生たちは教室を飛び出した。","No sooner had the bell rung than the students rushed out."],
 "d.tomonaku":["Doing something without particular intention, absent-mindedly (literary).","聞くともなくラジオを聞いていた。","I was half-listening to the radio."],
 "d.beki":["“Should / ought to” — moral or ideal obligation. する→するべき or すべき.","約束は守るべきだ。","You should keep your promises."],
 "d.mai":["Formal/literary negative volitional: “will not / probably won't”. Ichidan verbs also take 食べまい.","二度と行くまい。","I will never go again."],
 "d.mitai":["“It seems that …” based on what you observe; casual (formal: ようだ).","彼は来月引っ越すみたい。","It seems he's moving next month."],
 "d.sou":["Hearsay: “I've heard that …”. Attaches to the plain form (compare the 連用形 そう “looks like”).","明日は雨が降るそうだ。","I hear it'll rain tomorrow."],
 "d.rashii":["“Apparently / it seems” from indirect evidence or rumour. Conjugates as an い-adjective.","彼は来月結婚するらしい。","Apparently he's getting married next month."],
 "d.darou":["Tentative copula: “probably …”. Polite: でしょう.","明日は晴れるだろう。","It'll probably be sunny tomorrow."],
 "d.hazu":["Expectation based on reasoning: “should / is supposed to”.","もう着くはずだ。","They should be arriving by now."],
 "d.nara":["Contextual “if” — “if (it's the case that) you're going to …”, responding to the situation.","京都に行くなら、金閣寺を見たほうがいい。","If you're going to Kyoto, you should see Kinkakuji."],
 "d.tsumori":["Intention or plan.","来年留学するつもりです。","I intend to study abroad next year."],
 "i.tai":["Speaker's desire: “want to”. Conjugates as an い-adjective (たくない, たかった).","日本に行きたい。","I want to go to Japan."],
 "i.tagaru":["Someone else's apparent desire; a 五段 verb, usually as たがっている.","弟がゲームをしたがっている。","My little brother wants to play games."],
 "i.hashinai":["Emphatic negative with は inserted: “(certainly) won't …”.","そんなことは言いはしない。","I would never say such a thing."],
 "i.nagara":["Two actions at once by the same person: “while …-ing”.","音楽を聞きながら勉強する。","I study while listening to music."],
 "i.gachi":["Tends to (usually something undesirable). Behaves as a な-adjective.","冬は家にこもりがちだ。","In winter I tend to stay indoors."],
 "i.kata":["“Way of …-ing” — makes a noun (かた). The object takes の.","箸の使い方を教えてください。","Please teach me how to use chopsticks."],
 "i.sou":["Appearance/imminence from what you see: “looks like it's about to”.","雨が降りそうだ。","It looks like it's going to rain."],
 "i.tsutsu":["Literary “while …”, or with ある: “is in the process of”.","経済は回復しつつある。","The economy is recovering."],
 "i.yagaru":["Very rude, contemptuous (yakuza / angry speech) — shows the speaker despises the doer.","何を見てやがる！","What the hell are you looking at!"],
 "i.sugiru":["Excess: “too much”. Becomes a 一段 verb.","昨日は飲みすぎた。","I drank too much yesterday."],
 "i.niiku":["Purpose of movement: “go / come (in order) to …”.","パンを買いに行く。","I'm going to buy bread."],
 "i.yasui":["“Easy to …”. い-adjective.","このペンは書きやすい。","This pen is easy to write with."],
 "i.nikui":["“Difficult to …”. い-adjective.","この字は読みにくい。","This handwriting is hard to read."],
 "i.verb":["Compound verbs: the 連用形 joins directly onto a second verb (始める, 終わる, 出す, 続ける…).","雨が降り始めた。","It started to rain."],
 "i.noun":["The bare 連用形 often works as a noun on its own (休み, 帰り, 話).","帰りに買い物をする。","I'll shop on the way home."],
 "i.mono":["Stem + 物 makes a noun for the thing acted on (食べ物 food, 飲み物 drink).","何か飲み物はありますか。","Is there anything to drink?"],
 "i.masu":["Polite non-past.","毎日日本語を勉強します。","I study Japanese every day."],
 "i.masen":["Polite negative.","お酒は飲みません。","I don't drink alcohol."],
 "i.mashita":["Polite past.","駅で友達に会いました。","I met a friend at the station."],
 "i.masendeshita":["Polite past negative.","昨日は出かけませんでした。","I didn't go out yesterday."],
 "i.mashou":["Polite volitional: “let's / shall I”.","一緒に帰りましょう。","Let's go home together."],
 "i.mashite":["Polite て-form, used in very formal speech (speeches, announcements).","初めまして。","Nice to meet you. (lit. “for the first time”)"],
 "i.masureba":["Polite conditional; rare and very formal.","ご連絡いただけますれば幸いです。","I'd be grateful if you could contact me."],
 "i.nasai":["Firm instruction (parents, teachers). Casual 〜な (食べな) is a softer command.","早く寝なさい。","Go to bed now."],
 "a.nai":["Plain negative. Conjugates as an い-adjective.","肉は食べない。","I don't eat meat."],
 "a.naide":["“Without …-ing / instead of …”.","朝ご飯を食べないで学校に行った。","I went to school without eating breakfast."],
 "a.nakute":["Negative て-form for causes and with もいい.","バスが来なくて、遅刻した。","The bus didn't come, so I was late."],
 "a.nakatta":["Plain past negative.","朝ご飯を食べなかった。","I didn't eat breakfast."],
 "a.nakereba":["Negative conditional: “if not …”.","今行かなければ、遅れる。","If we don't go now, we'll be late."],
 "a.nakarou":["Negative volitional/presumptive (formal, written). Speech uses ないだろう.","彼は来なかろう。","He probably won't come."],
 "a.naidekudasai":["Polite negative request: “please don't”.","ここで写真を撮らないでください。","Please don't take photos here."],
 "a.naito":["“Must” — lit. “if not doing, it won't do”. ないと on its own is the casual short form.","もう行かないと。","I have to go now."],
 "a.nakutewa":["“Must”. Casual short form: なくちゃ.","宿題をしなくちゃ。","I've got to do my homework."],
 "a.nakucha":["Contracted なくては + いけない; casual.","明日早く起きなくちゃいけない。","I have to get up early tomorrow."],
 "a.nakereba2":["“Must” — the most standard written form (also なければならない). Casual: なきゃ.","明日までにレポートを出さなければいけない。","I have to submit the report by tomorrow."],
 "a.nakya":["Contracted なければ + いけない; very common in speech, often just なきゃ.","もう寝なきゃ。","Gotta go to bed."],
 "a.zu":["Old/literary negative, survives in set phrases.","相変わらず忙しい。","Busy as ever."],
 "a.zuni":["Formal “without …-ing” (= ないで). する → せずに.","何も言わずに出て行った。","He left without saying anything."],
 "a.pas":["Passive (“be …-ed”), the suffering passive (something happens to you), and a light honorific. Becomes a 一段 verb.","先生に褒められた。","I was praised by the teacher."],
 "a.caus":["Causative: “make / let someone …”. させてください = “please let me”. Spoken short form: 〜す / 〜さす.","母は子供に野菜を食べさせた。","The mother made the child eat vegetables."],
 "a.cp":["Causative-passive: “be made to …” (unwillingly). Godan verbs not ending in す usually shorten to 〜される.","子供のころ、ピアノを習わされた。","As a child I was made to take piano lessons."],
 "e.imp":["Blunt command — rough speech, sports, emergencies, quoted orders.","逃げろ！ / 早く来い！","Run! / Get over here!"],
 "e.ba":["Hypothetical “if”. Focus on the condition; used in advice (〜ばいい) and proverbs.","急げば間に合う。","If you hurry, you'll make it."],
 "e.pot":["Potential: “can”. Becomes a new 一段 verb and the object often switches を → が. Ichidan verbs drop ら in speech (食べれる).","日本語が話せます。","I can speak Japanese."],
 "e.bai":["“Should / it would be good to” — advice or asking what to do.","どうすればいいですか。","What should I do?"],
 "e.bayokatta":["Regret: “I should have …”.","もっと早く来ればよかった。","I should have come earlier."],
 "ichi.imp":["Ichidan imperative: ろ in speech, よ in writing.","早く寝ろ！","Go to sleep!"],
 "o.vol":["Plain volitional: “let's …” / “I think I'll …”. Polite: ましょう.","一緒に食べよう。","Let's eat together."],
 "o.tosuru":["“Try to / be about to” — an attempt, often unsuccessful.","出かけようとしたとき、電話が鳴った。","Just as I was about to go out, the phone rang."],
 "o.toomou":["“I'm thinking of …” — an intention being considered.","来年、引っ越そうと思っている。","I'm thinking of moving next year."],
 "o.tokimeru":["“Decide to (try to) …”.","今年こそ痩せようと決めた。","I decided this is the year I'll lose weight."],
 "t.te":["The て-form itself joins clauses (“and”), gives reasons, and is a casual request.","朝起きて、シャワーを浴びた。","I got up and took a shower."],
 "t.iku":["Change moving away / continuing into the future: “go on …-ing”.","これから寒くなっていく。","It'll keep getting colder from now on."],
 "t.iru":["Ongoing action, habit, or resulting state. Casual drops い: 〜てる.","今、雨が降っている。","It's raining now."],
 "t.oku":["Do something in advance / leave it as is. Casual: 〜とく.","旅行の前にホテルを予約しておく。","I'll book the hotel before the trip."],
 "t.shimau":["Completion, or regret. Casual: 〜ちゃう / 〜じゃう.","財布を忘れちゃった。","I forgot my wallet (oops)."],
 "t.yokatta":["“I'm glad that …”.","来てよかった。","I'm glad I came."],
 "t.miru":["“Try … and see”.","納豆を食べてみた。","I tried eating natto."],
 "t.hoshii":["“I want you to …” — asking a favour.","手伝ってほしい。","I'd like you to help me."],
 "t.aru":["State resulting from a deliberate action (usually transitive verbs; object takes が).","壁に地図が貼ってある。","A map has been put up on the wall."],
 "t.kara":["“After …-ing, …” — emphasises sequence.","手を洗ってから食べてください。","Please eat after washing your hands."],
 "t.kuru":["Change coming toward the present, or “go and come back”.","日本語が分かってきた。","I've started to understand Japanese."],
 "t.ikenai":["Prohibition: “must not”. Casual: 〜ちゃだめ / 〜じゃだめ.","ここでタバコを吸ってはいけません。","You mustn't smoke here."],
 "t.wa":["Suggestion as a question: “how about …?” (〜てはどう / 〜ては).","少し休んではどうですか。","How about taking a short break?"],
 "t.kamawanai":["Permission: “it doesn't matter if …”.","ここに座ってもかまわない。","It's fine to sit here."],
 "t.moii":["Permission: “may / it's OK to”. Casual: 〜ていい.","窓を開けてもいいですか。","May I open the window?"],
 "t.sumimasen":["Apology for what you did.","遅れてすみません。","Sorry for being late."],
 "t.mo":["“Even if / even though”.","いくら食べても太らない。","No matter how much I eat, I don't put on weight."],
 "t.kudasai":["Polite request.","ここに名前を書いてください。","Please write your name here."],
 "t.ageru":["Giving/receiving actions: あげる (do for others), くれる (others do for me), もらう (have someone do).","母に髪を切ってもらった。","I had my mother cut my hair."],
 "ta.ta":["Plain past (action completed).","昨日映画を見た。","I watched a movie yesterday."],
 "ta.kara":["The past form + から gives the reason for the next clause.","もう食べたから、お腹いっぱい。","I've already eaten, so I'm full."],
 "ta.ri":["“Do things like A and B” — non-exhaustive list; also repeated opposites (行ったり来たり).","週末は本を読んだり、映画を見たりする。","On weekends I read, watch movies and so on."],
 "ta.ra":["“If / when …” — the most versatile conditional; also suggestions (〜たらどう?).","家に着いたら電話して。","Call me when you get home."],
 "ta.bakari":["Just happened.","日本に来たばかりです。","I just came to Japan."],
 "ta.hougaii":["Advice: “you'd better …”. (Negative advice: ないほうがいい.)","早く寝たほうがいいよ。","You'd better go to bed early."],
 "ta.kotogaaru":["Past experience: “have done before”.","富士山に登ったことがある。","I've climbed Mt. Fuji."],
 "ta.darou":["Past presumptive: “probably did”.","もう着いただろう。","They've probably arrived by now."],
 "ta.rou":["Archaic past volitional/presumptive; rare.","さぞ疲れたろう。","You must have been tired."],
 "h.ninaru":["Honorific: raises the other person's action. Many verbs use special forms instead (いらっしゃる, 召し上がる…).","社長はもうお帰りになりました。","The president has already gone home."],
 "h.nasaru":["Respectful honorific (なさる = honorific する). Today it mostly appears as ご/お＋noun＋なさる or in set phrases like お帰りなさい; お＋verb stem＋なさる sounds old-fashioned.","どうぞご心配なさらないでください。","Please don't worry."],
 "h.suru":["Humble: lowers your own action toward the other person. する-verbs use ご + noun + する.","お荷物をお持ちします。","Let me carry your luggage."],
};

function compute(R){
  const S=R.page==="adj"?curA:cur; let v;
  if(typeof R.base==="function") v=R.base(S);
  else if(R.base==="hon"){ v=(S.cls==="godan"&&!HON_ARU.has(S.r)||S.cls==="ichidan")?{k:"お"+S.i.k+R.suf,r:"お"+S.i.r+R.suf,n:-1}:null; }
  else v=cat(S[R.base],R.suf);
  return v;
}
function fmtPair(p){
  const n=p.n<0?0:Math.min(p.n,p.k.length);
  return `<span class="st">${esc(p.k.slice(0,n))}</span><span class="sf">${esc(p.k.slice(n))}</span>`;
}
function rowHTML(R){
  let f;
  if(mode==="pattern"){ f=`<span class="sf">${esc(R.pat||("＋"+R.suf))}</span>`; }
  else{
    let v; try{v=compute(R);}catch(e){v=null;}
    const arr=(Array.isArray(v)?v:[v]).filter(Boolean);
    f = arr.length? arr.map(fmtPair).join('<span class="st"> / </span>') : `<span class="st">—</span>`;
    if(!arr.length) R._na=true; else R._na=false;
  }
  return `<div class="r${selId===R.id?" sel":""}${mode==="verb"&&R._na?" na":""}" data-id="${R.id}"><span class="f">${f}</span><span class="g">${esc(R.gloss)}</span></div>`;
}
const REG={}; // id → row spec
function rows(list){return list.map(R=>{REG[R.id]=R;return rowHTML(R);}).join("");}
function ttl(furi,kj,en,sub){
  const rb=[...kj].map((c,i)=>`<ruby>${c}<rt>${furi[i]||""}</rt></ruby>`).join("");
  return `<div class="ttl"><div class="kj">${rb}</div>${en?`<div class="en">${en}</div>`:""}${sub?`<div class="sub">${sub}</div>`:""}</div>`;
}

const GEN=[["g.ni-kataku-nai", "N1", "dict", "に難くない", "にがたくない", "easy to imagine / not hard to", "Noun / V dict + に難くない", "〜に難くない is a literary construction meaning 'not hard to X' — typically used with verbs of imagination, understanding, or inference to indicate that the main clause situation is readily graspable. Common fixed forms: 想像に難くない ('easy to imagine'), 察するに難くない ('easy to infer'). Very formal / literary register.", ["Literary / formal 'not hard to X'.", "Most common fixed form: 想像に難くない ('easy to imagine')."], "彼の苦労は想像に難くない。", "His hardship is easy to imagine.", "jld"], ["g.nai-dewa-okanai", "N1", "n", "ないではおかない", "ないではおかない", "will not fail to / will inevitably", "V ない-form + ではおかない", "〜ないではおかない is a less literary variant of 〜ずにはおかない, expressing determined action or natural inevitability — 'will not leave without X happening'. Formal register, interchangeable in meaning with ずにはおかない. The form uses the casual negative ない-form with ではおかない.", ["Less formal variant of 〜ずにはおかない — same two senses (resolve / inevitability).", "The negative form attaches directly: 言わない → 言わないではおかない."], "彼に一言言わないではおかない。", "I will not leave without saying a word to him.", "jld"], ["g.made-da", "N1", "dict", "までだ", "までだ", "(I'll) just / I'll simply X (if needed)", "V dict-form + までだ / までのことだ", "〜までだ / 〜までのことだ expresses a speaker's resolve to take a specific (often unremarkable or last-resort) action if necessary — 'I'll just X'. The main clause action is presented as a simple, unchallenging fallback. Formal register, common in declarations of resolve.", ["Resolved fallback — 'in that case, I'll simply X'.", "Two variants: までだ (shorter) and までのことだ (slightly more emphatic)."], "だめなら、諦めるまでだ。", "If it doesn't work, I'll just give up.", "jld"], ["g.made-no-koto-da", "N1", "ta", "までのことだ", "までのことだ", "all I did was / it was simply because", "V-た form + までのことだ", "〜たまでのことだ downplays an action as unremarkable or modest — 'all I did was X' / 'I was simply doing X'. Common in humble responses to status / role than circumstance."], "大人ともなれば、責任を持たなければならない。", "Once one is an adult, one must bear responsibility.", "jld"], ["g.katawara", "N1", "dict", "かたわら", "かたわら", "while also / alongside (doing)", "V plain / noun + の + かたわら", "〜かたわら expresses that the subject does a secondary activity alongside the main one — 'while also doing X'. Typically for two long-term ongoing activities (e.g., work and study). Formal / literary register. Different from 〜ながら (simultaneous single-action) in that かたわら is for parallel long-term roles.", ["Parallel long-term activities — not simultaneous single actions.", "Common: 仕事のかたわら, 勉強のかたわら, 子育てのかたわら."], "彼は会社で働くかたわら、夜は大学で学んでいる。", "He works at a company, while also studying at university at night.", "jld"], ["g.bekarazu", "N1", "dict", "べからず", "べからず", "must not / should not (archaic prohibition)", "V dict-form + べからず / べからざる", "〜べからず is an archaic / classical prohibition meaning 'must not X'. Rare in modern speech, common in old signs and proverbs. The attributive form べからざる is used as a modifier — 'that must not be Xed'. Fixed form: 〜べからざる+ 行為 ('an act that must not be done').", ["Archaic prohibition — very rare in modern speech.", "Common in historical signs: 立ち入るべからず ('no entry')."], "ここに立ち入るべからず。", "No entry here.", "jld"], ["g.zu-ni-wa-sumanai", "N1", "a", "ずにはすまない", "ずにはすまない", "can't get by without / must inevitably do", "V negative stem + ずにはすまない / ないではすまない", "〜ずにはすまない expresses that the speaker cannot let X go undone — 'one cannot get by without doing X' / 'X must inevitably happen'. Often used for obligations arising from social or moral pressure. Formal register. Irregular: する → せずにはすまない.", ["Social / moral inevitability — one cannot escape doing X.", "Irregular: せずにはすまない for する."], "謝らずにはすまないだろう。", "He'll have no choice but to apologize.", "jld"], ["g.you-ni-mo-nai", "N1", "vol", "にも", "にも", "can't (do X) even if one wanted to", "V volitional + にも + V potential negative", "〜ようにも〜ない expresses that an action is impossible even though the subject would like to do it — 'I can't do X even if I wanted to'. The X verb appears twice: once in volitional form + にも, then in potential negative. Literary / formal register.", ["Double-verb structure — the same verb appears in volitional + にも and potential negative.", "Literary register — common in narratives of frustrated action."], "言おうにも言えない状況だ。", "It's a situation where I can't speak even if I wanted to.", "jld"], ["g.n-ga-tame", "N1", "a", "んがため(に)", "んがため(に)", "in order to / for the purpose of (literary)", "V ない-stem + んがため(に)", "〜んがため(に) is a literary / archaic purpose marker meaning 'in order to X'. More formal and older-sounding than 〜ために or 〜ように. Rare in modern speech, common in essays, historical writing, and formal prose. Irregular: する → せんがため.", ["Very literary / archaic purpose marker.", "Irregular: せんがため for する."], "真実を知らんがために、調査を続けた。", "In order to know the truth, he continued the investigation.", "jld"], ["g.n-bakari", "N1", "a", "んばかり(に)", "んばかり(に)", "as if about to / looking as if", "V ない-stem + んばかり(に)", "〜んばかり(に) expresses that something looks as if it is about to happen or happen intensely — 'as if about to X'. Often used metaphorically for emphasis: 泣かんばかりに ('as if about to cry'). Literary register. The ん is from archaic negative む, but the meaning is 'about to'.", ["Metaphorical 'as if about to' — often hyperbolic.", "Common: 泣かんばかりに, 飛びかからんばかりに, 叫ばんばかりに."], "彼女は泣かんばかりの表情だった。", "She had an expression as if she were about to cry.", "jld"], ["g.ya-literary", "N1", "dict", "や", "や", "at the moment of / as soon as (literary)", "Verb dict-form + や / や否や", "〜や / 〜や否や is a literary / classical 'as soon as' construction. Very dramatic in tone, common in classical prose and formal narratives. Similar in meaning to 〜なり (N2 literary 'as soon as') and 〜たとたん (N3). Verb stays in dictionary form.", ["Literary / classical 'as soon as'.", "や alone or や否や (same meaning)."], "彼は家を出るや、走り出した。", "The moment he left the house, he ran off.", "jld"], ["g.te-mae", "N1", "dict", "手前", "てまえ", "in view of / out of consideration for / for the sake of appearance", "V plain / noun + の + 手前", "〜手前 expresses that an action is taken out of consideration for something or someone — often 'out of face' or 'in view of X'. The speaker feels obliged to act a certain way because of social appearance or previous commitments. Formal / literary register.", ["Social / face-saving consideration — 'out of consideration for X'.", "Often when the speaker must act a certain way for appearances."], "約束した手前、引き下がれない。", "Having promised, I can't back down.", "jld"], ["g.tokoro-wo", "N1", "dict", "ところを", "ところを", "(although) at / while / in the middle of (polite apology)", "V plain / adj + ところを", "〜ところを is a polite / formal construction used when interrupting or apologizing for taking someone's time — 'while X (I apologize for disturbing)'. Common in business and formal speech, especially in the phrase お忙しいところを ('while you're busy'). Formal register.", ["Polite apology for interrupting — formal business register.", "Common fixed phrase: お忙しいところを (apologizing for taking busy time)."], "お忙しいところを、ありがとうございます。", "Thank you for your time despite being busy.", "jld"], ["g.te-habakaranai", "N1", "te", "はばからない", "はばからない", "does not hesitate to / declares openly", "V-て form + はばからない", "〜てはばからない expresses that the subject does something without hesitation or inhibition — 'does X openly / unapologetically'. Often with assertions, declarations, or bold actions. Usually with a note of surprise or criticism from the speaker at the directness. Literary / formal register.", ["'Doesn't hold back' — often implies directness that surprises or criticizes.", "Common with verbs of speaking: 言ってはばからない, 主張してはばからない."], "彼は自分が一番だと言ってはばからない。", "He openly declares he's the best.", "jld"], ["g.beku-mo-nai", "N1", "dict", "べくもない", "べくもない", "no way to / cannot possibly", "Verb dict-form + べくもない", "〜べくもない expresses that something is impossible — 'there is no way to X'. Built on the classical べし ('should / must') with negation. More literary / emphatic than 〜ようがない. Rare in modern casual speech, common in literary and formal writing.", ["Literary 'no way to / cannot possibly'.", "Related to 〜べき / 〜べからず via the classical べし."], "彼の意図を知るべくもない。", "There's no way to know his intentions.", "jld"], ["g.to-yara", "N1", "dict", "とやら", "とやら", "some kind of / (I hear) something like", "Noun / plain form + とやら", "〜とやら expresses that the speaker is uncertain about the exact detail — 'some kind of X' / 'something called X'. The speaker has heard of X but is hazy on specifics. Common in conversation when referring to things secondhand. Formal / literary register.", ["Vagueness / secondhand knowledge — the speaker doesn't fully know.", "Common when referring to things by name without commitment: 田中さんとやら ('someone named Tanaka')."], "田中さんとやらは、どこの人ですか。", "This Tanaka person — where is he from?", "jld"], ["g.ori-ni", "N1", "dict", "折(に)", "おり(に)", "on the occasion of / when", "V plain / noun + の + 折(に)", "〜折(に) is a formal / polite temporal marker meaning 'on the occasion of' — a specific moment or opportunity. More formal than 〜とき, often used in polite correspondence and formal speech. Common in set phrases and polite framings.", ["Formal 'on the occasion of' — more polite than とき or 際.", "Common in polite correspondence: お近くにお越しの折には ('when you come near us')."], "お近くにお越しの折には、お寄りください。", "When you come near us, please drop by.", "jld"], ["g.nagara-ni", "N1", "i", "ながらに(して)", "ながらに(して)", "while / in (the state of) / from the start", "Noun / V stem + ながらに(して)", "〜ながらに is a literary construction expressing that the main action is done 'while in the state of X' or 'in a way that preserves X'. Often with 生まれ (born), 涙 (tears), 昔 (the past): 生まれながらに ('since birth'), 涙ながらに ('tearfully'), 昔ながらに ('as in the old days'). Distinct from 〜ながら (simultaneous single-action).", ["Literary 'while in / from' — state-preserving.", "Common fixed forms: 生まれながらに, 涙ながらに, 昔ながらに, n form + ならまだしも", "〜ならまだしも expresses that while X would be acceptable or tolerable, the actual situation (Y, described in the main clause) goes beyond what is OK — 'if only X, that would be fine, but Y is too much'. Used to escalate criticism or complaint by comparison.", ["Escalating criticism — 'X would be OK, but Y crosses the line'.", "Common in complaints and disappointment: 一度ならまだしも、何度もは困る ('once would be OK, but many times is a problem')."], "一度ならまだしも、何度も遅刻するのは困る。", "Once I could accept, but being late repeatedly is a problem.", "jld"], ["g.nara-iza-shirazu", "N1", "dict", "ならいざ知らず", "ならいざしらず", "if it were X, I wouldn't know / X might be one thing but", "Noun / plain form + ならいざ知らず", "〜ならいざ知らず expresses that while X might be a legitimate exception, Y (the main clause situation) is definitely not — 'X might be understandable, but Y isn't'. Similar in function to 〜ならまだしも but with a slightly more dismissive / exceptional framing. Literary / formal register.", ["Contrastive exception — 'X might be a case where I couldn't say, but Y is clearly not'.", "Similar to 〜ならまだしも but slightly more dismissive."], "子供ならいざ知らず、大人がそんな失敗をするなんて。", "If it were a child I wouldn't know, but for an adult to make such a mistake!", "jld"], ["g.to-shita-tokoro-de", "N1", "dict", "としたところで", "としたところで", "even if we assume / even for", "Plain form + としたところで", "〜としたところで is a hypothetical concessive — 'even if we assume X, Y'. Similar to 〜にしたところで and 〜としても, hedging a hypothetical and presenting a main-clause claim that holds regardless. Formal / literary register.", ["Formal hypothetical concession.", "Similar to 〜にしたところで and 〜としても."], "仮に成功したとしたところで、喜べない。", "Even if we assume it succeeded, I can't be happy.", "jld"], ["g.hodo-no", "N1", "dict", "ほどの", "ほどの", "of such a degree / to the extent of (a)", "Noun / plain form + ほどの + noun", "〜ほどの + noun expresses that the following noun has the degree or extent of X — 'a noun of the extent / caliber of X'. Used to describe high-degree qualities or gone too far.", "jld"], ["g.ni-tari-nai", "N1", "dict", "に足りない", "にたりない", "not worth / insufficient for / unworthy of", "Noun / V dict-form + に足りない", "〜に足りない is a negation of 〜に足る (worth), expressing that something is 'not worth X' or 'unworthy of X'. More dismissive variant of 〜に足る. Common with nouns of evaluation: 信頼に足りない ('not worthy of trust'), 恐れるに足りない ('not worth fearing'). Formal / literary register.", ["Negation of 〜に足る — 'not worth X'.", "Common fixed phrases: 信頼に足りない, 恐れるに足りない, 取るに足りない."], "それは取るに足りないことだ。", "That's not worth mentioning.", "jld"], ["g.katagata-combining", "N1", "i", "かたがた", "かたがた", "combining / at the same time / also as", "V ます-stem / noun + かたがた", "〜かたがた expresses that an action serves two purposes at once — 'combining X with Y' / 'taking the opportunity to do both'. Similar in function to 〜がてら but more formal. Often used in polite correspondence about visits or gifts: お礼かたがた ('serving also as thanks'). Formal / literary register.", ["Formal / polite 'serving two purposes at once'.", "More formal than 〜がてら (N1 also)."], "お礼かたがた、ご挨拶に伺います。", "I will visit you for a greeting, which also serves as thanks.", "jld"], ["g.n-to-suru", "N1", "a", "んとする", "んとする", "about to / trying to / on the verge of (literary)", "Verb volitional + んとする", "〜んとする is a literary / archaic construction meaning 'about to X' or 'trying to X'. Uses the classical volitional form with する. Very formal / literary, rarely in casual speech. Common fixed forms: 言わんとする ('trying to say'), 飛び去らんとする ('on the verge of flying away').", ["Literary / classical — modern equivalent is 〜ようとする.", "Common fixed forms: 言わんとする, 消えんとする, 死なんとする."], "彼の言わんとするところを理解した。", "I understood what he was trying to say.", "jld"], ["g.ni-soui-nai", "N1", "dict", "に相違ない", "にそういない", "no doubt / certainly / I'm sure", "Plain form + に相違ない", "〜に相違ない is a formal / literary equivalent of 〜に違いない ('must be'), expressing strong conviction — 'there is no doubt that X'. The noun 相違 literally means 'difference / discrepancy'. Very formal, common in written reports and formal analyses.", ["Formal / literary equivalent of 〜に違いない.", "Very common in formal writing: news, reports, essays."], "彼が犯人に相違ない。", "There's no doubt he's the culprit.", "jld"], ["g.to-atte-wa", "N1", "dict", "とあっては", "とあっては", "if it's (a case of) / given that it is", "Plain form / noun + とあっては", "〜とあっては expresses a conditional based on a specific circumstance — 'if it's the case that X, (then Y follows)'. Often used for commitments or required responses given a special situation. Close to 〜とあれば but with a slightly stronger case-making flavor. Formal / literary register.", ["Conditional case-making — 'if it's a case of X, then Y'.", "Close to 〜とあれば (covered at N2) — とあっては is slightly more insistent."], "緊急事態とあっては、すぐ駆けつけなければならない。", "If it's an emergency, I have to rush over right away.", "jld"], ["g.mono-wo-if-only", "N1", "dict", "ものを", "ものを", "if only / you should have (regret)", "Plain form + ものを", "〜ものを expresses the speaker's regret or frustration that someone didn't do what would have been sensible — 'if only you had X' / 'you should have X, but didn't'. Literary register, often with an emotional / scolding nuance. Common paired with 〜たら / 〜ば.", ["Regret / frustration over someone's inaction or wrong action.", "Often paired with conditional: 言ってくれたらよかったものを ('if only you had told me')."], "早く言ってくれればよかったものを。", "If only you had told me sooner.", "jld"], ["g.to-minasu", "N1", "dict", "とみなす", "とみなす", "regard as / consider as / deem to be", "Noun / plain form + とみなす", "〜とみなす expresses a formal judgment or designation — 'regard as X' / 'deem to be X'. Common in legal, business, and policy contexts for making categorical decisions. The verb 見なす literally means 'to regard / consider'. Formal / official register.", ["Formal / official designation — 'for the purposes of X, consider Y to be Z'.", "Common in legal and policy: 〜とみなされる ('is deemed to be')."], "無断欠席は退学とみなされる。", "Unexcused absence will be regarded as withdrawal.", "jld"], ["g.ni-aki-tarazu", "N1", "dict", "に飽き足らず", "にあきたらず", "not content with / not satisfied with (and seeking more)", "Noun / plain form + に飽き足らず", "〜に飽き足らず expresses that the subject is not content with X and seeks or does Y in addition — 'not satisfied with X, (they also pursue Y)'. Literary register, often in narratives of ambition or drive.", ["Ambition / drive — subject wants more than X.", "Common in narratives of achievement: 現状に飽き足らず, 国内に飽き足らず."], "彼は現状に飽き足らず、新しい挑戦を始めた。", "Not content with the status quo, he began a new challenge.", "jld"], ["g.beku-shite", "N1", "dict", "べくして", "べくして", "inevitably / as one would expect / destined to", "Verb dict-form + べくして", "〜べくして is a literary construction expressing that something happened inevitably or as fate would have it — 'destined to X'. Often with the same verb repeated: 起こるべくして起こった ('happened as it was bound to happen'). Very literary register.", ["Literary inevitability — 'as fate would have it'.", "Often with same verb repeated: 起こるべくして起こる, 勝つべくして勝つ."], "この事件は起こるべくして起こった。", "This incident happened as it was destined to happen.", "jld"], ["g.nomi-only", "N1", "dict", "のみ", "のみ", "only / just (literary)", "Noun / V plain + のみ", "〜のみ is a literary / formal particle meaning 'only' — the formal equivalent of だけ. Very common in formal writing, legal documents, and official announcements. Can attach directly to nouns or plain-form predicates.", ["Literary 'only' — formal equivalent of だけ.", "Common in legal and official contexts."], "会員のみ入場できます。", "Only members may enter.", "jld"], ["g.ni-wa-oyoba-nai", "N1", "dict", "には及ばない", "にはおよばない", "no need to / not necessary to / not up to", "V dict / noun + には及ばない", "〜には及ばない has two senses: (1) 'no need to X' — often in polite dismissal (心配には及びません 'there's no need to worry'); (2) 'does not measure up to / cannot match' — comparing abilities or qualities. Formal / polite register.", ["Two senses — 'no need to' (dismissive) and 'cannot match' (comparative).", "Common fixed phrase: 心配には及びません ('no need to worry')."], "ご心配には及びません。", "There's no need for concern.", "jld"], ["g.tara-kiri-ga-nai", "N1", "ta", "らきりがない", "らきりがない", "there's no end to / (if you list X) it would be endless", "V-たら + きりがない", "〜たらきりがない expresses that there is no end / no limit to X if one were to continue — 'there's no end to listing / doing X'. Often used when the speaker wants to stop listing or discussing because the list would be endless. Conversational register.", ["Endless list / action — 'could go on forever'.", "Common fixed phrase: 〜を挙げたらきりがない ('the list would be endless')."], "欠点を挙げたらきりがない。", "If you list the flaws, there's no end.", "jld"], ["g.to-sareru", "N1", "dict", "とされる", "とされる", "is considered / is said to be", "Plain form + とされる / とされている", "〜とされる is a formal passive expression meaning 'is considered / regarded as'. Common in academic writing, news, and official statements — it presents X as a widely-held view without specifying who holds it. The progressive とされている emphasizes ongoing / current consensus.", ["Passive / impersonal 'is regarded as'.", "Common in academic and formal writing."], "彼は天才とされている。", "He is considered a genius.", "jld"], ["g.to-oboshii", "N1", "dict", "とおぼしい", "とおぼしい", "seems to be / presumed to be", "Plain form + とおぼしい / とおぼしき", "〜とおぼしい is a literary / archaic evidential meaning 'seems to be' or 'presumed to be'. The attributive form とおぼしき + noun is common in narrative descriptions where the speaker is guessing identity or nature. Very literary register, rare in casual speech.", ["Literary evidential — 'seems / presumed'.", "The attributive form とおぼしき is most common."], "犯人とおぼしき男が現場から逃げた。", "A man presumed to be the culprit fled the scene.", "jld"], ["g.nagara-mo", "N1", "i", "ながらも", "ながらも", "although / even while / despite", "V ます-stem / i-adj / noun + ながらも", "〜ながらも is a literary concessive meaning 'although / even while X, Y'. Similar to 〜ながら (simultaneous) but with concessive nuance — the main clause is unexpected or contrasting. Formal / literary register.", ["Concessive — 'although X, Y'.", "Distinct from 〜ながら (neutral simultaneity)."], "小さいながらも、立派な家だ。", "Small though it is, it's a splendid house.", "jld"], ["g.to-nareba-if-comes-to", "N1", "dict", "となれば", "となれば", "if it comes to / in the event that", "Plain form + となれば", "〜となれば presents a hypothetical scenario and the consequence that would follow — 'if it comes to X, (then) Y'. More hypothetical / formal than 〜たら or 〜なら. Common in planning, discussing contingencies, or setting up a hypothetical that leads to a necessary action.", ["Formal hypothetical — 'if the situation reaches X'.", "Main clause typically describes an obligatory or natural consequence."], "留学するとなれば、準備が必要だ。", "If it comes to studying abroad, preparation is necessary.", "jld"], ["g.to-naru-to-when-comes", "N1", "dict", "となると", "となると", "when it comes to / if it's a matter of", "Plain form + となると", "〜となると introduces a topic or scenario and its expected consequence — 'when it comes to X, (the situation changes)'. Often used when the speaker realizes the implications of a stated scenario. Close in meaning to 〜となれば but slightly more conversational and often signals a shift in the speaker's perspective.", ["Perspective-shifting — 'now that we're talking about X...'.", "Close to 〜となれば but slightly less formal / more conversational."], "留学となると、お金が心配だ。", "When it comes to studying abroad, I worry about money.", "jld"], ["g.gotoku-as-if", "N1", "dict", "がごとく", "がごとく", "just as / like / as if (literary)", "Plain form / noun + の + ごとく", "〜ごとく is a literary / classical construction meaning 'just as' or 'like' — used for similes and comparisons in formal and literary writing. Derived from the classical adjective ごとし. Very formal, common in literature, essays, and formal speeches. Attributive form ごとき + noun is also productive.", ["Literary / classical simile marker — 'just as'.", "Very formal / written register."], "矢のごとく、時間が過ぎていく。", "Time passes just like an arrow.", "jld"], ["g.ni-taru", "N1", "dict", "に足る", "にたる", "worth / sufficient to / deserving of", "Verb dict-form / noun + に足る", "〜に足る expresses that something is worth doing or merits X — 'worth / sufficient to / deserving of'. More literary than 〜に値する ('worthy of', also N2). Often used in formal evaluations: '信頼に足る' ('worthy of trust'). The attributive 〜に足る + noun is the most common usage.", ["Formal / literary 'worthy of'.", "Common fixed phrases: 信頼に足る ('worthy of trust'), 尊敬に足る ('worthy of respect')."], "彼は信頼に足る人物だ。", "He is a person worthy of trust.", "jld"], ["g.ni-taeru", "N1", "dict", "に堪える", "にたえる", "can bear / is worth (X-ing)", "Verb dict / noun + に堪える", "〜に堪える expresses that something is tolerable or worth X — 'can bear X / is worth X'. Often used with verbs of evaluation, viewing, or listening: 見るに堪える ('worth watching / bearable to watch'). The negated form 〜に堪えない (see separate entry) is more common and means 'unbearable'.", ["Tolerance / worth — 'is worth bearing'.", "More common in negated form 〜に堪えない (see separate entry)."], "この作品は鑑賞に堪える。", "This work is worth appreciating.", "jld"], ["g.ni-taenai", "N1", "dict", "に堪えない", "にたえない", "unbearable / can't bear to / not worth", "Verb dict / noun + に堪えない", "〜に堪えない is the negation of 〜に堪える — 'unbearable to X' or 'not worth X-ing'. Common with evaluation verbs: 見るに堪えない ('unbearable to watch'), 聞くに堪えない ('unbearable to listen to'). Also used for emotional states: 感慨に堪えない ('overcome with emotion').", ["Negated form of 〜に堪える — unbearability or 'not worth'.", "Common with evaluation: 見るに堪えない, 聞くに堪えない."], "その映画はひどすぎて、見るに堪えなかった。", "The movie was so bad it was unbearable to watch.", "jld"], ["g.to-iedomo", "N1", "dict", "といえども", "といえども", "although / even though (literary)", "Plain form + といえども", "〜といえども is a formal / literary concessive meaning 'even though X' or 'although X'. Often used when the speaker acknowledges that X is the case but presents a contrasting main clause. More formal than 〜とはいえ. Common in speeches, essays, and literary writing.", ["Very formal / literary concessive — rare in casual speech.", "More formal than 〜とはいえ or 〜にしても."], "子供といえども、約束は守るべきだ。", "Even a child should keep a promise.", "jld"], ["g.to-omoi-kiya", "N1", "dict", "と思いきや", "とおもいきや", "but contrary to expectation / I thought but", "Plain form + と思いきや", "〜と思いきや expresses that the speaker's expectation was contradicted by reality — 'I thought X, but (the reality was Y)'. Literary register. Often used in narratives for surprising reversals of expectation.", ["Surprise reversal — expectation contradicted by reality.", "Literary / narrative register."], "簡単と思いきや、意外に難しかった。", "I thought it would be easy, but it was surprisingly hard.", "jld"], ["g.ga-hayai-ka", "N1", "dict", "が早いか", "がはやいか", "as soon as / the moment that (literary)", "V dict-form + が早いか", "〜が早いか is a literary construction expressing that two events happen in near-immediate succession — 'as soon as / the moment X happens, Y'. Very similar in function to 〜や否や and 〜なり (literary 'as soon as'). Formal / literary register, rare in casual speech.", ["Literary 'as soon as' — similar to や否や, なり, か〜ないかのうちに.", "Very formal / literary register — common in narratives and dramatic prose."], "ベルが鳴るが早いか、生徒たちは走り出した。", "The moment the bell rang, the students ran out.", "jld"], ["g.te-shikarubeki", "N1", "te", "しかるべき", "しかるべき", "should be (fittingly) / ought to be", "V-て form + しかるべき", "〜てしかるべき expresses that an action or state 'should be' or 'is fitting' — 'ought to be done' with a sense of fairness or propriety. Very formal / literary register, common in formal criticism and arguments about what should be done. The verb しかる is literary for 'to be fitting'.", ["Formal / literary 'ought to be'.", "Implies fairness or propriety — what 'ought' fittingly to happen."], "彼には謝罪があってしかるべきだ。", "There ought to be an apology from him.", "jld"], ["g.ni-sakidatte-prior", "N2", "dict", "に先立って", "にさきだって", "prior to / in advance of", "V plain / noun + に先立って / に先立ち", "〜に先立って marks an action taken BEFORE an important upcoming event — 'prior to X, Y'. It is formal and usually appears in business and official contexts where preparation is explicit. The Y clause is the preparatory action; the X clause is the anticipated main event.", ["Formal / business register — for preparatory actions before an important event.", "にさきだち is a slightly more literary variant."], "会議に先立って、資料を配布した。", "Prior to the meeting, I distributed the materials.", "jld"], ["g.wo-kikkake-ni", "N2", "dict", "をきっかけに(して)", "をきっかけに(して)", "triggered by / with X as the impetus", "Noun / V plain + をきっかけに(して)", "〜をきっかけに introduces a triggering event that led to a significant change or new action — 'triggered by X, Y began / happened'. Often used for life-changing moments: a trip, a book, a meeting that sparked a new direction. Less formal than 〜を契機に.", ["Emphasizes the triggering moment — often something small or incidental that led to something big.", "Less formal than 〜を契機に (which is more literary)."], "日本旅行をきっかけに、日本語を勉強し始めた。", "A trip to Japan triggered my starting to study Japanese.", "jld"], ["g.yue-ni-because", "N2", "dict", "(が)ゆえに", "(が)ゆえに", "because / therefore (literary)", "Plain form + (が)ゆえに / 故に", "〜ゆえに is a literary / archaic causal marker meaning 'because X, therefore Y'. It is used in essays, formal writing, legal / philosophical texts, and classical styles. Modern speech rarely uses it, preferring から or ので. The standalone sentence-initial ゆえに can mean 'therefore'.", ["Literary / archaic register — rarely used in modern speech.", "Common in legal, philosophical, and academic writing."], "我思う、ゆえに我あり。", "I think, therefore I am.", "jld"], ["g.koto-kara-from-fact", "N2", "dict", "ことから", "ことから", "from the fact that / based on the fact", "Plain form + ことから", "〜ことから presents a fact or evidence as the basis for a conclusion, explanation, or designation — 'from the fact that X, (Y follows)'. Often used to explain the origin of a name, reputation, or conclusion drawn from observed evidence. Formal / written register.", ["Evidence-based conclusion — X is the factual basis for Y.", "Common in etymological / naming explanations: 桜の木が多いことから、この場所は'桜町'と呼ばれている."], "桜の木が多いことから、この町は「桜町」と呼ばれている。", "Because it has so many cherry trees, this town is called “Sakura Town”.", "jld"], ["g.amari-too-much", "N2", "dict", "あまり", "あまり", "out of excess / from too much", "V plain / i-adj / na-adj な / noun の + あまり", "〜あまり expresses an excessive degree of emotion, sensation, or state that led to the main-clause consequence — 'out of too much X, Y happened'. Often with emotional nouns (驚き, 嬉しさ, 悲しみ) or strong verbs. Formal / written register. The main clause is typically an intense or unusual reaction.", ["Expresses an excess of emotion / sensation leading to an unusual result.", "Common with nominalized emotions: 驚きのあまり, 嬉しさのあまり, 悲しみのあまり."], "驚きのあまり、言葉を失った。", "Out of sheer surprise, I was lost for words.", "jld"], ["g.kara-koso-precisely-because", "N2", "dict", "からこそ", "からこそ", "precisely because / it is exactly because", "Plain form + からこそ", "〜からこそ emphasizes that the X clause is the essential and exclusive reason for Y — 'precisely because X, Y (and no other reason)'. More common than 〜ばこそ in modern speech, and slightly less literary. Often used in heartfelt reasoning, explanations, and endorsements.", ["Common variant of 〜ばこそ — より neutral register.", "Emphasizes that X is the essential reason, ruling out other potential causes."], "大切な友達だからこそ、厳しいことも言う。", "It's precisely because you're a dear friend that I say harsh things too.", "jld"], ["g.ni-tomonatte-accompany", "N2", "dict", "に伴って", "にともなって", "accompanying / along with / as X progresses", "Noun / V plain + に伴って / に伴い", "〜に伴って expresses that one change or event accompanies another — 'along with X, Y also (happens / changes)'. Similar to 〜につれて and 〜にしたがって, but slightly more formal and with a stronger 'accompaniment' feel. Common in descriptions of social, economic, and environmental changes.", ["Formal register — common in news, reports, and academic writing.", "に伴い is the slightly more literary variant."], "少子化に伴って、学校が減っている。", "Along with the declining birthrate, the number of schools is decreasing.", "jld"], ["g.ni-mo-kakawarazu-despite", "N2", "dict", "にもかかわらず", "にもかかわらず", "despite / in spite of / even though", "Plain form + にもかかわらず", "〜にもかかわらず is a formal concessive marker meaning 'despite X, Y'. More formal than のに or が, with no emotional connotation — purely contrastive. Common in written Japanese, news, and formal speech. The main clause presents an unexpected or counter-intuitive continuation.", ["Formal concessive — neutral tone, no emotional weight.", "More formal than のに (which can carry frustration) and が (neutral but less emphatic)."], "悪天候にもかかわらず、試合は行われた。", "Despite the bad weather, the match was held.", "jld"], ["g.te-wa-irarenai", "N2", "te", "(は)いられない", "(は)いられない", "can't afford to be (doing X) / can't stay (in state X)", "V-て form + (は)いられない", "〜てはいられない expresses that the speaker cannot afford to remain in a state or continue doing an action due to urgency or pressing concerns — 'I can't afford to be sitting around'. Often used when the speaker feels compelled to act because of an unfolding situation.", ["Urgency / pressing concern — the speaker can't stay inactive.", "Casual contraction: 〜ちゃいられない (食べてはいられない → 食べちゃいられない)."], "こうしてはいられない。早く行こう。", "I can't just stay like this. Let's hurry.", "jld"], ["g.ni-shiro-ni-seyo", "N2", "dict", "にしろ", "にしろ", "even if / whether or not (formal)", "Plain form + にしろ / にせよ", "〜にしろ / 〜にせよ are formal literary variants of 〜にしても ('even if'). They can appear singly as a concessive, or in paired form (X にしろ Y にしろ — 'whether X or Y, either way'). More formal than 〜にしても and 〜ても. Common in formal / written Japanese.", ["Formal / literary variants of にしても.", "Paired use (X にしろ Y にしろ) expresses 'whether X or Y, the point is...'."], "行くにしろ行かないにしろ、早く決めてください。", "Whether you go or not, please decide quickly.", "jld"], ["g.toshite-mo-even-as", "N2", "dict", "としても", "としても", "even if / even assuming / even as", "Plain form + としても", "〜としても is a concessive marker meaning 'even if X', 'even assuming X'. It hypothetically accepts X and then states something that would hold regardless. More formal than 〜ても, with a slightly more analytical / considered feel. Can also mean 'even as (in the capacity of X)' when the preceding is a noun.", ["Hypothetical concession — 'even if we accept that X, Y'.", "Noun sense: 教師としても、親としても ('even as a teacher / even as a parent')."], "失敗したとしても、経験にはなる。", "Even if I fail, it will become experience.", "jld"], ["g.you-to-regardless", "N2", "vol", "と", "と", "regardless of / no matter (what / who / how)", "Verb volitional + と / ようと", "Verb volitional + と / ようと is a concessive construction — 'no matter what X', 'regardless of X'. Often paired with interrogatives (誰, 何, どこ) to express 'no matter who / what / where'. Formal / literary register. The paired form 〜うと〜まいと (see separate entry) covers 'whether or not'.", ["Formal / literary concessive.", "Common with interrogatives: 誰が何と言おうと ('no matter what anyone says')."], "誰が何と言おうと、私は諦めない。", "No matter what anyone says, I won't give up.", "jld"], ["g.nuku-fully-do", "N2", "i", "抜く", "ぬく", "do X to the very end / thoroughly", "Verb ます-stem + 抜く", "〜抜く is an auxiliary meaning 'do X through to completion / to the very end'. Implies determination and often hardship — the action is completed despite difficulty. Common with endurance verbs: 走り抜く ('run through to the end'), 考え抜く ('think through thoroughly'), 生き抜く ('live through / survive').", ["Emphasizes completion despite difficulty or hardship.", "Common with endurance / effort verbs: 走り抜く, 考え抜く, 生き抜く, 守り抜く."], "最後まで走り抜いた。", "I ran through to the very end.", "jld"], ["g.dzurai-hard-emotional", "N2", "i", "づらい", "づらい", "hard to do (emotionally / uncomfortably)", "Verb ます-stem + づらい", "〜づらい is a suffix meaning 'hard / uncomfortable to do X', with a focus on emotional or psychological difficulty rather than physical difficulty. Distinct from 〜にくい (physical difficulty) and 〜がたい (formal, often moral difficulty). Common for actions that cause discomfort, awkwardness, or emotional resistance.", ["Emotional / psychological difficulty — 'awkward to do'.", "Contrast with 〜にくい (physical difficulty) and 〜がたい (formal / moral)."], "それは少し言いづらい話だ。", "That's a bit of an awkward topic to bring up.", "jld"], ["g.gatai-difficult", "N2", "i", "がたい", "がたい", "hard / difficult to (formal)", "Verb ます-stem + がたい", "〜がたい is a formal / literary suffix meaning 'hard to X' or 'difficult to X', often with a moral or intellectual nuance — things that are hard to accept, believe, or forgive. Distinct from 〜にくい (physical / practical difficulty) and 〜づらい (emotional discomfort). Functions as an i-adjective.", ["Formal / literary — moral or intellectual difficulty.", "Common fixed forms: 信じがたい ('hard to believe'), 想像しがたい ('hard to imagine'), 許しがたい ('hard to forgive')."], "それは信じがたい話だ。", "That's a hard-to-believe story.", "jld"], ["g.dake-no-koto-wa-aru", "N2", "dict", "だけのことはある", "だけのことはある", "(it's) as expected from / lives up to", "Plain form + だけのことはある", "〜だけのことはある expresses that the main-clause praise or quality is fitting given a stated premise — 'being X, it's no surprise that Y' / 'Y lives up to the expectations of X'. Positive evaluative, very similar to 〜だけあって (N3) but in a slightly more emphatic, reflective tone.", ["Positive evaluative — praise that 'fits' the premise.", "Very close in meaning to 〜だけあって (N3); this form is more reflective / conclusive."], "長年練習しただけのことはある。演奏が素晴らしい。", "The years of practice have paid off. The performance is wonderful.", "jld"], ["g.to-iu-mono-da", "N2", "dict", "というものだ", "というものだ", "that's what X is / that's (the nature of) X", "Plain form + というものだ", "〜というものだ expresses a speaker's evaluative conclusion or universal statement about what something is or should be — 'that's what X is' / 'that's the way of things'. Often carries a moralizing or reflective tone, stating a general truth or principle. Distinct from 〜ものだ (general tendency / nostalgic 'used to') — というものだ is more evaluative.", ["Evaluative / normative — 'that's the nature of it'.", "Often preceded by a definition or statement the speaker is reframing."], "困っている人を助けるのが友情というものだ。", "Helping people who are in trouble — that's what friendship is.", "jld"], ["g.to-iu-mono-dewa-nai", "N2", "dict", "というものではない", "というものではない", "it's not simply (a matter of) / it's not that", "Plain form + というものではない", "〜というものではない negates a simplistic claim, arguing that the situation is more nuanced than the stated X — 'it's not simply that X' / 'it doesn't just come down to X'. Common in discussions where the speaker is correcting an oversimplification.", ["Corrects an oversimplification — insists on nuance.", "Common in arguments and essays that resist easy conclusions."], "お金があれば幸せになれるというものではない。", "It's not simply that having money makes you happy.", "jld"], ["g.mono-dakara", "N2", "dict", "ものだから", "ものだから", "because / it's because (excusing / justifying)", "Plain form + ものだから / もので", "〜ものだから gives a reason with an excuse-making or justifying flavor — 'it's because X (so please understand)'. Often used when the speaker is explaining why they did something unexpected or failed to meet an expectation. The shorter form 〜もので is slightly softer. Distinct from 〜んだから (more emphatic) and 〜から (neutral).", ["Excuse-making — often used to explain tardiness or failures.", "The short form 〜もので is softer / more polite."], "急いでいたものだから、挨拶もせずに帰ってしまった。", "Because I was in a hurry, I left without even saying goodbye.", "jld"], ["g.yara-yara", "N2", "dict", "やら", "やら", "things like X and Y (disordered / overwhelming)", "Noun + やら + noun + やら", "〜やら〜やら is a non-exhaustive list construction similar to 〜とか〜とか, but with a flavor of disarray, overwhelm, or mess. Often used when describing a situation as chaotic or a mix of unpleasant items — 'what with X and Y'. Can also combine adjectives or verb plain forms. Formal / literary register compared to とか.", ["Disordered / overwhelmed list — often describing a messy situation.", "More formal / literary than とか."], "宿題やら掃除やらで忙しい。", "I'm busy with homework and cleaning and whatnot.", "jld"], ["g.kara-ni-wa", "N2", "dict", "からには", "からには", "now that / since (with strong obligation)", "Plain form + からには", "〜からには expresses a strong commitment based on a premise — 'now that X, one must Y'. The main clause typically expresses obligation, determination, or strong consequence arising from the X premise. Similar in function to 〜以上は but with slightly more emotional weight. Formal register.", ["Strong obligation from a premise — 'since this is the case, you must'.", "Similar to 〜以上(は) but emotionally stronger."], "約束したからには、必ず守ります。", "Now that I've promised, I will definitely keep it.", "jld"], ["g.no-minarazu", "N2", "dict", "のみならず", "のみならず", "not only X but also Y (literary)", "Plain form + のみならず", "〜のみならず is a literary 'not only' construction — the most formal variant of the 'not only' family (〜だけでなく, 〜ばかりでなく, 〜のみならず). Common in essays, formal speeches, and written Japanese. Often paired with も in the main clause.", ["Most formal / literary of the 'not only' family.", "Rare in casual speech — common in essays, news, and formal writing."], "彼は頭がいいのみならず、性格もいい。", "Not only is he smart, but he also has a good personality.", "jld"], ["g.to-wa-ie", "N2", "dict", "とはいえ", "とはいえ", "although / that said / even so", "Plain form + とはいえ", "〜とはいえ is a formal concessive meaning 'although X' or 'that said, X'. It hedges a statement by noting that while X is true, the main clause presents a contrasting or tempering observation. Literary / formal register, common in essays and written Japanese.", ["Literary / formal concessive — 'that said'.", "Common in essays, news, and balanced discussions."], "もう春とはいえ、まだ寒い。", "Although it's already spring, it's still cold.", "jld"], ["g.to-wa-iu-mono-no", "N2", "dict", "とはいうものの", "とはいうものの", "that said / although one says", "Plain form + とはいうものの", "〜とはいうものの is a literary concessive similar to 〜とはいえ — 'although one says X, (the reality is Y)'. Often used to qualify a general statement by pointing out exceptions or nuances. More drawn-out and reflective than 〜とはいえ. Common in written Japanese.", ["Reflective / nuance-adding concessive.", "More drawn-out than とはいえ — emphasizes the speaker's consideration."], "春だとはいうものの、今朝は雪が降った。", "Although we say it's spring, snow fell this morning.", "jld"], ["g.kara-to-itte", "N2", "dict", "からといって", "からといって", "just because / even though (one says)", "Plain form + からといって", "〜からといって rejects a simplistic causal inference — 'just because X (doesn't mean Y)'. The main clause often uses a negative or 'not necessarily' predicate to refute the naive inference. Very common in careful reasoning and avoiding overgeneralization.", ["Rejects a simple 'X therefore Y' inference — 'just because X, doesn't mean Y'.", "Main clause usually hedged: とは限らない, わけではない."], "お金があるからといって、幸せとは限らない。", "Just because you have money doesn't necessarily mean you're happy.", "jld"], ["g.tsutsu-aru", "N2", "i", "つつある", "つつある", "in the process of / gradually becoming", "Verb ます-stem + つつある", "〜つつある expresses that an action or change is currently in progress or gradually happening — 'is in the process of X'. Often used for large-scale, long-term, or gradual changes (social, environmental, personal). More formal than 〜ている (which is the everyday progressive). Common in reports and formal descriptions of trends.", ["Formal progressive — for gradual or ongoing change.", "Common with change verbs: 変わる, 増える, 減る, 発展する, 進む."], "地球温暖化が進みつつある。", "Global warming is progressing.", "jld"], ["g.dake-mashi-da", "N2", "dict", "だけましだ", "だけましだ", "at least X (is better than nothing) / could be worse", "Plain form + だけましだ", "〜だけましだ expresses a minor consolation — 'at least X is the case, and that's better than worse alternatives'. Used when finding a silver lining in a negative situation: it's not great, but at least it's not as bad as it could be. The main clause often implicitly or explicitly compares to a worse hypothetical.", ["Minor consolation — silver lining in a negative situation.", "Often with implicit comparison to something worse."], "雨だけど、雪じゃないだけましだ。", "It's raining, but at least it's not snowing.", "jld"], ["g.sobakara", "N2", "ta", "そばから", "そばから", "as soon as / immediately after (with repeated undoing)", "Verb plain / V-た form + そばから", "〜そばから expresses 'no sooner had X happened than Y undid it' — a repetitive cycle where an action is immediately negated or reversed by another. Common for frustrating situations of never-ending effort: 'as soon as I clean it, it gets dirty again'. Often carries a tone of exasperation.", ["Repetitive / futile effort — the main clause undoes the X action.", "Common in frustration / exasperation: 教えたそばから忘れる ('as soon as I teach him, he forgets')."], "教えたそばから忘れてしまう。", "He forgets as soon as I teach him.", "jld"], ["g.ja-arumai-shi", "N2", "dict", "じゃあるまいし", "じゃあるまいし", "it's not as if / since it's not like", "Noun / plain form + じゃあるまいし", "〜じゃあるまいし expresses 'it's not as if X, so (you should act accordingly)' — a construction that rejects a childish or unreasonable premise. Often used to correct or scold: 'you're not a child, so...' The more formal written form is 〜ではあるまいし.", ["Rejects an unreasonable premise — often used to correct or scold.", "Common fixed type: 子供じゃあるまいし ('you're not a child, are you?')."], "子供じゃあるまいし、そんなことで泣かないで。", "You're not a child — don't cry over that.", "jld"], ["g.to-bakari-ni", "N2", "dict", "とばかりに", "とばかりに", "as if to say / seemingly saying", "Plain form / phrase + とばかりに", "〜とばかりに expresses that someone's action or behavior seems to convey a specific message, without them actually saying it — 'as if to say X'. Common in describing body language, facial expressions, or strong non-verbal signals. Formal / literary register.", ["Describes non-verbal communication — actions that convey a message.", "Often with strong gestures or looks: 怒ったとばかりに, 嬉しいとばかりに."], "彼は「もう限界だ」とばかりに、ため息をついた。", "He sighed as if to say 'I've had enough'.", "jld"], ["g.to-areba", "N2", "dict", "とあれば", "とあれば", "if it's (a case of) / if it's for", "Noun / plain form + とあれば", "〜とあれば expresses a hypothetical or conditional framing — 'if it is the case of X' / 'if it's for X'. Often carries a sense of willingness to act for a specific cause: 'if it's for my family, I'd do anything'. Formal / literary register, common in formal declarations of commitment.", ["Formal / literary hypothetical.", "Often paired with a willing commitment: あなたのためとあれば、何でもする ('if it's for you, I'd do anything')."], "あなたのためとあれば、何でもする。", "If it's for you, I'll do anything.", "jld"], ["g.sou-ni-nai", "N2", "i", "そうにない", "そうにない", "doesn't look like / there's no sign of", "Verb ます-stem + そうにない / そうもない", "〜そうにない / 〜そうもない is the negative of the appearance-based そうだ — 'doesn't look like X will happen'. Common with future predictions: the speaker sees no evidence that X will occur. More emphatic than ないだろう. Distinct from the hearsay negative construction.", ["Appearance-based negation — no sign of X happening.", "そうもない is slightly more emphatic than そうにない."], "雨が降りそうにない。", "It doesn't look like it's going to rain.", "jld"], ["g.zu-jimai", "N2", "a", "ずじまい", "ずじまい", "ended up not (doing) / didn't manage to", "V negative stem + ずじまい", "〜ずじまい expresses regret that an intended action was not carried out — 'ended up not X-ing'. Common in retrospectives: 'I meant to do X, but in the end didn't'. Carries a note of disappointment or missed opportunity. Literary / formal register.", ["Retrospective regret — 'didn't end up X-ing, though I meant to'.", "Irregular: する → せずじまい (not しずじまい)."], "忙しくて、彼に会えずじまいだった。", "I was so busy I didn't manage to see him.", "jld"], ["g.hanmen-on-other-hand", "N2", "dict", "反面", "はんめん", "on the other hand / while (one side)", "Plain form + 反面", "〜反面 presents two contrasting aspects of the same subject — 'on the one hand X, on the other Y'. Functionally similar to 〜一方で (N3) but with a stronger 'two sides of a coin' feel. Formal / neutral register, common in balanced descriptions of pros and cons.", ["'Two sides of the same thing' — often used for pros/cons or complementary aspects.", "Similar to 〜一方で — choice is stylistic."], "この仕事は給料がいい反面、責任が重い。", "This job has good pay, but on the other hand, heavy responsibility.", "jld"], ["g.to-iu-koto-da", "N2", "dict", "ということだ", "ということだ", "I hear that / it means that", "Plain form + ということだ", "〜ということだ has two related senses: (1) hearsay / report — 'I hear that X' / 'they say X'; (2) meaning / conclusion — 'it means X'. Context disambiguates. Common in news reports and in drawing conclusions from preceding statements. Formal register.", ["Hearsay sense: 'I hear / it is said that'. Common in news.", "Meaning sense: 'in other words' — summarizing a preceding explanation."], "ニュースによると、明日は雨が降るということだ。", "According to the news, it's going to rain tomorrow.", "jld"], ["g.kekka-result", "N2", "ta", "結果", "けっか", "as a result of / after", "V-た form / noun + の + 結果", "〜結果 (けっか) introduces the result or outcome of a process — 'as a result of X, Y'. Formal / written register, common in reports, essays, and formal narratives. The attributive form 結果の + noun is also productive.", ["Formal / written — typical of reports, news, and academic writing.", "Common with process verbs: 調査した結果, 議論の結果, 話し合いの結果."], "調査した結果、新しい事実が分かった。", "As a result of our investigation, new facts came to light.", "jld"], ["g.sai-ni", "N2", "dict", "際(に)", "さい(に)", "on the occasion of / at the time of (formal)", "V plain / noun + の + 際(に)", "〜際(に) marks a significant occasion or moment when something is done — 'on the occasion of X, Y'. More formal than 〜とき and less ceremonial than 〜にあたって. Common in formal announcements, instructions, and business communications: 'in case of emergency, call this number'.", ["Formal temporal marker — for significant moments or occasions.", "More formal than 〜とき; less ceremonial than 〜にあたって."], "非常の際は、このボタンを押してください。", "In case of emergency, press this button.", "jld"], ["g.doori-just-as", "N2", "dict", "とおり", "とおり", "just as / according to / exactly like", "Noun + 通り / どおり", "〜通り / 〜どおり expresses that an action or outcome is exactly as X was described, predicted, or specified — 'just as X', 'according to X'. The reading shifts between とおり and どおり depending on the preceding word: どおり after nouns (予定どおり), とおり after verb plain forms (言ったとおり).", ["Reading depends on the base: noun + どおり (voiced), verb + とおり (unvoiced).", "Common: 予定どおり, 指示どおり, 思ったとおり, 言ったとおり."], "予定どおりに出発した。", "We departed just as planned.", "jld"], ["g.to-atte", "N2", "dict", "とあって", "とあって", "because it's / given that it's (special situation)", "Plain form + とあって", "〜とあって expresses that the main-clause phenomenon is occurring because of a special circumstance X — 'because it's X (a notable situation), the result is Y'. The X clause is typically a notable or unusual situation, and the main clause describes a resulting atmosphere or behavior. Formal / written register.", ["Causal — the X situation is unusual / notable and explains the main clause.", "Main clause often describes crowds, atmosphere, or unusual behavior."], "休日とあって、公園は大勢の人で賑わった。", "Being a holiday, the park was crowded with many people.", "jld"], ["g.to-mieru", "N2", "dict", "とみえる", "とみえる", "it seems that / appears to", "Plain form + とみえる", "〜とみえる expresses that something appears to be the case based on observable evidence — 'it seems that X'. Similar to 〜ようだ but with a more observational / neutral feel. Formal / literary register. The と is the quotation/thought particle.", ["Observational inference — based on evidence the speaker can see.", "Close in meaning to 〜ようだ, 〜らしい, 〜みたい — as another evidential."], "彼は忙しいとみえる。", "It seems he is busy.", "jld"], ["g.to-sureba", "N2", "dict", "とすれば", "とすれば", "supposing / assuming / if it's the case that", "Plain form + とす

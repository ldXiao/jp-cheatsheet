れば / とすると / としたら", "〜とすれば (with variants 〜とすると, 〜としたら) expresses a hypothetical assumption — 'supposing that X, then Y'. The speaker accepts X as a premise for the sake of argument and draws a consequence. Formal / neutral register, common in analytical discussions and planning.", ["Hypothetical assumption — 'assuming X, then Y'.", "Three variants: とすれば (slightly more formal), とすると (neutral), としたら (slightly more conversational)."], "もし雨が降るとすれば、どうしますか。", "Supposing it rains, what will you do?", "jld"], ["g.ni-suginai", "N2", "dict", "にすぎない", "にすぎない", "is nothing more than / merely", "Noun / plain form + にすぎない", "〜にすぎない expresses that something is 'nothing more than X' — a dismissive or minimizing description. Common for downplaying the significance of something: 'it's just an excuse', 'it's merely a rumor'. The verb すぎる means 'exceed / go beyond'; the negative form 'not exceed' means 'is no more than'.", ["Dismissive / minimizing — 'nothing more than X'.", "Common with 言い訳 ('excuse'), 噂 ('rumor'), 推測 ('guess'), 一例 ('one example')."], "それは単なる言い訳にすぎない。", "That's nothing more than a mere excuse.", "jld"], ["g.koto-tote", "N2", "dict", "こととて", "こととて", "since / because (formal, explanatory)", "Plain form / noun + の + こととて", "〜こととて is a formal / literary reason marker — 'since X is the case, Y (please excuse)'. Often used in apologies or explanations to acknowledge that circumstances caused an imperfection: 'since I'm new, please forgive any mistakes'. Very formal, rarely used in casual speech.", ["Formal / literary causal — apologetic register.", "Very common in polite apologies: 初めてのこととて, 急なこととて."], "初めてのこととて、不手際をお許しください。", "Since it's my first time, please forgive any mishandling.", "jld"], ["g.hodo-no-mono-dewa-nai", "N2", "dict", "ほどのことではない", "ほどのことではない", "not worth that much / not such a big deal", "Plain form + ほどのことではない / ほどのものではない", "〜ほどのことではない dismisses a situation or action as not deserving a strong reaction — 'it's not that big a deal', 'not worth getting upset about'. Often used to calm down someone who is overreacting, or to express humility about one's own achievements. Neutral / formal register.", ["Dismissive / minimizing — downplays significance.", "Often used in reassurance: 心配するほどのことではない ('nothing to worry about')."], "心配するほどのことではないよ。", "It's not worth worrying about.", "jld"], ["g.zutomo-even-without", "N2", "a", "ずとも", "ずとも", "even without / even if not", "V negative stem + ずとも", "〜ずとも is a formal / literary concessive meaning 'even without doing X' or 'even if not X'. Combines the formal negative ず with the concessive とも. Less common than the equivalent 〜なくても but appears in literature, formal speeches, and fixed expressions. Irregular: する → せずとも.", ["Formal / literary equivalent of 〜なくても.", "Irregular: する → せずとも."], "言わずとも分かるだろう。", "You should understand without me saying it.", "jld"], ["g.dano-dano", "N2", "dict", "だの", "だの", "things like X and Y (complaining / disparaging listing)", "X だの Y だの", "〜だの〜だの is a non-exhaustive listing construction with a complaining or disparaging nuance — 'what with X and Y (and all that nonsense)'. Often used when the speaker is frustrated or dismissive about the listed items. Conversational register.", ["Complaining / dismissive listing — the speaker is frustrated or exasperated.", "Can list nouns, verbs, or adjectives."], "忙しいだの疲れただの、言い訳ばかりだ。", "'Busy' this, 'tired' that — nothing but excuses.", "jld"], ["g.to-miru-see-as", "N2", "dict", "とみる", "とみる", "see as / regard as / judge to be", "Plain form + とみる", "〜とみる expresses that the speaker considers or judges X to be the case — 'I see it as X' / 'I regard it as X'. Formal / analytical register, common in news reports, police statements, and analytical commentary. The verb is 見る used metaphorically as 'judge / consider'.", ["Analytical judgment — 'I regard / consider X to be the case'.", "Common in news: 警察は犯人は2人組とみている ('police believe the criminals are a pair')."], "警察は事故の原因を不注意とみている。", "The police see the cause of the accident as negligence.", "jld"], ["g.you-de-seemingly", "N2", "dict", "ようで", "ようで", "seemingly X, but actually / looks X but", "Plain form + ようで / ようでいて", "〜ようで expresses apparent contradiction — 'seemingly X, but actually Y'. The surface appearance X contrasts with the deeper reality Y. Often used for surprising insights or revelations: 'he seems quiet, but he's actually funny'. Formal / literary register.", ["Apparent contradiction — surface vs. reality.", "Common in character descriptions and surprising revelations."], "分かっているようで、実は分かっていない。", "It seems as if he understands, but he actually doesn't.", "jld"], ["g.to-itte-without-particular", "N2", "dict", "といって", "といって", "nothing in particular / nothing notable", "Plain form + といって / これといって", "〜といって (especially in the fixed form これといって) expresses that there is 'nothing in particular' worth noting — 'no specific X' / 'nothing notable'. Very commonly used to downplay or deny significance, often with negative main clauses. Neutral register, very common in everyday speech.", ["Most commonly in the fixed phrase これといって + negative ('nothing in particular').", "Downplays significance — 'nothing notable / worth mentioning'."], "これといって問題はありません。", "There's nothing in particular that's a problem.", "jld"], ["g.you-nara-if-looks", "N2", "dict", "ようなら(ば)", "ようなら(ば)", "if it looks like / if it appears", "Plain form + ようなら(ば)", "〜ようなら is a conditional variant that attaches to hypothetical situations the speaker infers from appearance — 'if it looks like X, (then do Y)'. Often used when making contingency plans based on how things are going. Distinct from 〜なら (neutral 'if it's X').", ["Appearance-based conditional — 'if it looks like X'.", "Distinct from 〜なら (topic conditional) and 〜たら / ば (general conditional)."], "雨が降るようなら、中止しましょう。", "If it looks like it'll rain, let's cancel.", "jld"], ["g.you-dewa-if-its", "N2", "dict", "ようでは", "ようでは", "if it's like that / at this rate", "Plain form + ようでは", "〜ようでは expresses a hypothetical condition with a negative, critical, or warning tone — 'if X is like that, (then something bad will follow)'. The main clause often presents an unfavorable prediction or judgment. Distinct from 〜ようなら (more neutral).", ["Critical / warning conditional — implies an unfavorable outcome.", "Main clause often: だめだ, 合格できない, 成功しない."], "そんなに怠けるようでは、合格できないよ。", "If you're lazy like that, you won't pass.", "jld"], ["g.mono-ga-aru", "N2", "dict", "ものがある", "ものがある", "there is something (about it) / is impressively", "Plain form + ものがある", "〜ものがある expresses that there is a certain quality or feature worth noting about something — 'there's something X about it'. Often used evaluatively with impressive, moving, or remarkable qualities. Formal / literary register. Different from 〜ものだ (general truth) and 〜ものの (although).", ["Evaluative — 'there's something X about it'.", "Common with impressive / emotional qualities: 感動的なものがある, 素晴らしいものがある."], "彼の演奏には感動的なものがある。", "There's something moving about his performance.", "jld"], ["g.to-iu-no-wa", "N2", "dict", "というのは", "というのは", "what is called / the fact is / the reason is", "Noun / plain form + というのは", "〜というのは has several related senses: (1) 'what is called X / the thing called X' — introducing a definition or concept; (2) 'the fact is / the reason is' — explaining a reason or clarifying a concept. Very common as a topic marker or explanation starter. Neutral register.", ["Definition / explanation marker — 'what X is' or 'the reason is'.", "Very common in introductions and explanations."], "友情というのは、お金で買えないものだ。", "Friendship is something you can't buy with money.", "jld"], ["g.hate-ni-after", "N2", "ta", "果てに", "はてに", "at the very end of / after (extensive process)", "V-た form / noun + の + 果てに", "〜果てに expresses that the main-clause outcome came at the end of a long, often harsh, process — 'after extensive X, finally Y'. Typically carries a sense of hardship or dramatic finality. Similar to 〜末に and 〜あげく but with a stronger 'far end' feel. Literary / formal register.", ["Dramatic / final outcome after extensive effort or struggle.", "Often negative or weighty — the end of a hard road."], "長年の努力の果てに、夢を実現した。", "After years of effort, he finally realized his dream.", "jld"], ["g.sobireru-miss-chance", "N2", "i", "そびれる", "そびれる", "miss the chance to / fail to", "Verb ます-stem + そびれる", "〜そびれる expresses that someone missed the opportunity to do something or failed to do it despite intending to — 'miss the chance to X'. Common with things the speaker meant to do but didn't: 言いそびれる ('fail to say'), 聞きそびれる ('fail to ask'), 行きそびれる ('miss the chance to go').", ["Missed opportunity — implies the speaker meant to but didn't.", "Common with communication and travel verbs: 言う, 聞く, 行く, 会う, 帰る."], "言いそびれたことがある。", "There's something I missed the chance to say.", "jld"], ["g.yashinai-emphatic", "N2", "i", "やしない", "やしない", "(emphatic) not at all / definitely not (casual)", "V ます-stem + やしない", "〜やしない is a casual emphatic negative — 'definitely won't / absolutely not'. Attached to the verb ます-stem to strengthen the negation. Common in frustrated or emphatic denials. Strictly casual register.", ["Casual emphatic negation — 'definitely won't'.", "Often in frustrated complaints: 分かりやしない, 聞きやしない."], "そんなこと、分かりやしない。", "There's no way I'd understand that.", "jld"], ["g.to-iu-koto-wa", "N2", "dict", "ということは", "ということは", "what it means is / so (it follows that)", "Plain form + ということは", "〜ということは is a discourse marker that introduces a logical conclusion from a preceding statement — 'what this means is', 'in other words', 'so it follows that'. Very common in spoken Japanese for drawing inferences. Distinct from 〜ということだ (hearsay / 'it means').", ["Draws a conclusion / inference from a preceding statement.", "Very common in conversation when summarizing or clarifying."], "彼が来ないということは、忙しいのだろう。", "His not coming means he's probably busy.", "jld"], ["g.ka-to-iu-to", "N2", "dict", "かというと", "かというと", "as for whether / if you ask whether", "Plain form + かというと / かといえば", "〜かというと embeds a question for discussion — 'as for whether X, (the answer is Y)'. Often used when the speaker raises a question and then answers it themselves. Common in explanatory contexts and hedged assertions. Variants: どちらかというと ('if anything / rather').", ["Discourse-level 'as for whether' — raising and answering a question.", "Common fixed form: どちらかというと ('if anything / rather'), どちらかといえば."], "好きかというと、そうでもない。", "As for whether I like it — not really.", "jld"], ["g.mono-to-shite", "N2", "dict", "ものとして", "ものとして", "as / regarded as / assuming that", "Noun + ものとして", "〜ものとして is used to frame something as being treated or considered as X — 'as X' or 'regarded as X'. Often in hypothetical or categorical framings: 'treat this as accepted', 'consider it settled'. Formal / written register, common in business and formal statements.", ["Categorical framing — 'considered as X' for practical purposes.", "Common in business and formal contexts."], "本件は合意したものとして扱います。", "We will treat this matter as agreed upon.", "jld"], ["g.te-mo-ii-kurai", "N2", "te", "もいいくらい", "もいいくらい", "enough to / to the extent that (you could)", "V-て form + もいいくらい", "〜てもいいくらい expresses that the intensity or extent of something is so high that it justifies an extreme action — 'it's so X that you might as well Y'. Often used hyperbolically. Close to 〜ほど with extreme degree meaning. Neutral / casual register.", ["Hyperbolic degree — 'enough to do X / to the extent that'.", "Often used emphatically: 感謝してもしきれないくらい ('so grateful I can't thank you enough')."], "彼の絵は、プロと言ってもいいくらい上手だ。", "His paintings are so good you could almost call him a pro.", "jld"], ["g.ato-wa-rest", "N2", "dict", "あとは", "あとは", "the rest is / all that's left is", "Noun / plain form + あとは", "〜あとは expresses that after a main action is complete, only X remains to be done — 'the rest is X' / 'all that's left is X'. Common in task-oriented contexts for summarizing what's still to be finished after the main work is done.", ["'Remaining to be done' — describes what's left after the main effort.", "Common for project wrap-up or recipe contexts."], "準備はできた。あとは出発するだけだ。", "Preparations are done. All that's left is to depart.", "jld"], ["g.dake-nara", "N2", "dict", "だけなら", "だけなら", "if only / if it's just X", "Noun / V plain + だけなら", "〜だけなら expresses 'if it's only X (then Y is OK)' — a conditional statement that limits the scope to a minimal case. Often used when the speaker is willing to accept or permit something up to a specific boundary. Neutral register.", ["Minimal-scope conditional — 'if just X, it's fine'.", "Common in permission or hedged acceptance."], "見るだけなら、いいですよ。", "If it's just looking, it's fine.", "jld"], ["g.nai-nomi-narazu", "N2", "n", "ないのみならず", "ないのみならず", "not only does not / not just failing to", "V ない + のみならず", "〜ないのみならず is a literary concessive-additive combining the negative ない with the 'not only' のみならず — 'not only does X not happen, (but Y also)'. The Y clause extends the negation or adds a worse case. Formal / literary register, rare in casual speech.", ["Literary / formal extended negation.", "Common in essays and formal criticism."], "彼は謝らないのみならず、逆に怒り出した。", "Not only did he not apologize, but he even got angry.", "jld"], ["g.ni-shitagatte", "N2", "dict", "にしたがって", "にしたがって", "in accordance with / as (X progresses)", "Noun + にしたがって / V plain + にしたがって", "〜にしたがって has two related senses: (1) 'in accordance with' — following rules, orders, or guidelines (noun + にしたがって); (2) 'as (X progresses/increases)' — expressing a parallel change, similar to 〜につれて (V plain + にしたがって). Formal / written register, common in explanations of rules or describing progressive changes.", ["Two senses — 'in accordance' (following rules) and 'as (X progresses)' (parallel change).", "Parallel to 〜につれて — both express correlated change, but にしたがって has a slightly more formal / rule-following nuance."], "ルールにしたがって、行動してください。", "Please act in accordance with the rules.", "jld"], ["g.mono-no-although", "N2", "dict", "ものの", "ものの", "although / even though (formal)", "Plain form + ものの", "〜ものの is a formal concessive marker meaning 'although X, Y', where the main clause often expresses a limitation, unexpected outcome, or reversal relative to what the ものの clause suggests. More formal and literary than けれど / が. Typical in written Japanese, reports, and formal speech. Distinct from 〜ものだ (general truth) and ものなら (if it were possible).", ["Formal / literary register — alternatives in casual speech are けど / が.", "Main clause typically expresses an unexpected continuation or limitation."], "宿題を始めたものの、なかなか進まない。", "Although I started my homework, it's not progressing much.", "jld"], ["g.mono-nara-if-possible", "N2", "pot", "ものなら", "ものなら", "if (it were) possible / if I could", "V potential form + ものなら", "〜ものなら combined with a potential form expresses a hypothetical wish that the speaker considers difficult or impossible — 'if I could only X'. Often accompanied by a main clause describing the desired action. Formal / literary register, with a slightly wistful tone. Distinct from 〜たら / 〜ば (general conditionals).", ["Typically with potential forms: 会えるものなら ('if I could meet'), 戻れるものなら ('if I could go back').", "Hypothetical and often wistful — implies the action is hard / impossible."], "昔に戻れるものなら、戻りたい。", "If I could go back to the past, I would.", "jld"], ["g.ue-ni-in-addition", "N2", "dict", "上に", "うえに", "in addition to / on top of (that)", "Plain form + 上に", "〜上に is an additive connector meaning 'in addition to X, (also) Y'. The Y clause builds on or extends the X clause in the same direction — usually both positive or both negative. More formal than 〜し. Distinct from the locative 上 (above). Common in lists of reasons or attributes.", ["Additive — Y clause extends X in the same direction (both positive or both negative).", "Formal variant of 〜し (listing reasons/facts)."], "この部屋は広い上に、明るい。", "This room is spacious and also bright.", "jld"], ["g.ue-wa-now", "N2", "dict", "上は", "うえは", "now that / since (formal, implies commitment)", "V plain + 上は", "〜上は (うえは) is a formal concessive / justificatory marker — 'now that X, Y must follow'. The main clause typically expresses an obligation, commitment, or necessary consequence following from the 上は premise. More formal and literary than 〜以上 (though their meanings overlap considerably). Common in business, formal writing, and speeches.", ["Formal / literary — alternative: 〜以上(は) (slightly more common).", "Main clause often expresses a required obligation or determination: 約束した上は、必ず守る."], "約束した上は、必ず守る。", "Now that I've promised, I'll definitely keep my word.", "jld"], ["g.ijou-since", "N2", "dict", "以上(は)", "いじょう(は)", "since / now that / as long as", "Plain form + 以上(は)", "〜以上(は) expresses that given the premise of the 以上 clause, a certain conclusion or obligation follows — 'since X is the case, Y'. Often used for commitments, obligations, or expectations that arise because of a stated fact. The optional は adds topic emphasis. Formal / neutral register.", ["The premise justifies an obligation or expectation in the main clause.", "Common in commitment contexts: 約束した以上、守らなければならない ('since I promised, I must keep it')."], "約束した以上、守らなければならない。", "Since I promised, I have to keep it.", "jld"], ["g.osore-ga-aru", "N2", "dict", "恐れがある", "おそれがある", "risk of / fear that (may happen)", "V plain / noun + の + 恐れがある", "〜恐れがある expresses that there is a risk or possibility of something (usually negative) happening — 'there's a risk of X'. Common in news reports, weather forecasts, and cautionary statements. 恐れ literally means 'fear / apprehension'. Formal register.", ["Negative risk — 'there's a risk / fear that X'.", "Common in weather forecasts: 大雨の恐れがある."], "明日は大雨の恐れがあります。", "There's a risk of heavy rain tomorrow.", "jld"], ["g.ka-to-omou-to", "N2", "ta", "かと思うと", "かとおもうと", "no sooner had / just when (unexpected change)", "V-た form + かと思うと / かと思ったら", "〜かと思うと expresses that two events happen in quick succession, often with an unexpected change — 'no sooner had X than Y' / 'just when I thought X, Y happened'. Similar in function to 〜や否や and 〜たとたん, but with a stronger sense of narrative surprise. Literary register.", ["Unexpected follow-up — two events in quick succession.", "Often narrative / dramatic: 泣いたかと思うと、笑い出した ('no sooner had she cried than she started laughing')."], "泣いたかと思うと、すぐ笑い出した。", "No sooner had she cried than she started laughing.", "jld"], ["g.hodo-dewa-nai", "N2", "dict", "ほどではない", "ほどではない", "not to the extent of / not as much as", "Plain form + ほどではない", "〜ほどではない is a negation of 〜ほど, expressing that something is 'not to the extent' of X — downplaying a comparison. Often used to moderate a previous statement: 'yes, but not that much'. Neutral / formal register.", ["Moderating negation — 'not quite as much as X'.", "Common to hedge: 痛いけど、救急車を呼ぶほどではない."], "痛いけど、病院に行くほどではない。", "It hurts, but not to the extent of going to the hospital.", "jld"], ["g.you-da-appearance", "N3", "dict", "ようだ", "ようだ", "appears / seems (evidence-based, formal)", "Plain form + ようだ", "ようだ expresses an inference the speaker is making based on available evidence — 'it appears that', 'it seems that'. It is more formal and more tentative than みたい (its casual equivalent). It is also used for similes ('like X') and has a highly productive adverbial form ように ('in a way such that').", ["Note the different connectors: な for na-adjectives, の for nouns — NOT だ.", "Also used for similes: 彼は子供のようだ ('he is like a child')."], "誰もいないようだ。", "It seems nobody is here.", "jld"], ["g.aida-ni", "N3", "dict", "間", "あいだ", "during / while (a period within which something happens)", "V 〜ている / noun-の / adj + 間 or 間に", "〜間 and 〜間に both express temporal 'during / while', but differ in scope: 〜間 (without に) covers the whole duration and is used with continuous main-clause actions that also span the whole period. 〜間に (with に) marks a point or sub-interval within the period, and is used for one-off events that happen during it. Subjects in the main clause and the 間 clause can differ.", ["〜間 (whole period): 私が日本にいる間、ずっと雨が降っていた.", "〜間に (sub-interval): 私が寝ている間に、彼が来た."], "私が留守の間に誰か来ましたか。", "Did someone come while I was out?", "jld"], ["g.ta-tokoro", "N3", "dict", "ところ", "ところ", "just (now) did / just about to do / in the middle of doing", "Verb form + ところ", "ところ combined with different verb forms expresses the aspectual 'point of doing' an action: Vる + ところ = 'just about to', V 〜ている + ところ = 'in the middle of', Vた + ところ = 'just did (right now)'. Unlike 〜たばかり (subjective recency), 〜たところ refers to the immediate, clock-objective moment.", ["Objectively 'just now' — typically within minutes of speaking.", "Contrast with 〜たばかり, which is speaker-subjective and can span hours to days."], "今、駅に着いたところです。", "I just arrived at the station (right now).", "jld"], ["g.you-ni-purpose", "N3", "pot", "ように", "ように", "so that / in order to (non-volitional goal)", "V plain non-past (potential / intransitive / ない-form) + ように", "ように as a purpose marker is used when the goal is a state or non-volitional outcome — typically with potential verbs (聞こえるように 'so one can hear'), intransitive verbs (雨が降らないように 'so the rain doesn't'), or the negative ない-form (忘れないように 'so I don't forget'). Contrast with ために, which is used for volitional main-clause actions.", ["The subject of the ように clause may differ from the main clause.", "Contrast with ために: ために is used when the main clause subject intentionally acts toward a goal they can control; ように is used when the goal is non-volitional or a state change."], "よく聞こえるように大きい声で話してください。", "Please speak loudly so (we) can hear well.", "jld"], ["g.okage-sei-de", "N3", "dict", "おかげで", "おかげで", "thanks to / because of (with explicit positive or negative attribution)", "V plain / noun-の + おかげで (positive) or せいで (negative)", "おかげで and せいで both attribute a result to a cause, but with opposite polarity: おかげで ('thanks to') is used for positive outcomes, while せいで ('because of / at the fault of') is used for negative outcomes. They are structural twins — same connection patterns, opposite valence — and are typically taught as a pair.", ["おかげで: positive outcomes only — thanks to (someone's help / a fortunate circumstance).", "せいで: negative outcomes only — because of (someone's fault / an unfortunate circumstance)."], "あなたのおかげで合格できました。", "Thanks to you, I was able to pass.", "jld"], ["g.tabi-ni-every-time", "N3", "dict", "たびに", "たびに", "every time / whenever", "V plain non-past / noun-の + たびに", "たびに attaches to a verb or noun phrase to express 'every time X happens, Y also happens'. It implies repetition with a consistent association — each occurrence of the たびに clause triggers the main clause. More emphatic and pattern-asserting than simply using 〜ときに ('when').", ["Always uses the non-past form of the verb, even when describing repeated past events.", "Main clause can be past, present, or future — the たびに clause stays non-past."], "彼に会うたびに、昔を思い出す。", "Every time I see him, I remember the past.", "jld"], ["g.ka-dou-ka", "N3", "dict", "かどうか", "かどうか", "whether or not", "Plain form (or noun / na-adj root) + かどうか", "かどうか embeds a yes/no question inside another clause — 'whether ___ or not'. It attaches to a plain-form predicate. Crucially, the だ copula is dropped before かどうか for nouns and na-adjectives (学生かどうか, NOT 学生だかどうか). Contrast with embedded wh-questions (誰が来るか), which use か alone without どうか.", ["Drop だ before かどうか for nouns and na-adjectives — this is a common error point.", "For wh-questions (not yes/no), use か alone: 誰が来るか分からない ('I don't know who is coming')."], "彼が来るかどうか分からない。", "I don't know whether he'll come or not.", "jld"], ["g.beki-da", "N3", "dict", "べきだ", "べきだ", "should / ought to (moral or social obligation)", "Verb (dictionary form) + べきだ", "べきだ expresses a moral or social 'should' — a normative claim that something ought to be done. It is stronger than 〜たほうがいい (suggestion / advice) and more abstract than 〜なければならない (concrete necessity). Often used in formal writing, opinion pieces, and moral advice. The negative form べきではない / べきじゃない means 'shouldn't'.", ["Register: formal to neutral; appropriate in writing and formal speech, but also usable in personal advice.", "Past form べきだった expresses regret or hindsight: そうするべきだった ('I should have done that')."], "学生は勉強すべきだ。", "Students should study.", "jld"], ["g.sae-even", "N3", "i", "さえすれば", "さえすれば", "even (emphatic, minimal case)", "Noun + さえ (+ negative or extreme statement)", "さえ is an emphatic particle meaning 'even' — it highlights a minimal or unexpected case to make a point, often 'if even X (which is basic/minimal), then surely Y'. Commonly paired with conditional constructions (さえ〜ば 'if only X') or with negative statements to express surprise or disbelief ('even X doesn't Y'). More emphatic than でも in this sense.", ["Emphasizes a minimal or unexpected case: 子供さえ知っている ('even a child knows').", "〜さえ〜ば (sufficient condition): お金さえあれば ('if only I had money')."], "子供さえ知っている。", "Even a child knows.", "jld"], ["g.kagiri-as-long-as", "N3", "dict", "限り", "かぎり", "as long as / to the extent that / as far as", "V plain / i-adj / noun + である + 限り", "〜限り has several related senses: (1) 'as long as' (as a condition continues) — V plain non-past + 限り; (2) 'to the extent that / as far as' (limit of knowledge or ability) — 知っている限り ('as far as I know'); (3) 'as long as X is the case' (condition on a state). A versatile marker for expressing scope or limit.", ["V ない + 限り = 'unless' — 勉強しない限り、合格できない ('unless you study, you can't pass').", "The negative variant 〜ない限り is very common for 'unless' constructions."], "生きている限り、希望はある。", "As long as you're alive, there's hope.", "jld"], ["g.furi-wo-suru-pretend", "N3", "dict", "ふりをする", "ふりをする", "to pretend to / act as if", "Plain form + ふりをする", "〜ふりをする expresses that the subject pretends to be or do something they actually are not or did not. ふり literally means 'appearance / pretense'. Commonly used in social situations where someone puts on a facade. The construction works with all predicate types: verbs, adjectives, and nouns (with の).", ["ふり means 'pretense / appearance' and is often left in kana.", "For na-adj and nouns, use the attributive form (な / の) before ふり."], "寝たふりをした。", "I pretended to be asleep.", "jld"], ["g.wake-dewa-nai", "N3", "dict", "わけではない", "わけではない", "it's not (necessarily) that / it doesn't mean that", "Plain form + わけではない", "〜わけではない softens a negative — 'it's not that I don't X' or 'that doesn't mean X'. It hedges an implication that the speaker wants to deny without outright rejecting the broader topic. Common in explanations when correcting a listener's assumption: 'it's not like I hate it, it's just that...'. The casual contracted form is わけじゃない.", ["Hedges a negation — 'not necessarily' rather than an outright 'no'.", "Casual contraction: わけじゃない."], "嫌いなわけじゃないけど、今日は食べたくない。", "It's not that I dislike it, I just don't feel like eating it today.", "jld"], ["g.ni-shitemo-even", "N3", "dict", "にしても", "にしても", "even if / even assuming / even for", "Plain form + にしても", "〜にしても is a concessive marker meaning 'even if / even assuming X' or 'even for (someone like) X'. It concedes a hypothetical or evaluative position and presents a main-clause observation regardless. Common in the fixed phrase どちらにしても / いずれにしても ('in any case / either way'). Also used to acknowledge an extreme example: 子供にしても、分かる ('even for a child, it's understandable').", ["Concessive — 'even if' in a more formal / literary register than 〜ても.", "Fixed phrase: どちらにしても / いずれにしても ('in any case / either way')."], "失敗するにしても、挑戦するべきだ。", "Even if you fail, you should try.", "jld"], ["g.to-wa-kagiranai", "N3", "dict", "とは限らない", "とはかぎらない", "not necessarily / not always", "Plain form + とは限らない", "〜とは限らない expresses that a general statement has exceptions — 'X is not necessarily true' or 'not always X'. It hedges a generalization by saying it doesn't hold in every case. Often contrasts with a listener's assumption: 'you might think X, but it's not always the case'. Related in nuance to わけではない but more specifically about generalizations and exceptions.", ["Hedges a generalization — common in discussions, advice, and corrections.", "Often preceded by 必ずしも ('not necessarily', redundant but common): 必ずしも〜とは限らない."], "高いものがいいとは限らない。", "Expensive things are not necessarily good.", "jld"], ["g.ni-taishite-toward", "N3", "dict", "のに対して", "のにたいして", "toward / against / in contrast to", "Noun + に対して", "〜に対して has two related senses: (1) 'toward / against' — marking the object of an attitude, action, or emotion directed at someone or something (親に対して失礼 'rude toward parents'); (2) 'in contrast to' — drawing an explicit contrast between two items (兄は静かなのに対して、弟はうるさい 'the older brother is quiet, whereas the younger one is loud'). The attributive form に対する / に対しての is productive.", ["Directional sense: marks the target of an action, emotion, or attitude.", "Contrast sense: requires のに before 対して when contrasting clauses."], "親に対して、失礼な態度を取ってはいけない。", "You mustn't take a disrespectful attitude toward your parents.", "jld"], ["g.to-tomoni-together", "N3", "dict", "とともに", "とともに", "together with / as X happens", "Noun / V plain + とともに", "〜とともに has two related senses: (1) 'together with' — noun + とともに, more formal than 〜と一緒に; (2) 'as X happens / simultaneously' — expressing parallel events or a relationship of co-occurrence. Literary / formal register. Can attach to noun, noun + する verb, or plain-form clause.", ["Formal variant of 〜と一緒に for accompaniment.", "Co-occurrence sense: 季節が変わるとともに、服装も変えた ('as the season changed, I changed my clothes')."], "家族とともに新年を迎えた。", "I welcomed the new year together with my family.", "jld"], ["g.ta-kiri-since-last", "N3", "ta", "きり", "きり", "since last doing X, (haven't done Y) / only doing X and no more", "Verb-た form + きり + (negative continuation)", "〜たきり expresses that after doing X, nothing further has been done — often with a negative continuation clause. It implies an interruption or a state that has persisted since the past event. Common for describing situations that have not changed since a specific past moment. Distinct from the simple きり (exclusivity).", ["Usually followed by a negative: 〜たきり、〜ていない ('since doing X, haven't done Y').", "Implies the state has persisted unchanged since the past event."], "昨日家を出たきり、まだ帰ってこない。", "He left the house yesterday and still hasn't come back.", "jld"], ["g.dake-ni-precisely", "N3", "dict", "だけに", "だけに", "precisely because / being X, all the more", "Plain form + だけに", "〜だけに expresses a causal emphasis — 'precisely because X' or 'being X, (the consequence is) all the more (strong)'. It builds on だけ ('only / extent') but in a causal direction, implying that the degree of X corresponds to or amplifies the main clause's outcome. Often used to emphasize natural correspondence or heightened reactions.", ["Causal and proportional — 'X being the case, Y is correspondingly so'.", "Often with expected outcomes that are amplified by the cause: プロだけに上手だ ('being a pro, he's all the more skilled')."], "期待していただけに、がっかりした。", "Precisely because I'd had high hopes, I was all the more disappointed.", "jld"], ["g.dake-atte-as-expected", "N3", "dict", "だけあって", "だけあって", "as one would expect from / fittingly", "Plain form + だけあって", "〜だけあって expresses that the main-clause quality is 'fittingly' or 'as you would expect from' the characteristic described in the だけあって clause — 'being X, of course Y'. Positive evaluative nuance: the speaker endorses the main-clause claim as natural given the premise. Often used to compliment skills, qualities, or training.", ["Positive evaluative — the consequence is praiseworthy / expected given the premise.", "Contrast with だけに (neutral proportionality) — だけあって is endorsing."], "10年練習しただけあって、演奏が見事だ。", "Having practiced for 10 years, his performance is splendid.", "jld"], ["g.bakari-ni-merely", "N3", "dict", "ばかりに", "ばかりに", "merely because / just because (often with negative outcome)", "Plain form + ばかりに", "〜ばかりに expresses that a minor or specific cause led to an (usually undesirable) consequence — 'merely because X, Y (unfortunately)'. Often used in regret or complaint contexts, emphasizing that the outcome stems from a single triggering cause. Distinct from 〜ばかり (only / nothing but).", ["Typically negative outcomes — regret about a trigger that led to an unwanted result.", "Distinct from 〜ばかり (exclusivity) and 〜たばかり (recent action)."], "急いでいたばかりに、大切なものを忘れた。", "Merely because I was in a hurry, I forgot something important.", "jld"], ["g.bakari-ka-not-only", "N3", "dict", "ばかりか", "ばかりか", "not only X but also Y", "Plain form + ばかりか", "〜ばかりか is an additive construction meaning 'not only X, but also Y'. The Y clause usually extends the X claim, often to a more surprising or emphatic level. More formal than the casual 〜だけでなく. Common in emphatic or praiseworthy / critical descriptions. The shorter variant 〜どころか has a related but distinct use (far from X, actually Y).", ["Additive: the Y clause adds to or intensifies the X clause.", "More formal than 〜だけでなく (everyday 'not only')."], "彼は英語ばかりか、フランス語も話せる。", "He can speak not only English but also French.", "jld"], ["g.to-iu-yori-rather", "N3", "dict", "というより", "というより", "rather than / more than saying X", "Plain form + というより", "〜というより presents a correction or refinement of a characterization — 'rather than saying X, it's more like Y'. The Y clause offers a more accurate or nuanced description. Common in explanations, corrections, and when trying to articulate something precisely. The longer form 〜というよりむしろ adds emphasis.", ["Replaces one characterization with a better one — not merely contrast but refinement.", "Often with むしろ for emphasis: 〜というよりむしろ ('rather, more like')."], "彼は勉強しているというより、遊んでいる。", "Rather than studying, he's (actually) playing around.", "jld"], ["g.to-ieba-speaking-of", "N3", "dict", "と言えば", "といえば", "speaking of / when it comes to", "Noun / plain form + と言えば", "〜と言えば introduces a topic by taking the previous utterance as a jumping-off point — 'speaking of X'. Used to shift or extend a topic naturally in conversation. Distinct from 〜というと (similar, sometimes interchangeable, slightly more reflective) and from the fixed 〜といったら (emphatic 'when it comes to X').", ["Topic-shift marker in conversation — 'speaking of X, now let me talk about related Y'.", "Common to launch a tangential but related remark."], "日本の食べ物と言えば、やっぱり寿司だろう。", "Speaking of Japanese food, it's got to be sushi, right?", "jld"], ["g.to-itte-mo-although", "N3", "dict", "と言っても", "といっても", "although I say / although we call it", "Plain form + と言っても", "〜と言っても qualifies a previous statement — 'although I say / call it X, (the reality is more modest / different from what you might think)'. It hedges an expectation by clarifying that the X claim is technically true but less grand than it might sound. Common in honest self-description and explanation.", ["Hedges the claim — the following clause often reveals a more modest reality.", "Common for honest self-presentation: 料理と言っても、簡単なものだけ."], "日本語を勉強していると言っても、まだ初心者です。", "Although I say I'm studying Japanese, I'm still a beginner.", "jld"], ["g.dokoro-ka-far-from", "N3", "dict", "どころか", "どころか", "far from / let alone / on the contrary", "Plain form + どころか", "〜どころか is a strong contrastive construction meaning 'far from X, Y' — it rejects an expected or modest claim and presents a contrasting, often more intense, reality. 'Far from being X, it's actually Y'. The main clause typically presents something more extreme or opposite to what the X clause implied.", ["Strong contrast — the main clause reverses or exceeds the X clause's implication.", "Often paired with negative expectations and surprising reality: 歩けないどころか、立てない ('far from being unable to walk, I can't even stand')."], "彼は日本語どころか、英語も話せない。", "He can't even speak English, let alone Japanese.", "jld"], ["g.ippou-de-one-hand", "N3", "dict", "一方で", "いっぽうで", "on the other hand / while at the same time", "Plain form + 一方で", "〜一方で presents a contrast or parallel between two aspects, situations, or groups — 'on the one hand X, on the other Y'. The two clauses often describe complementary or contrasting facets of the same broader topic. Formal / neutral register, common in essays and balanced discussions.", ["Presents two sides, facets, or situations — not always strict opposition.", "Formal / balanced register — typical of essays and news articles."], "彼は優しい一方で、厳しいところもある。", "He's kind, but on the other hand, he has a strict side.", "jld"], ["g.warini-considering", "N3", "dict", "わりに(は)", "わりに(は)", "considering / for (an X), (relatively) Y", "Plain form + わりに(は)", "〜わりに(は) expresses that something is unexpected or disproportionate to a given standard — 'considering X, Y is unexpected / more (or less) than you'd think'. The comparison is relative to the X premise, and the main clause often describes something surprising in either direction. More neutral in tone than のに (contrast with frustration).", ["Expresses disproportion relative to the premise — 'considering X, I didn't expect Y'.", "More neutral than のに — わりに is observational, のに often has emotional weight."], "このレストランは値段のわりにおいしい。", "For the price, this restaurant is (surprisingly) delicious.", "jld"], ["g.tsuzukeru-continue", "N3", "i", "続ける", "つづける", "continue doing / keep doing", "Verb ます-stem + 続ける", "〜続ける is an auxiliary verb meaning 'continue doing X' — attached to the ます-stem to express persistence or continuation of an action. Often indicates sustained effort or determination. The past form 続けた expresses completion of a long-term action, and 続けている expresses current continuation.", ["Auxiliary verb pattern — attaches to the ます-stem of another verb.", "Implies sustained effort or persistence."], "雨が降り続けている。", "It keeps raining.", "jld"], ["g.naoshi-redo", "N3", "i", "直す", "なおす", "redo / do (X) over again", "Verb ます-stem + 直す", "〜直す is an auxiliary verb meaning 'do X again / redo X' — typically used to fix, improve, or restart an action. Common for revising, rewriting, reconsidering, rebuilding. Attaches to the ます-stem of the base verb and conjugates as a godan verb.", ["Typically implies correcting or improving — not just 'doing again' neutrally.", "Common: 書き直す (rewrite), 考え直す (reconsider), やり直す (redo), 作り直す (remake)."], "レポートを書き直した。", "I rewrote the report.", "jld"], ["g.saichu-in-the-middle", "N3", "dict", "最中", "さいちゅう", "in the middle of / right in the midst of", "Noun / V 〜ている + 最中", "〜最中 (さいちゅう) expresses that an action or event is at its peak or most-intense moment — 'right in the middle of'. Often used for interruptions: 'in the middle of X, Y happened'. Distinct from 〜ているところ ('in the middle of doing') in that 最中 emphasizes the peak or core of the activity.", ["Emphasizes the peak / core of an activity — 'right in the middle'.", "Often paired with interruption: 食事の最中に電話が鳴った."], "食事の最中に電話が鳴った。", "The phone rang right in the middle of the meal.", "jld"], ["g.kke-casual-wondering", "N3", "dict", "っけ", "っけ", "was it the case that / I can't quite remember (casual)", "Plain form + っけ", "〜っけ is a sentence-ending particle used when the speaker is trying to recall or confirm something they already knew or were told — 'was it the case that...?' / 'I can't quite remember, was it...?'. Strongly casual; typically used to oneself or to a close listener. Often attached to past-tense plain forms or to だ / だった (for nouns / na-adj).", ["Strictly casual — do not use in polite / formal speech.", "For recall or confirmation of things the speaker once knew."], "明日、何時からだっけ？", "What time does it start tomorrow again?", "jld"], ["g.mon-casual-because", "N3", "dict", "んだもん", "んだもん", "(it's) because / that's why (casual whining)", "Plain form + んだもん", "〜んだもん is the casual contracted form of 〜ものだから, used to give an emotionally-charged reason or excuse — 'because, I'm telling you' / 'that's why (don't blame me)'. Very common in casual speech, sometimes with a whining or defensive nuance, especially among younger speakers and in emotional contexts.", ["Casual and often whining or defensive in tone.", "Contraction of 〜のだもの (formal) → 〜んだもの → 〜んだもん."], "だって、疲れたんだもん。", "But I'm tired, that's why!", "jld"], ["g.ni-chigainai-must", "N3", "dict", "にちがいない", "にちがいない", "must be / certainly / no doubt", "Plain form + にちがいない", "〜にちがいない expresses the speaker's strong conviction — 'it must be X', 'there's no doubt that X'. Stronger than 〜はず (expectation) and 〜だろう (conjecture). The speaker is making a confident judgment, usually based on available evidence. More formal than 〜にきまっている (which is slightly more casual and emphatic).", ["Strong conviction — 'I'm sure', not 'I think'.", "Stronger than だろう / でしょう (likely guess) and はず (expected)."], "彼が犯人にちがいない。", "He must be the culprit.", "jld"], ["g.kawari-ni-instead", "N3", "dict", "代わりに", "かわりに", "instead of / in exchange for", "V plain / noun + の + 代わりに", "〜代わりに has two related senses: (1) 'instead of / in place of' (substitution) — お茶の代わりにコーヒーを飲む ('drink coffee instead of tea'); (2) 'in exchange for / to make up for' — 手伝う代わりにお金をもらう ('get money in exchange for helping'). Neutral register, very common in everyday speech.", ["Substitution sense: 'in place of' — replaces X with Y.", "Exchange sense: 'in exchange for' — Y is compensation for X."], "お茶の代わりにコーヒーを飲んだ。", "I drank coffee instead of tea.", "jld"], ["g.n-da-kara-emphatic", "N3", "dict", "んだから", "んだから", "since / because (emphatic)", "Plain form + んだから", "〜んだから is a more emphatic form of から, combining the explanatory ん (のだ) with から. It is used to give a strong or somewhat insistent reason, often with emotional emphasis — 'since X (and you should know it)'. Common in arguments, pleas, and firm advice. The ですから form is the polite equivalent.", ["More emphatic than から alone — adds explanatory / insistent tone.", "Origin: contraction of のだから → んだから."], "疲れているんだから、早く寝なさい。", "You're tired, so go to bed early.", "jld"], ["g.wake-ga-nai", "N3", "dict", "わけがない", "わけがない", "there's no way / it's impossible that", "Plain form + わけがない", "〜わけがない is an emphatic negation — 'there's no way that X' / 'it's impossible for X to be the case'. Stronger than はずがない (which is expectation-based). The speaker flatly denies the possibility. The casual contracted form is わけない.", ["Flat denial — 'no way'.", "Stronger than はずがない (which has an expectation flavor)."], "彼がそんなことを言うわけがない。", "There's no way he would say such a thing.", "jld"], ["g.te-shikata-ga-nai", "N3", "te", "しかたがない", "しかたがない", "can't help feeling / unbearably (more formal)", "V-て / i-adj 〜くて / na-adj で + しかたがない", "〜てしかたがない is a more formal variant of 〜てしょうがない, expressing an uncontrollable or unbearable feeling. しかたがない literally means 'there is no way / method', mirroring しょうがない's structure. Appropriate in writing and formal speech where しょうがない would be too casual.", ["Formal variant of 〜てしょうがない — same meaning, more formal register.", "Also often 仕方がない in kanji — especially in writing."], "子供のことが心配でしかたがない。", "I'm unbearably worried about my child.", "jld"], ["g.nan-te-how", "N3", "dict", "なんて", "なんて", "how / such (a thing) as (often surprise, disdain, or dismissal)", "Phrase + なんて", "〜なんて is a versatile particle that can mark (1) surprise or astonishment ('how ~!'); (2) dismissal or belittling ('(things) like ~'); (3) casual quotation ('he said ~' or 'the thing called ~'). It attaches to nouns or plain-form clauses. Register is casual. Close in function to 〜などと but more common in speech.", ["Surprise sense: 'how unbelievable / how wonderful / how awful' — なんてきれいな花! ('what a beautiful flower!').", "Dismissive sense: 'things like X (are not worth much)' — 勉強なんてつまらない ('studying is boring')."], "彼が来ないなんて、信じられない。", "I can't believe he isn't coming!", "jld"], ["g.nai-wake-ni-ikanai", "N3", "n", "ないわけにはいかない", "ないわけにはいかない", "can't not do / have to (social or moral obligation)", "V ない-form + わけにはいかない", "〜ないわけにはいかない is a double-negative construction meaning 'can't not do X' — the speaker feels socially, morally, or circumstantially obligated to do something. Common for expressing obligations arising from social expectations rather than direct requirements. The positive counterpart 〜わけにはいかない ('can't afford to do') is treated as a separate entry.", ["Double negative — 'can't not' = 'have to'.", "Social / moral obligation, not strict necessity like なければならない."], "友達の結婚式だから、行かないわけにはいかない。", "It's my friend's wedding, so I can't not go.", "jld"], ["g.tsuide-ni", "N3", "dict", "ついでに", "ついでに", "while I'm at it / on the way / taking the opportunity", "V plain / noun + の + ついでに", "〜ついでに expresses that one action is done 'on the way' or 'while doing' another — the main goal is X, and Y is done opportunistically alongside it. Common for errands and convenience: 'while I'm at the store, I'll also get bread'. Can attach to verbs or nouns.", ["Opportunistic — the Y action is secondary to the main X action.", "Common for errands: 買い物のついでに ('while I'm shopping'), 散歩のついでに ('while I'm on my walk')."], "買い物のついでに、手紙を出した。", "While I was shopping, I also sent a letter.", "jld"], ["g.bakari-de-naku", "N3", "dict", "ばかりでなく", "ばかりでなく", "not only X but also Y (formal)", "Plain form + ばかりでなく", "〜ばかりでなく is a formal additive construction meaning 'not only X but also Y'. The Y clause extends the X claim in the same direction. More formal than 〜だけでなく, common in written and formal speech. Closely related to 〜ばかりか (also additive).", ["Formal additive — 'not only X but also Y'.", "More formal than 〜だけでなく (everyday variant)."], "彼は勉強ができるばかりでなく、スポーツも得意だ。", "Not only is he good at studying, but he's also good at sports.", "jld"], ["g.dake-de-naku", "N3", "dict", "だけでなく", "だけでなく", "not only X but also Y (neutral)", "Plain form + だけでなく", "〜だけでなく is the neutral, everyday additive construction meaning 'not only X but also Y'. It is the most commonly used of the 'not only' family, appropriate for both written and spoken Japanese. Often paired with も in the main clause for emphasis: 〜だけでなく、〜も.", ["Most common 'not only' construction — suitable for everyday use.", "Often paired with も in the main clause: 日本人だけでなく、外国人も楽しめる ('not only Japanese but foreigners too can enjoy')."], "この本は面白いだけでなく、勉強にもなる。", "This book is not only interesting but also educational.", "jld"], ["g.ni-kimatte-iru", "N3", "dict", "に決まっている", "にきまっている", "it's definitely / of course / for sure", "Plain form + に決まっている", "〜に決まっている expresses the speaker's strong conviction that something is obviously true — 'it's definitely X' / 'of course X' / 'X is a sure thing'. Somewhat casual and emphatic, often used in responses to obvious questions or to emphasize an inevitable conclusion. Stronger conviction than はず or でしょう.", ["Strong conviction — 'it's obvious / certain'.", "More casual / emphatic than にちがいない (formal certainty)."], "そんなの、嘘に決まっている。", "That's obviously a lie.", "jld"], ["g.te-goran-try-casual", "N3", "te", "ごらん(なさい)", "ごらん(なさい)", "try doing (warm / parental suggestion)", "V-て form + ごらん(なさい)", "〜てごらん is a casual, often parental or warm form of 'try doing X'. It overlaps with 〜てみる but carries a recommending nuance — 'give it a try, I think you'll like it'. The longer form 〜てごらんなさい is slightly more polite/instructive. Typical of parent-to-child or teacher-to-student contexts, and friends suggesting something enthusiastically.", ["Warmer and more recommending than 〜てみる alone.", "Not polite enough for strangers or business contexts — use 〜てみてください instead."], "この本を読んでごらん。面白いよ。", "Try reading this book. It's interesting.", "jld"], ["g.ki-ga-suru-feel-like", "N3", "dict", "気がする", "きがする", "feel like / have a feeling that", "Plain form + 気がする", "〜気がする expresses an intuition, premonition, or vague feeling — less firm than 〜と思う. Used for hunches, emotional impressions, and non-evidential guesses. 気がした (past) = 'had a feeling'. 気 literally means 'spirit / mind / feeling', and the full phrase is 'there is a feeling of X'.", ["More tentative than 思う — expresses intuition rather than considered opinion.", "Commonly used for premonitions and bodily feelings: 熱がある気がする ('I feel like I have a fever')."], "雨が降る気がする。", "I have a feeling it's going to rain.", "jld"], ["g.to-omou", "N4", "dict", "と思う", "とおもう", "I think (that) ___", "Plain form + と思う", "と思う attached after a plain-form clause expresses the speaker's opinion or belief — 'I think that…'. The clause before と must be in plain form, not polite (食べると思う, not 食べますと思う). It is the basic way to express opinions in Japanese and is extremely common. For past belief, use と思った.", ["The embedded clause must be in plain form: 高いと思います, not 高いですと思います.", "と思っている (resultant state) is used for holding an opinion over time, especially for third-person opinions: 彼はそう思っている ('he thinks so')."], "明日は雨が降ると思います。", "I think it will rain tomorrow.", "jld"], ["g.to-iu", "N4", "dict", "と言う", "という", "say that ___; be called ___", "Quoted phrase + と言う", "と言う has two related uses: (1) quotation — 'someone says/said that ___' — attached after a plain-form clause, and (2) naming — 'is called ___' — used to give the name of something. In the quotation use, the cited content is in plain form. The past form と言った means 'said that'. と言います is the polite form.", ["Use plain form in the embedded clause.", "The naming pattern X という Y is very productive: 'anime' in Japanese is アニメ and you might say アニメというもの ('the thing called anime')."], "彼は明日来ると言いました。", "He said he would come tomorrow.", "jld"], ["g.kamoshirenai-might", "N4", "dict", "かもしれない", "かもしれない", "might / may / perhaps", "Plain form + かもしれない", "かもしれない (polite かもしれません) expresses possibility — 'might', 'may', 'perhaps'. It is weaker than だろう/でしょう, indicating less certainty. It attaches to the plain form of verbs, い-adjectives, and noun/na-adjective predicates (without だ).", ["No だ before かもしれない for nouns: 学生かもしれません, not 学生だかもしれません.", "Casual contraction: かも (especially at the end: 行くかも — 'might go')."], "明日は雨が降るかもしれません。", "It might rain tomorrow.", "jld"], ["g.node-cause", "N4", "dict", "ので", "ので", "because / since ___ (softer, more objective than から)", "Plain form + ので", "ので expresses reason/cause similar to から, but with a softer, more objective, and often more polite feeling. It is preferred in formal requests and explanations where the speaker wants to avoid sounding pushy. The preceding clause is in plain form, but for noun and na-adjective predicates, なので is used instead of だので.", ["な is required for noun and na-adjective predicates: 学生なので, not 学生だので or 学生ので.", "Often used in polite requests/explanations: 忙しいので、失礼します ('I'm busy so I'll excuse myself')."], "雨が降っているので、中止します。", "Since it's raining, we'll cancel.", "jld"], ["g.ga-kedo-although", "N4", "dict", "が", "が", "but / although / however", "Clause + が / けど / けれども", "が, けど, and けれども are conjunctions meaning 'but' or 'although'. They connect two clauses with a contrastive relationship. が is slightly more formal and written; けど is casual spoken; けれども is formal. They are also often used as soft sentence openers without a strong contrastive meaning — 'well…' or 'by the way…'.", ["Formality ranking: けれども > が > けど (from more formal to less).", "A common soft-opener use: すみませんが、道を教えてください ('excuse me, but could you tell me the way') — not really contrastive."], "この本は難しいですが、面白いです。", "This book is difficult, but it's interesting.", "jld"], ["g.n-desu-explanation", "N4", "dict", "んです", "んです", "explains, gives reason, or softly asserts: 'it's that ___'", "Plain form + んです / のです", "んです (more formal: のです) attaches to a plain-form clause to give an explanation, soften a statement, or provide context. It frames the statement as information the speaker is sharing in response to implicit or explicit questions or context. A classic use is explaining why something is happening: 頭が痛いんです ('(it's that) my head hurts' — used to explain absence or slow reaction). For nouns and な-adjectives, use なんです (学生なんです, not 学生だんです).", ["For nouns and な-adjectives, insert な: 学生なんです.", "In questions, んですか asks for explanation or clarification: なぜ来なかったんですか ('why didn't you come?')."], "頭が痛いんです。", "(The thing is,) my head hurts.", "jld"], ["g.owaru-finish", "N4", "i", "終わる", "おわる", "finish ___ing", "Verb stem + 終わる", "終わる attached to a verb stem forms a compound meaning 'finish doing X'. It is the completion counterpart to 始める. The standalone verb 終わる means 'to end' or 'to be over'. Note that 終える (transitive) can also be used: verb-stem + 終える.", ["Uses the verb stem (same as ます stem).", "終わる is intransitive ('to end'); 終える is transitive ('to finish')."], "本を読み終わりました。", "I finished reading the book.", "jld"], ["g.sugiru-too-much", "N4", "i", "すぎる", "すぎる", "too much / overly ___", "Verb stem / adj stem + すぎる", "すぎる attaches to verb or adjective stems to mean 'too much' or 'overly'. For verbs, attach to the stem (食べる → 食べすぎる — 'eat too much'). For い-adjectives, drop the final い (高い → 高すぎる — 'too expensive'). For な-adjectives, attach directly to the stem (静かすぎる — 'too quiet'). The resulting verb conjugates as an ichidan verb.", ["Exception: いい ('good') → よすぎる.", "Conjugates as an ichidan verb: すぎます, すぎた, すぎない, etc."], "食べすぎました。", "I ate too much.", "jld"], ["g.tari-tari-suru", "N4", "ta", "り", "り", "do things like X and Y (non-exhaustive list of actions)", "Verb-た + り + Verb-た + り + する", "〜たり〜たりする lists actions non-exhaustively — 'do things like X and Y (among others)'. Unlike the sequential 〜て form, たり does not imply any particular order or timing; it just enumerates example actions. The final する carries the tense of the whole construction. A single たり is also grammatical ('do things like X'). The pattern is one of the most common N4 constructions and is essential for describing daily routines and varied activities.", ["Non-exhaustive: implies 'among others' — these are examples, not a complete list.", "Different from the sequential て-form, which orders actions in time."], "週末は映画を見たり、買い物をしたりします。", "On weekends, I do things like watch movies and go shopping.", "jld"], ["g.koto-ni-suru-decide", "N4", "n", "ないことにする", "ないことにする", "decide to (active personal decision)", "V plain non-past / V ない + ことにする", "〜ことにする expresses an active personal decision made by the speaker — 'I decided to do X'. Distinct from its passive counterpart 〜ことになる ('it has been decided'), where the decision comes from circumstance or others. The progressive form 〜ことにしている expresses a habitual decision or self-rule ('I make it a habit to'). Past form 〜ことにした = 'decided'.", ["〜ことにする vs 〜ことになる: する is the speaker's active decision; なる is the passive 'it was decided'.", "Different from the noun-based ni-suru-decide (noun + にする 'decide on X from a menu of options')."], "明日から毎日運動することにしました。", "I decided to exercise every day from tomorrow.", "jld"], ["g.koto-ni-naru-be-decided", "N4", "n", "ないことになる", "ないことになる", "it is decided that / comes to be that", "V plain non-past / V ない + ことになる", "〜ことになる expresses that a decision has been made by circumstance or others, without the speaker's direct agency — 'it was decided that X'. Its active counterpart is 〜ことにする ('I decided to do X'). The progressive form 〜ことになっている expresses an established rule, custom, or schedule. Past form 〜ことになった = 'it was (has been) decided'.", ["Passive counterpart of ことにする — the decision comes from outside the speaker.", "〜ことになっている expresses social customs, rules, or regulations: 日本では〜することになっている."], "来月、東京に転勤することになりました。", "It's been decided that I'll transfer to Tokyo next month.", "jld"], ["g.te-hoshii-want-someone", "N4", "te", "ほしい", "ほしい", "want someone (else) to do X", "V-て form + ほしい", "〜てほしい expresses the speaker's desire for another person to do something. The person being asked is typically marked with に. Distinct from 〜たい (own desire to do) and from ほしい alone (want a thing). The negative form 〜ないでほしい expresses 'want someone not to do X'.", ["The person being asked takes に: 私に話してほしい ('I want you to talk to me').", "Contrast: 〜たい (first-person own desire) vs 〜てほしい (desire that someone else act)."], "私の話を聞いてほしい。", "I want you to listen to me.", "jld"], ["g.shi-reason-listing", "N4", "dict", "し", "し", "and / besides (non-exhaustive listing of reasons or facts)", "Plain form + し (+ plain form + し + ...)", "〜し lists reasons or facts non-exhaustively — 'and moreover', 'for one thing'. The listed items are not the complete set; し implies there may be more. Often paired with a concluding clause that follows from the listed reasons. It is different from the sequential て-form in that it is for reasons/facts rather than actions in sequence.", ["Non-exhaustive: implies there are more reasons than just those listed.", "Often followed by から, a conclusion, or an implied consequence."], "この部屋は広いし、静かだ。", "This room is spacious, and (also) quiet.", "jld"], ["g.tai-to-omou-want-to-think", "N4", "i", "たいと思う", "たいとおもう", "I (think I) want to do", "Verb stem + たいと思う", "〜たいと思う softens the direct 〜たい by framing it as something the speaker 'thinks'. Literally 'think I want to do X', functionally 'I'd like to do X'. Less direct and more polite than bare 〜たい. The progressive form 〜たいと思っている expresses a sustained wish ('I've been wanting to'). Commonly appears in self-introductions, plans, and polite expressions of preference.", ["Softer and more polite than bare 〜たい — commonly used in formal self-introductions.", "Progressive form 〜たいと思っている: 'have been wanting to do X'."], "日本へ行きたいと思います。", "I think I'd like to go to Japan.", "jld"], ["g.ba-ai-in-case", "N4", "dict", "場合(は)", "ばあい(は)", "in the case of / in the event that / if", "V plain / i-adj / na-adj な / noun の + 場合(は)", "〜場合 introduces a hypothetical scenario or specific case — 'in the event that X'. More formal than the basic たら/ば/と/なら conditionals and typical of instructions, warnings, rules, and documentation. The optional は after 場合 sets up the case as the topic. Very common in official signage and emergency instructions.", ["More formal than たら/ば/と/なら — typical of official instructions and rules.", "Often appears in warnings and emergency signage: 火事の場合, 遅れる場合."], "火事の場合、このボタンを押してください。", "In case of fire, press this button.", "jld"], ["g.tsumori-datta-had-intended", "N4", "ta", "つもりだった", "つもりだった", "had intended to / was going to", "V plain non-past + つもりだった", "〜つもりだった is the past form of つもり (intention), expressing an intention held at a past moment — 'I had intended to do X'. Often implies the intention was NOT carried out, with an adversative follow-up ('I was going to, but...'). Distinct from 〜たつもり, which means 'thought I did X' (mistaken belief about having done something).", ["Past form of つもり — the intention is placed in the past, regardless of whether it was carried out.", "Often implies non-realization: 〜つもりだったけど、〜 ('was going to, but...')."], "昨日、勉強するつもりだったけど、疲れて寝てしまった。", "I was going to study yesterday, but I was tired and fell asleep.", "jld"], ["g.hazu-datta-was-supposed", "N4", "dict", "はずだった", "はずだった", "was supposed to / should have been", "V plain / i-adj / noun の / na-adj な + はずだった", "〜はずだった is the past form of はず (expectation), expressing that an outcome was expected but did NOT occur. Often implies surprise, disappointment, or contradiction with reality. Commonly paired with のに or が/けど for the unexpected reality clause. Distinct from はずがない ('there's no way').", ["Expresses an unrealized expectation — the expected outcome did not happen.", "Often paired with のに or が for the contrary reality: 今日来るはずだったのに、来なかった."], "彼は今日来るはずだった。", "He was supposed to come today.", "jld"], ["g.te-itadaku-polite-favor-received", "N4", "te", "いただく", "いただく", "I humbly receive the favor of X doing Y (humble)", "V-て form + いただく", "〜ていただく is the humble-form version of 〜てもらう, used when the favor-doer is a superior or in formal contexts. It is essential in business and polite Japanese. The request form 〜ていただけますか ('could you kindly do X?') is very commonly used in customer service, formal requests, and polite inquiries — it is widely considered one of the softest/most polite ways to ask for something.", ["Humble version of 〜てもらう — the speaker is receiving from a superior.", "Request form 〜ていただけますか is one of the softest ways to ask for something in polite Japanese."], "先生に説明していただきました。", "I had my teacher explain it (to me).", "jld"], ["g.shika-nai", "N4", "dict", "しか", "しか", "only / nothing but (negative-polarity 'only')", "Noun (or V plain) + しか + negative predicate", "しか is a negative-polarity 'only' marker: it must be paired with a negative predicate to give a 'only X' meaning. It is more emphatic and more restrictive than だけ, often carrying a sense of 'only this (and nothing else)' or 'no more than X'. The main clause MUST be in the negative form even though the meaning in English is positive ('only').", ["Requires a NEGATIVE main clause — English speakers often forget this.", "More emphatic / restrictive than だけ: 100円しかない ('I have only 100 yen (and no more)') vs 100円だけある ('I have just 100 yen')."], "お金が100円しかない。", "I only have 100 yen.", "jld"], ["g.tte-quotation", "N4", "dict", "って", "って", "(casual) that... / they said... / the thing called...", "Plain form / phrase + って", "〜って is a highly versatile casual particle with three main uses: (1) casual quotation — equivalent to と (彼は来るって言った 'he said he'll come'); (2) topic marker — emphasizing or introducing a topic (日本語って難しい 'Japanese is hard'); (3) casual という ('called') for naming (佐藤って人 'a person called Sato'). It is strictly casual and should not be used in formal writing.", ["Three main uses: quotation, topic marker, 'called'.", "All casual — replace with the formal equivalents (と, は, という) in polite speech."], "彼は明日来るって言ってた。", "He said he'll come tomorrow.", "jld"], ["g.you-ka-to-omou", "N4", "vol", "かと思う", "かとおもう", "thinking of doing / half-considering", "Verb volitional + かと思う", "〜ようかと思う expresses that the speaker is considering doing X, but with some hesitation or uncertainty — 'thinking of doing X / half-considering'. Less committed than 〜ようと思う (intend to do). Often used for tentative plans. Neutral / formal register.", ["Tentative consideration — less committed than 〜ようと思う.", "Similar to 〜ようと思っている but with the か adding doubt."], "留学しようかと思っています。", "I'm considering studying abroad.", "jld"], ["g.te-imasu-progressive", "N5", "te", "います", "います", "be doing (progressive); be in the state of having done (resultant state)", "Verb-て + います", "-ています has two related uses: (1) ongoing action — 'is doing' — analogous to English progressive; and (2) resultant state — 'has done and is now in that state' — particularly for change-of-state verbs like 結婚する ('get married'), 住む ('live'), 知る ('come to know'). In the second case, 結婚しています means 'is married' (not 'is marrying'). Distinguishing these two uses is an important step in early Japanese learning.", ["For action verbs (eat, read, walk), -ています expresses ongoing action.", "For change-of-state verbs (get married, come to know, die), -ています expresses resultant state."], "今、本を読んでいます。", "I'm reading a book right now.", "jld"], ["g.mashou-ka-invitation", "N5", "i", "ましょうか", "ましょうか", "shall we ___? (invitation); shall I ___? (offer)", "Verb stem + ましょうか", "ましょうか is ましょう + the question marker か, literally 'shall we do?'. It expresses an invitation to do something together ('shall we?') or, with first-person subject, an offer to do something for the listener ('shall I?').", ["Context disambiguates 'shall we' from 'shall I'."], "お茶を飲みましょうか。", "Shall we have some tea?", "jld"], ["g.masenka-invitation", "N5", "i", "ませんか", "ませんか", "won't you...? / would you like to...? (invitation)", "Verb stem + ませんか", "〜ませんか is formed on the polite negative verb ending ません plus the question particle か. Despite its literal 'won't you' shape, it functions as a polite invitation: 'would you like to do X with me?'. Contrast with 〜ましょうか, which is slightly more assertive ('shall we?'). Responses are typically はい or 〜ましょう for acceptance and a polite circumlocution for decline.", ["Functionally an invitation, not a literal yes/no question despite the negative shape.", "Compare with 〜ましょうか (shall we) — ましょうか assumes the other party is amenable, while ませんか leaves more room to decline."], "一緒に映画を見ませんか。", "Would you like to watch a movie together?", "jld"], ["g.toki-ni-when-basic", "N5", "dict", "とき(に)", "とき(に)", "when / at the time of", "V plain / i-adj / na-adj な / noun の + とき(に)", "とき creates a temporal 'when' clause that modifies a main-clause predicate. The に is optional and adds mild emphasis on timing. The verb in the とき clause can be present or past, which determines the temporal relationship to the main clause: V plain non-past + とき = 'when I do / am about to do X', V plain past + とき = 'when I did / was doing X'.", ["Non-past V + とき: action happens at the time of / as X begins.", "Past V + とき: action happens after X has occurred / during an ongoing X."], "子供のとき、よく公園で遊びました。", "When I was a child, I often played in the park.", "jld"], ["g.kara-cause", "N5", "dict", "から", "から", "because / since ___", "Plain or polite form + から", "から following a clause means 'because' — it gives the reason or cause for something. The clause before から can be in either plain or polite form (though plain is more common in casual speech, polite in formal speech). から tends to be used when the speaker is giving a subjective reason or justification. It differs from ので (softer, more objective reason) in feel.", ["から is more subjective/assertive than ので.", "Can appear at the end of a sentence as an explanation: だから ('that's why')."], "時間がないから、急ぎます。", "Because I don't have time, I'll hurry.", "jld"], ["o.nakereba-naranai-nakute-wa-ikenai", "N5", "a", "なければならない", "なければならない", "must; have to", "〜なければならない / 〜なくてはいけない", "Formation: Verb-nai stem + なければならない / Verb-nai stem + なくてはいけない", [], "明日は6時に起きなければなりません。", "I have to get up at six tomorrow.", "oj"], ["o.nakute-mo-ii", "N5", "a", "なくてもいい", "なくてもいい", "don't have to; need not", "〜なくてもいい", "Formation: Verb-nai stem + なくてもいい", [], "明日は学校へ来なくてもいいです。", "You don't have to come to school tomorrow.", "oj"], ["o.ga-suki-ga-kirai", "N5", "dict", "のが好き", "のがすき", "like; dislike", "〜が好き / 〜が嫌い", "Formation: Noun + が好き / Noun + が嫌い / Verb-dict + の + が好き", [], "私は甘いものが好きです。", "I like sweet things.", "oj"], ["o.dake", "N5", "dict", "だけ", "だけ", "only; just", "〜だけ", "Formation: Noun + だけ / Verb-dict + だけ", [], "財布に100円だけあります。", "I only have 100 yen in my wallet.", "oj"], ["o.te-kudasaru-te-itadaku", "N4", "te", "くださる", "くださる", "(honorific) someone kindly does for me; (humble) I receive the favor of someone doing", "〜てくださる / 〜ていただく", "Formation: Verb-te + くださる / Verb-te + いただく", [], "先生が私の作文を直してくださいました。", "My teacher kindly corrected my essay.", "oj"], ["o.tsumori", "N4", "n", "ないつもり", "ないつもり", "intend to; plan to", "〜つもり", "Formation: Verb-dict / Verb-nai + つもり", [], "夏休みは北海道を旅行するつもりです。", "I intend to travel around Hokkaido during the summer break.", "oj"], ["o.yotei", "N4", "dict", "予定", "よてい", "plan to; be scheduled to", "〜予定", "Formation: Verb-dict + 予定 / Noun + の + 予定", [], "来月、大阪に引っ越す予定です。", "I'm planning to move to Osaka next month.", "oj"], ["o.you-ni", "N4", "n", "ないように", "ないように", "so that; in order that", "〜ように（purpose）", "Formation: Verb-dict / Verb-nai + ように", [], "後ろの人にも聞こえるように、大きな声で話してください。", "Please speak loudly so that the people in the back can hear too.", "oj"], ["o.you-ni-suru", "N4", "n", "ないようにする", "ないようにする", "try to; make sure to; make a habit of", "〜ようにする", "Formation: Verb-dict / Verb-nai + ようにする", [], "毎日野菜を食べるようにしています。", "I make a point of eating vegetables every day.", "oj"], ["o.you-ni-naru", "N4", "n", "ないようになる", "ないようになる", "come to; reach the point where (change in ability or habit)", "〜ようになる", "Formation: Verb-dict / Verb-nai + ようになる", [], "練習して、自転車に乗れるようになりました。", "After practicing, I became able to ride a bike.", "oj"], ["o.made-ni", "N4", "dict", "までに", "までに", "by (a deadline); before", "〜までに", "Formation: Noun / Verb-dict + までに", [], "レポートは金曜日までに出してください。", "Please hand in the report by Friday.", "oj"], ["o.koto-ga-aru", "N4", "n", "ないことがある", "ないことがある", "sometimes; there are times when", "〜ことがある", "Formation: V function vtable(){ // passive / causative table in 未然形
  const S=cur, g=S.cls==="godan", ic=S.cls==="ichidan", irr=!g&&!ic;

    if(mode==="pattern"||!isMine) return `<td class="${isMine||mode==="pattern"?"":"dim"}"><div class="r${selId===R.id?" sel":""}" data-id="${R.id}"><span class="f"><span class="sf">${pat}</span></span></div></td>`;
    const v=[compute(R)].flat().filter(Boolean);
    return `<td><div class="r${selId===R.id?" sel":""}" data-id="${R.id}"><span class="f">${v.map(fmtPair).join("<span class='st'> / </span>")||"—"}</span></div></td>`;};
  const two=(id,base,gp,ip,lab,ga,ia)=>{
    const R={id,base,suf:"",gloss:lab,pat:(gp+" / "+ip)};
    if(irr && mode==="verb"){REG[id]=R; const v=[compute(R)].flat().filter(Boolean);
      return `<tr><td colspan="2" class="mid">${lab}</td></tr><tr><td colspan="2" class="cf"><div class="r${selId===id?" sel":""}" data-id="${id}"><span class="f">${v.map(fmtPair).join(" / ")}</span><span class="g">(${S.cls==="suru"?"する":"来る"} irreg.)</span></div></td></tr>`;}
    return `<tr><td colspan="2" class="mid">${lab}</td></tr><tr>${cell(R,`<span class="godanc">${gp}</span>`,g)}${cell(R,`<span class="ichic" style="float:right">${ip}</span>`,ic)}</tr>`+
      (ga||ia?`<tr><td class="tiny">${ga||""}</td><td class="tiny" style="text-align:right">${ia||""}</td></tr>`:"");
  };
  return `<table class="vt"><tr><th>五段</th><th class="i">一段</th></tr>
